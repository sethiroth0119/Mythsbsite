// ===== SHOP PAGE (ex-Pledge) =====
// Manifesto on the future of digital ownership + Founder & Node packages.
// Reached from the signed-in navbar's "Shop" button. Buy Now tiers create a
// Stripe Checkout Session via the pledge-checkout edge function; the three
// top founder tiers stay Coming Soon.
const PledgePage = ({ client, session, onSignIn }) => {
  // Learn-more modal toggle for the PSN lore drop-down.
  const [psnOpen, setPsnOpen] = useState(false);
  // Stripe checkout state — which tier's button is busy + last error/notice.
  const [buyingId, setBuyingId] = useState('');
  const [shopMsg, setShopMsg] = useState(null);
  // Confirmed purchase → success modal ({tier_name, amount_cents, granted}).
  const [paidInfo, setPaidInfo] = useState(null);
  // Returning from Stripe: verify the session server-side (the Worker re-reads
  // it from Stripe with the secret key and records the purchase) — never trust
  // the ?pledge_paid flag on its own, a URL can be typed by anyone.
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        const q = new URLSearchParams(window.location.search);
        if (q.get('pledge_cancel')) { setShopMsg({ ok: false, text: 'Checkout cancelled — your card was not charged.' }); return; }
        if (!q.get('pledge_paid')) return;
        const sid = q.get('sid') || '';
        if (!sid || !session) { setShopMsg({ ok: true, text: '✓ Payment received — thank you! Your package will appear on your account shortly.' }); return; }
        setShopMsg({ ok: true, text: 'Confirming your payment…' });
        const r = await fetch(SHOP_API + '/api/shop/confirm?sid=' + encodeURIComponent(sid), {
          headers: { 'Authorization': 'Bearer ' + session.access_token },
        });
        const j = await r.json().catch(() => ({}));
        if (dead) return;
        if (j && j.ok) {
          setShopMsg(null);
          setPaidInfo({ tier_name: j.tier_name, amount_cents: j.amount_cents, granted: j.granted });
          try { window.history.replaceState({}, '', window.location.pathname); } catch (e) {}
        } else {
          setShopMsg({ ok: true, text: '✓ Payment received — thank you! Your package will appear on your account shortly.' });
        }
      } catch (e) {
        if (!dead) setShopMsg({ ok: true, text: '✓ Payment received — thank you! Your package will appear on your account shortly.' });
      }
    })();
    return () => { dead = true; };
  }, [session]);
  const buyTier = async (tier) => {
    if (!session) { setShopMsg({ ok: false, text: 'Sign in first — your package is delivered to your account.' }); if (onSignIn) onSignIn(); return; }
    if (buyingId) return;
    setBuyingId(tier.id); setShopMsg(null);
    try {
      const r = await fetch(SHOP_API + '/api/shop/checkout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token,
        },
        body: JSON.stringify({ tier: tier.id }),
      });
      const j = await r.json().catch(() => ({}));
      if (j && j.url) { window.location.href = j.url; return; }
      setShopMsg({ ok: false, text:
        j.error === 'sold_out' ? 'That package is sold out — all seats are taken.'
        : j.error === 'stripe_not_configured' ? 'Checkout is opening soon — payments aren’t switched on quite yet.'
        : 'Could not start checkout — please try again.' });
    } catch (e) { setShopMsg({ ok: false, text: 'Could not start checkout — please try again.' }); }
    setBuyingId('');
    try { const h = document.getElementById('shop-tiers-head'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  };
  // Section wrapper that gives each block the same dark glass treatment.
  const Block = ({ tone = 'neutral', children }) => {
    const tones = {
      neutral: 'from-stone-900/55 to-black/55 border-stone-700/50',
      warn:    'from-red-950/40 to-black/55 border-red-700/40',
      amber:   'from-amber-950/30 to-black/55 border-amber-600/40',
      violet:  'from-purple-950/35 to-black/55 border-purple-700/40',
      teal:    'from-emerald-950/30 to-black/55 border-emerald-700/40',
    };
    return (
      <div className={`bg-gradient-to-br ${tones[tone] || tones.neutral} border rounded-lg p-7 md:p-9`} style={{ boxShadow: '0 8px 28px rgba(0,0,0,0.45)' }}>
        {children}
      </div>
    );
  };

  return (
    <div className="pt-20">
      <section className="relative pt-16 pb-12 px-6 overflow-hidden">
        {/* Atmospheric backdrop — amber and violet glow, "monastic" feel */}
        <div className="absolute inset-0 pointer-events-none" style={{
          background:
            'radial-gradient(ellipse at 20% 10%, rgba(255,180,80,0.10) 0%, transparent 55%),' +
            'radial-gradient(ellipse at 80% 90%, rgba(168,80,220,0.10) 0%, transparent 55%),' +
            'linear-gradient(180deg, rgba(8,4,16,0.5) 0%, rgba(8,4,16,0.0) 100%)',
        }} />
        <HazardStripe className="absolute top-0 left-0 right-0" />

        <div className="max-w-4xl mx-auto relative">

          {/* ===== Header ===== */}
          <div className="text-center mb-12">
            <div className="text-amber-300/80 text-xs tracking-[0.4em] uppercase mb-3">— The Shop —</div>
            <DistressedHeading className="text-5xl md:text-7xl font-serif font-bold text-yellow-100 mb-5">
              The Future of Ownership Is Changing
            </DistressedHeading>
            <p className="text-stone-300 max-w-3xl mx-auto text-lg leading-relaxed">
              Not speculative hype. Not meaningless JPEGs. Not empty NFT projects designed only for flipping.
            </p>
            <p className="text-amber-200 max-w-3xl mx-auto text-xl leading-relaxed font-bold mt-3">
              Digital assets that people can truly use, trade, earn, and build around inside meaningful ecosystems.
            </p>
          </div>

          {/* ===== Opening — the joke that stopped being a joke ===== */}
          <div className="mb-10">
            <Block>
              <p className="text-stone-200 text-lg leading-relaxed mb-5">
                There is a phrase that used to sound like a joke or some impossible conspiracy theory:
              </p>
              <blockquote className="text-yellow-100 font-serif italic text-2xl md:text-3xl leading-snug border-l-4 border-red-500/70 pl-6 my-6" style={{ textShadow: '0 2px 6px rgba(0,0,0,0.85)' }}>
                "You will own nothing and be happy."
              </blockquote>
              <p className="text-stone-200 text-lg leading-relaxed mb-4">
                But every year, that idea feels less like fiction and more like reality.
              </p>
              <p className="text-stone-200 text-lg leading-relaxed mb-4">
                We are watching ownership slowly disappear in real time.
              </p>
              <p className="text-stone-300 leading-relaxed mb-4">
                As this was being written, Amazon announced changes to its cloud gaming service Amazon Luna involving the removal of certain games from player libraries. Situations like this continue to remind people that much of what we "buy" digitally today is often just a temporary license controlled by corporations.
              </p>
              <p className="text-stone-200 text-lg leading-relaxed">
                The truth is simple: <strong className="text-amber-200">modern consumers are increasingly renting access instead of owning products.</strong>
              </p>
            </Block>
          </div>

          {/* ===== The generational reality ===== */}
          <div className="mb-10">
            <Block tone="warn">
              <DistressedHeading level="h2" className="text-3xl md:text-4xl font-serif font-bold text-yellow-100 mb-4">A Generation Locked Out</DistressedHeading>
              <p className="text-stone-300 leading-relaxed mb-4">
                For younger generations, the situation feels even worse.

            </div>
            <p className="text-center text-stone-500 text-xs uppercase tracking-widest mt-8">

// ===== NEWS PAGE =====
// Card list of NEWS_POSTS in reverse-chronological order. Each card stays
// neat — chip, date, title, summary. Clicking "Read Full" opens a modal
// with the full body.
//
// Body renderer supports:
//   • "## "  — section heading (h2)
//   • "### " — sub-heading   (h3)
//   • "• "   — bullet (consecutive bullets group into a list)
//   • anything else — paragraph
const renderNewsBody = (body) => {
  const out = [];
  let bulletBuf = [];
  const flushBullets = (keyBase) => {
    if (!bulletBuf.length) return;
    out.push(
      <ul key={`b-${keyBase}`} className="text-stone-300 leading-relaxed space-y-1.5 my-3 pl-1">
        {bulletBuf.map((b, j) => (
          <li key={j} className="flex items-start gap-2"><span className="text-orange-500/80 mt-0.5 shrink-0">▸</span><span>{b}</span></li>
        ))}
      </ul>
    );
    bulletBuf = [];
  };
  body.forEach((line, i) => {
    if (line.startsWith('• ')) {
      bulletBuf.push(line.slice(2));
    } else if (line.startsWith('### ')) {
      flushBullets(i);
      out.push(<h4 key={i} className="text-orange-200 font-serif font-bold text-lg mt-5 mb-2 tracking-wide">{line.slice(4)}</h4>);
    } else if (line.startsWith('## ')) {
      flushBullets(i);
      out.push(<h3 key={i} className="text-yellow-100 font-serif font-bold text-2xl mt-7 mb-3 tracking-wide border-b border-orange-600/30 pb-2">{line.slice(3)}</h3>);
    } else {
      flushBullets(i);
      out.push(<p key={i} className="text-stone-300 leading-relaxed my-3">{line}</p>);
    }
  });
  flushBullets('end');
  return out;
};

const newsCategoryStyle = (cat) => {
  switch (cat) {
    case 'Patch Notes':  return 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200';
    case 'Devlog':       return 'bg-purple-500/10 border-purple-500/40 text-purple-200';
    case 'Announcement': return 'bg-amber-500/10 border-amber-500/40 text-amber-200';
    case 'Event':        return 'bg-red-500/10 border-red-500/40 text-red-200';
    default:             return 'bg-stone-500/10 border-stone-500/40 text-stone-200';
  }
};

// Full-screen modal that shows a single post's complete body. Click backdrop
// or the × button to close; Esc also closes.
const NewsPostModal = ({ post, onClose }) => {
  useEffect(() => {
    if (!post) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    // Lock body scroll while open so the page beneath doesn't move.
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [post, onClose]);
  if (!post) return null;
  return (
    <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-start justify-center p-4 md:p-8 overflow-y-auto" onClick={onClose} style={{ animation: 'rise 0.3s' }}>

// ── Final CTA + Newsletter — gatcg closes with a signup block; we pair the
//    Open-the-Spellbook CTA with it. Email is kept locally and mirrored to
//    Supabase best-effort (table may not exist yet — that's fine). ──
const GaSignup = () => {
  const [email, setEmail] = useState('');
  const [signed, setSigned] = useState(false);
  const handleSubmit = () => {
    if (!email.includes('@')) return;
    try {
      const list = JSON.parse(localStorage.getItem('ms_newsletter') || '[]');
      if (!list.includes(email)) { list.push(email); localStorage.setItem('ms_newsletter', JSON.stringify(list)); }
    } catch (e) {}
    // Best-effort cloud mirror — ignored if the table doesn't exist yet.
    try {
      const c = window.msSupabase ? window.msSupabase() : null;
      if (c) c.from('newsletter_signups').insert({ email }).then(() => {}, () => {});
    } catch (e) {}
    setSigned(true);
  };
  return (
    <GaSection
      title="Open the Spellbook"
      sub="Sign up, pick a hero, hit Find Match. Free to play, no download — it runs in your browser and syncs across devices."
    >
      <div className="flex gap-4 justify-center flex-wrap mb-16">
        <a href={PLAY_URL} className="ga-btn">Play Now — Free</a>
        <a href={LOGIN_URL} className="ga-btn ga-btn--ghost">Log In</a>
      </div>

      <div className="max-w-md mx-auto border-t border-white/10 pt-12">
        <h3 className="ga-heading text-2xl mb-2">Newsletter Sign Up</h3>
        <p className="text-neutral-400 text-sm mb-6">Be the first to hear about the latest news and updates!</p>
        {signed ? (
          <div className="text-neutral-200 ga-serif text-lg">You're on the list — welcome, Survivor.</div>
        ) : (
          <div className="flex gap-0 justify-center">
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') handleSubmit(); }}
              placeholder="Enter your email"
              className="flex-1 px-4 py-3 bg-black/60 border border-white/15 text-neutral-100 text-sm focus:outline-none focus:border-[#c9a86a]/70"
              style={{ borderRadius: '2px 0 0 2px', borderRight: 'none' }}
            />
            <button onClick={handleSubmit} className="ga-btn" style={{ borderRadius: '0 2px 2px 0' }}>Subscribe</button>
          </div>
        )}
      </div>
    </GaSection>
  );
};

/* ── thirdweb Insight — LIVE airdrop tracking ──
   Sums decoded Transfer events (treasury → member wallet) so "airdropped"
   is read from the chain instead of hand-recorded. Uses the project's PUBLIC
   clientId; Insight enforces the project's allowed-domain list, so this
   silently no-ops (falls back to admin-recorded figures) until
   mythicspellbook.xyz is added to the thirdweb project settings. */
const CBK_INSIGHT = 'https://insight.thirdweb.com/v1';
const CBK_INSIGHT_CID = 'b7af98162904c056669420a761f64c8e';
// Company wallets that send airdrops. Leave empty to auto-resolve to the
// token's current TOP HOLDER (the treasury holds the supply pre-distribution).
const CBK_AIRDROP_SENDERS = [];
let _cbkInsightDown = false;
let _cbkSendersP = null;
const cbkInsightGet = async (path) => {
  const r = await fetch(CBK_INSIGHT + path + (path.includes('?') ? '&' : '?') + 'chain=8453', { headers: { 'x-client-id': CBK_INSIGHT_CID } });
  if (!r.ok) throw new Error('insight ' + r.status);
  return r.json();
};
// Full transfer history of the token, fetched ONCE per session (the API
// ignores from/to filters, so filtering happens client-side — one fetch
// serves the whole roster). Verified live: /v1/tokens/transfers returns
// { data: [{ from_address, to_address, amount, token_type, transfer_type }] }.
let _cbkTransfersP = null;
const cbkAllTransfers = () => {
  if (!_cbkTransfersP) {
    _cbkTransfersP = (async () => {
      const all = [];
      for (let page = 0; page < 10; page++) {
        const j = await cbkInsightGet('/tokens/transfers?contract_address=' + CBK_CONTRACT + '&limit=500&page=' + page);
        const rows = (j && j.data) || [];
        all.push(...rows);
        if (rows.length < 500) break;
      }
      return all;
    })().catch(e => { _cbkTransfersP = null; throw e; });
  }
  return _cbkTransfersP;
};
// Airdrop senders: the pinned list, or auto-derived = the token's TOP HOLDER
// (treasury) plus the original mint recipient (deployer) — the wallets
// company distributions realistically come from today.
const cbkAirdropSenders = () => {
  if (CBK_AIRDROP_SENDERS.length) return Promise.resolve(CBK_AIRDROP_SENDERS.map(a => a.toLowerCase()));
  if (!_cbkSendersP) {
    _cbkSendersP = Promise.all([
      cbkInsightGet('/tokens/owners?contract_address=' + CBK_CONTRACT + '&limit=1'),
      cbkAllTransfers(),
    ]).then(([own, rows]) => {
      const set = new Set();
      const top = own && own.data && own.data[0] && own.data[0].owner_address;
      if (top) set.add(String(top).toLowerCase());
      (rows || []).forEach(t => { if (t && t.transfer_type === 'mint' && t.to_address) set.add(String(t.to_address).toLowerCase()); });
      return Array.from(set);
    }).catch(e => { _cbkSendersP = null; throw e; });
  }
  return _cbkSendersP;
};
// Total MT ever transferred from the treasury sender(s) to `wallet`, in
// whole tokens — or null when Insight is unavailable. Callers must treat
// null as "no live data".
const cbkFetchAirdropped = async (wallet) => {
  if (_cbkInsightDown || !wallet) return null;
  try {
    const [senders, rows] = await Promise.all([cbkAirdropSenders(), cbkAllTransfers()]);
    if (!senders.length) return null;
    const w = wallet.toLowerCase();
    if (senders.includes(w)) return 0; // the treasury itself isn't airdropped-to
    let total = 0n;
    for (const t of rows) {
      if (!t || t.token_type !== 'erc20') continue;
      if (String(t.to_address || '').toLowerCase() !== w) continue;
      if (!senders.includes(String(t.from_address || '').toLowerCase())) continue;
      try { total += BigInt(String(t.amount || '0')); } catch (e) {}
    }
    return cbkFromWei(total);
  } catch (e) {
    _cbkInsightDown = true; // stop retrying a blocked API this session
    return null;
  }
};

const cbkPad = (hex) => hex.replace(/^0x/, '').padStart(64, '0');
const cbkPadN = (n) => BigInt(n).toString(16).padStart(64, '0');
const cbkWord = (data, i) => BigInt('0x' + data.replace(/^0x/, '').slice(i * 64, i * 64 + 64));
const CBK_WEI = 1000000000000000000n; // MT has 18 decimals (verified on-chain)
const cbkFromWei = (v) => Number(v / 10000000000000000n) / 100; // 2dp, safe range
const cbkToWei = (s) => { const [a, b = ''] = String(s).split('.'); return BigInt(a || 0) * CBK_WEI + BigInt((b + '000000000000000000').slice(0, 18)); };

  const basePower = (p.power && p.power.power) || 0;
  const totalPower = basePower + (localPower || 0);
  // Level/XP come from the published catalog (what the game shows), then the
  // preview-power overlay is layered on top.
  const xpMax = p.catXpReq || CBK_XP_PER_LEVEL;
  const baseLevel = (p.power && p.power.level) || p.catLevel || 1;
  const rawXp = (p.catXp || 0) + (localPower || 0);
  const level = Math.min(CBK_LEVEL_MAX, baseLevel + Math.floor(rawXp / xpMax));
  const atMax = level >= CBK_LEVEL_MAX;
  const xp = atMax ? xpMax : rawXp % xpMax;
  // Cinder-per-cycle: the catalog rate is the value AT the node's current
  // level, so scale it per level rather than deriving a second curve.
  const perLevel = (p.cinderRate || 25) / Math.max(1, p.catLevel || 1);
  const cinderCycle = Math.round(perLevel * level);
  const nextCinder = Math.round(perLevel * (level + 1));
  const mins = recon && recon.updated_at ? Math.floor((Date.now() - new Date(recon.updated_at).getTime()) / 60000) : null;
  const sync = mins === null ? 'never' : mins <= 15 ? 'fresh' : 'stale';
  const pct = (a, b) => (b > 0 ? Math.min(100, Math.round((a / b) * 100)) : 0);
  const capK = recon && recon.civilians_total ? (recon.civilians_total / 1000).toFixed(1) + 'K' : '10.0K';
  const civPct = recon ? Math.round((pct(recon.buildings_restored, recon.buildings_total) + pct(recon.roads_repaired, recon.roads_total) + pct(recon.civilians_saved, recon.civilians_total)) / 3) : 0;
  const vitals = recon ? [
    { label: 'NPC POPULATION', value: cbkFmt(recon.population), unit: '/ ' + capK, pct: pct(recon.population, recon.civilians_total) + '%', barColor: '#3ECF8E', trend: recon.residents ? `${cbkFmt(recon.residents)} RESIDENTS` : `${cbkFmt(recon.civilians_saved)} SAVED`, trendColor: '#8A7F6A' },
    { label: 'CORRUPTION', value: String(recon.corruption || 0), unit: '%', pct: (recon.corruption || 0) + '%', barColor: (recon.corruption || 0) > 30 ? '#F0655A' : '#E8B34B', trend: (recon.corruption || 0) > 30 ? 'HIGH — RUN CAMPAIGNS' : 'CONTAINED', trendColor: (recon.corruption || 0) > 30 ? '#F0655A' : '#3ECF8E' },
    { label: 'CIVILIZATION', value: String(civPct), unit: '%', pct: civPct + '%', barColor: '#4BA3E8', trend: `${cbkFmt(recon.buildings_restored)} / ${cbkFmt(recon.buildings_total)} BUILDINGS`, trendColor: '#8A7F6A' },
    { label: 'TRADE STABILITY', value: String(recon.commerce || 0), unit: '%', pct: (recon.commerce || 0) + '%', barColor: '#E8B34B', trend: `${cbkFmt(recon.routes || 0)} ROUTES ACTIVE`, trendColor: '#8A7F6A' },
  ] : [
    { label: 'NPC POPULATION', value: '0', unit: '/ 10.0K', pct: '0%', barColor: '#3ECF8E', trend: 'AWAITING GAME LINK', trendColor: '#8A7F6A' },
    { label: 'CORRUPTION', value: '0', unit: '%', pct: '0%', barColor: '#E8B34B', trend: 'AWAITING GAME LINK', trendColor: '#8A7F6A' },
    { label: 'CIVILIZATION', value: '0', unit: '%', pct: '0%', barColor: '#4BA3E8', trend: 'AWAITING GAME LINK', trendColor: '#8A7F6A' },
    { label: 'TRADE STABILITY', value: '0', unit: '%', pct: '0%', barColor: '#E8B34B', trend: 'NO ROUTES', trendColor: '#8A7F6A' },
  ];
  return {
    level, atMax, xp, xpMax, cinderCycle, nextCinder,
    xpPct: Math.round((atMax ? 1 : xp / xpMax) * 100) + '%',
    xpLabel: atMax ? 'MAX LEVEL' : `${cbkFmt(xp)} / ${cbkFmt(xpMax)} XP`,
    sync, syncAgo: mins === null ? 'never' : cbkAgo(recon.updated_at),
    payout: (recon && recon.cinder_bank) || 0,
    lifetime: (recon && recon.cinder_total) || 0,
    totalPower, vitals,
    ownerPower: 100, playerPower: 25,
  };
};

  const [hasMM, setHasMM] = useState(typeof window !== 'undefined' && !!window.ethereum);

    let tries = 0;

    const t = setInterval(() => { if (seen() || ++tries > 24) clearInterval(t); }, 250);

  const mmConnect = async () => {
    if (!cbkDisclaimerAccepted()) { discNextRef.current = mmConnectNow; setDiscOpen(true); return; }

  // Buying the token is a token surface too — same disclaimer gate.

  const mmConnectNow = async () => {

    if (!hasMM) setHasMM(true);

      setMmAddr(accts[0]);
      const chain = await window.ethereum.request({ method: 'eth_chainId' });

        setMmChainOk(false);
        try {
          await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CBK_BASE_CHAIN_HEX }] });

          if (sw && sw.code === 4902) {

              await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CBK_BASE_CHAIN_HEX, chainName: 'Base', nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, rpcUrls: [CBK_RPC], blockExplorerUrls: ['https://basescan.org'] }] });

            } catch (e2) {}

        }

  };
  // React to account/chain switches in the extension.
  useEffect(() => {
    if (!hasMM) return;
    const onAccts = (a) => setMmAddr(a && a.length ? a[0] : null);
    const onChain = (c) => setMmChainOk(c === CBK_BASE_CHAIN_HEX);
    window.ethereum.on && window.ethereum.on('accountsChanged', onAccts);
    window.ethereum.on && window.ethereum.on('chainChanged', onChain);
    return () => {
      window.ethereum.removeListener && window.ethereum.removeListener('accountsChanged', onAccts);
      window.ethereum.removeListener && window.ethereum.removeListener('chainChanged', onChain);
    };
  }, [hasMM]);
  // On-chain reads: wallet MT balance + live tiers + the wallet's positions.
  useEffect(() => {
    let dead = false;
    const load = async () => {
      try {
        // TRUE on-chain MT balance — the connected MetaMask account first,
        // else the account-linked wallet, read straight from the token
        // contract on Base. This is the number users should see as "their MT".
        const balTarget = mmAddr || (wallet && wallet.wallet_address) || null;
        if (balTarget) {
          const bal = await cbkEthCall(CBK_CONTRACT, CBK_SEL.balanceOf + cbkPad(balTarget));
          if (!dead) setMmBal(BigInt(bal));
        } else setMmBal(null);
        if (CBK_STAKING_ADDRESS) {
          const nHex = await cbkEthCall(CBK_STAKING_ADDRESS, CBK_SEL.tierCount);
          const n = Number(BigInt(nHex));
          const tiers = [];
          for (let i = 0; i < n; i++) {
            const t = await cbkEthCall(CBK_STAKING_ADDRESS, CBK_SEL.getTier + cbkPadN(i));
            const [lock, apr, active, cap, reserved] = [cbkWord(t, 0), cbkWord(t, 1), cbkWord(t, 2), cbkWord(t, 3), cbkWord(t, 4)];
            const maxHex = await cbkEthCall(CBK_STAKING_ADDRESS, CBK_SEL.maxStakeInTier + cbkPadN(i));
            tiers.push({ id: i, days: Number(lock / 86400n), aprBps: Number(apr), active: active === 1n, cap, reserved, maxStake: BigInt(maxHex) });
          }
          if (!dead) setMmTiers(tiers);
          if (mmAddr) {
            const p = await cbkEthCall(CBK_STAKING_ADDRESS, CBK_SEL.getPositions + cbkPad(mmAddr));
            const len = Number(cbkWord(p, 1));
            const rows = [];
            for (let i = 0; i < len; i++) {
              const o = 2 + i * 6;
              rows.push({ id: i, principal: cbkWord(p, o), reward: cbkWord(p, o + 1), start: Number(cbkWord(p, o + 2)), unlock: Number(cbkWord(p, o + 3)), tierId: Number(cbkWord(p, o + 4)), closed: cbkWord(p, o + 5) === 1n });
            }
            if (!dead) setMmPositions(rows);
          }
        }
      } catch (e) { /* RPC hiccup — next tick retries */ }
    };
    load();
    const t = setInterval(load, 30000);
    return () => { dead = true; clearInterval(t); };
  }, [mmAddr, wallet, reloadN]);

  // Send a MetaMask transaction and wait for it to land on Base.

  const [mcapLive, setMcapLive] = useState(() => {

  const [modal, setModal] = useState(null);      // lock-Cinder backing modal
  const [buyModal, setBuyModal] = useState(null); // buy-tokens preview modal

      client.from('mythic_balances').select('mt').eq('user_id', session.user.id).maybeSingle(),

    ]).then(([o, r, pw, b, v, bl, po, vo, pa, mb, oa]) => {

  // Neither reachable → keep last cached reading, else render N/A. Never a
  // made-up number — this must match what the chain actually says.
  useEffect(() => {
    let dead = false;
    const save = (v, src) => {
      if (dead || !(v >= 0)) return;
      const rec = { v, src, t: Date.now() };
      setMcapLive(rec);
      try { localStorage.setItem('ms_cbk_mcap', JSON.stringify(rec)); } catch (e) {}
    };
    const load = async () => {
      try {
        const r = await fetch('https://api.dexscreener.com/latest/dex/tokens/' + CBK_CONTRACT);
        const j = await r.json();
        const pairs = (j && j.pairs) || [];
        if (pairs.length) {
          const best = pairs.reduce((a, b) => (((b.liquidity && b.liquidity.usd) || 0) > ((a.liquidity && a.liquidity.usd) || 0) ? b : a));
          const v = Number(best.marketCap || best.fdv);
          if (v > 0) { save(v, 'dex'); return; }
        }
      } catch (e) {}
      try {
        const call = (data) => fetch('https://mainnet.base.org', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: CBK_CONTRACT, data }, 'latest'] }),

        const [supplyHex, decHex] = await Promise.all([call('0x18160ddd'), call('0x313ce567')]);
        if (supplyHex && supplyHex !== '0x') {
          const decimals = decHex && decHex !== '0x' ? parseInt(decHex, 16) : 18;

          save(supply * CBK_MT_PRICE_USD, 'chain');

    load();
    const t = setInterval(load, 300000); // refresh every 5 minutes

          mode: ethosBuy.mode,
          powerRate: ethosBuy.mode === 'owner' ? 100 : 25,
          // '' = pre-launch: the modal routes the purchase to thirdweb. Set the

          apiBase: '',

    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [ethosBuy]);

  // Poll telemetry every 45s so the panels stay fresh (handoff: 30–60s).
  useEffect(() => {
    if (!client) return;
    const t = setInterval(() => setReloadN(n => n + 1), 45000);
    return () => clearInterval(t);
  }, [client, session]);

  // VIP Room roles — admin from the site's admin list, membership from the
  // vip_members roster (server-enforced via RLS; the UI checks are cosmetic).
  const myEmail = session && session.user ? (session.user.email || '') : '';
  const isAdmin = isAdminEmail(myEmail);
  const isVip = !!(session && vips.some(v => v.user_id === session.user.id));

  const vipSearch = async () => {
    const qstr = vipQ.trim();
    if (!client || qstr.length < 2) { setVipResults([]); return; }
    const { data } = await client.from('user_profiles').select('user_id, display_name').ilike('display_name', '%' + qstr + '%').limit(8);
    setVipResults(data || []);
  };
  const addVip = async (u) => {
    if (!isAdmin || busy) return;
    setBusy(true);
    const { error } = await client.from('vip_members').insert({ user_id: u.user_id, display_name: u.display_name || 'Survivor', tier: vipTier, added_by: session.user.id });
    if (error) setNotice(error.code === '23505' ? 'That player is already in the VIP Room.' : 'Could not add VIP — try again.');
    setBusy(false); setVipResults(null); setVipQ(''); setReloadN(n => n + 1);
  };
  const removeVip = async (v) => {
    if (!isAdmin || busy) return;
    setBusy(true);
    await client.from('vip_members').delete().eq('user_id', v.user_id);
    setBusy(false); setReloadN(n => n + 1);
  };
  const setVipMemberTier = async (v, tier) => {
    if (!isAdmin || busy) return;
    await client.from('vip_members').update({ tier }).eq('user_id', v.user_id);
    setReloadN(n => n + 1);
  };
  // Admin edits to a member's token figures (holdings / airdropped).
  const saveVipNumbers = async (v, patch) => {
    if (!isAdmin) return;
    const { error } = await client.from('vip_members').update(patch).eq('user_id', v.user_id);
    if (error) setNotice('Could not save — try again.');
    setReloadN(n => n + 1);
  };
  // Type-ahead: player names pop up from user management as the admin types.
  useEffect(() => {
    if (!isAdmin) return;
    const q2 = vipQ.trim();
    if (q2.length < 2) { setVipResults(null); return; }
    const t = setTimeout(() => { vipSearch(); }, 300);
    return () => clearTimeout(t);
  }, [vipQ, isAdmin]);
  // Linked wallets + LIVE on-chain MT for every roster member (balanceOf
  // straight from the token contract — the "from our thirdweb" number).
  const [vipWallets, setVipWallets] = useState({});
  // The signed-in member's OWN live airdropped total (their linked wallet).
  const [myAirLive, setMyAirLive] = useState(null);
  useEffect(() => {
    if (!wallet || !wallet.wallet_address || !isVip) { setMyAirLive(null); return; }
    let dead = false;
    cbkFetchAirdropped(wallet.wallet_address).then(v => { if (!dead) setMyAirLive(v); });
    return () => { dead = true; };
  }, [wallet, isVip]);
  useEffect(() => {
    if (!client || !session || vips.length === 0) { setVipWallets({}); return; }
    let dead = false;
    (async () => {
      try {
        const ids = vips.map(v => v.user_id);
        const { data } = await client.from('ownership_accounts').select('player_id, wallet_address').in('player_id', ids);
        const map = {};
        (data || []).forEach(row => { if (row.wallet_address) map[row.player_id] = { addr: row.wallet_address, bal: null }; });
        if (dead) return;
        setVipWallets(Object.assign({}, map));
        for (const uid2 of Object.keys(map)) {
          try {
            const balHex = await cbkEthCall(CBK_CONTRACT, CBK_SEL.balanceOf + cbkPad(map[uid2].addr));
            map[uid2] = { addr: map[uid2].addr, bal: cbkFromWei(BigInt(balHex)), air: null };
          } catch (e) {}
          // LIVE airdropped total from thirdweb Insight (null until the site
          // domain is allowlisted in the thirdweb project — silent fallback).
          try { map[uid2] = Object.assign({}, map[uid2], { air: await cbkFetchAirdropped(map[uid2].addr) }); } catch (e) {}
        }
        if (!dead) setVipWallets(Object.assign({}, map));
      } catch (e) {}
    })();
    return () => { dead = true; };
  }, [client, session, vips]);

  // ── Become a Builder: submit the wizard as a real profile row ──
  const submitBuilder = async () => {
    if (!client || !session || busy) return;
    const def = CBK_BUILDER_TYPES.find(b => b.type === createType);
    if (!def || !cf.name.trim()) return;
    setBusy(true);
    const { data, error } = await client.from('cinder_builders').insert({
      user_id: session.user.id, name: cf.name.trim(), btype: createType,
      location: cf.location.trim() || 'Unspecified', bio: cf.bio.trim(),
      goal: cf.goal.trim(), node_name: createType === 'Node' ? cf.nodeName.trim() : null,
    }).select().maybeSingle();
    setBusy(false);
    if (error || !data) { setNotice('Could not submit your Builder profile — try again.'); return; }
    setCreatedId('builder-' + data.id);
    setCreateStep(4);
    setReloadN(n => n + 1);
  };

  // ── Community feed: builder updates + polls ──
  const publishPost = async () => {
    const t = newPost.trim();
    if (!t || !client || !session || busy) return;
    setBusy(true);
    await client.from('cinder_posts').insert({ profile_id: selectedId, author_id: session.user.id, author_name: displayName, kind: 'update', body: t });
    setNewPost(''); setBusy(false); setReloadN(n => n + 1);
  };
  const publishPoll = async () => {
    const q2 = pollQ.trim();
    const opts = pollOpts.map(o => o.trim()).filter(Boolean);
    if (!q2 || opts.length < 2 || !client || !session || busy) return;
    setBusy(true);
    await client.from('cinder_posts').insert({ profile_id: selectedId, author_id: session.user.id, author_name: displayName, kind: 'poll', body: q2, options: opts });
    setPollQ(''); setPollOpts(['', '']); setBusy(false); setReloadN(n => n + 1);
  };
  // One vote per poll per account — upsert so changing your mind just moves it.
  const castVote = async (pollId, choice) => {
    if (!client || !session) return;
    await client.from('cinder_votes').upsert({ poll_id: pollId, user_id: session.user.id, choice }, { onConflict: 'poll_id,user_id' });
    setReloadN(n => n + 1);
  };
  const myVote = (pollId) => {
    const v = votes.find(x => x.poll_id === pollId && x.user_id === (session && session.user.id));
    return v ? v.choice : null;
  };
  const voteCounts = (pollId, optCount, base) => {
    const counts = Array.from({ length: optCount }, (_, i) => (base ? base[i] || 0 : 0));
    votes.filter(v => v.poll_id === pollId).forEach(v => { if (counts[v.choice] != null) counts[v.choice] += 1; });
    return counts;
  };

  // ── Campaign joins / event RSVPs ──
  const joined = (kind, refId) => parts.some(p => p.kind === kind && p.ref_id === refId && p.user_id === (session && session.user.id));
  const toggleJoin = async (kind, refId) => {
    if (!client || !session || busy) { if (!session && onSignIn) onSignIn(); return; }
    setBusy(true);
    if (joined(kind, refId)) await client.from('cinder_participation').delete().eq('kind', kind).eq('ref_id', refId).eq('user_id', session.user.id);
    else await client.from('cinder_participation').insert({ kind, ref_id: refId, user_id: session.user.id });
    setBusy(false); setReloadN(n => n + 1);
  };

  // Real nodes come from the published war-map catalog (same source the war
  // map renders), joined to ownership + live recon + power by node id.
  const ownerByNode = {};
  owners.forEach(o => { ownerByNode[o.node_id] = o; });
  const realNodes = catNodes.map(c => cbkNodeProfile(c, ownerByNode[c.id], recons[c.id], powers[c.id]));
  // Builder profiles players submitted through the wizard.
  const myBuilderProfiles = builders.map(b => ({
    id: 'builder-' + b.id, mine: b.user_id === (session && session.user.id), userMade: true,
    type: b.btype, name: b.name, location: b.location, hue: cbkHue(b.id),
    tier: 'BRONZE', backers: 0, points: 0, score: b.score, trust: b.trust, level: b.level,
    cap: b.capacity, status: b.status, nodeName: b.node_name, goal: b.goal,
    ownerName: null,
    tagline: b.bio || `New ${(CBK_BUILDER_TYPES.find(t => t.type === b.btype) || {}).title || b.btype} in the Sparta Ecosystem.`,
    perks: ['Backer badge on your profile', 'Early supporter recognition'],
    createdAt: b.created_at,
  }));
  const allProfiles = [...realNodes, ...myBuilderProfiles];
  const findProfile = (id) => allProfiles.find(p => p.id === id);
  const myNodes = session ? realNodes.filter(n => n.ownerUserId === session.user.id) : [];
  const ownsNode = (p) => !!(p && p.real && session && p.ownerUserId === session.user.id);

  const active = backings.filter(b => !b.released);
  const locked = active.reduce((s, b) => s + Number(b.amount), 0);
  const lockedCinder = active.filter(b => b.currency !== 'MT').reduce((s, b) => s + Number(b.amount), 0);
  const lockedMt = active.filter(b => b.currency === 'MT').reduce((s, b) => s + Number(b.amount), 0);
  // TRUE MT = on-chain wallet balance (connected or linked). The DB mirror
  // (mtBal) is the in-game balance that DB locks draw from.
  const mtChain = mmBal != null ? cbkFromWei(mmBal) : null;
  const mtTrue = mtChain != null ? mtChain : mtBal;
  const myPoints = backings.reduce((s, b) => s + (b.points || 0), 0);
  let rankIdx = CBK_RANKS.reduce((acc, r, i) => (myPoints >= r[1] ? i : acc), 0);
  const nextRank = CBK_RANKS[rankIdx + 1];
  const rankPct = nextRank ? Math.min(100, Math.round((myPoints - CBK_RANKS[rankIdx][1]) / (nextRank[1] - CBK_RANKS[rankIdx][1]) * 100)) + '%' : '100%';
  const rankLabel = nextRank ? `${cbkFmt(nextRank[1] - myPoints)} pts to ${nextRank[0]}` : 'Top rank achieved';

  // Achievements derived from real account state.
  const distinct = new Set(active.map(b => b.profile_id)).size;
  const backedProfiles = backings.map(b => findProfile(b.profile_id)).filter(Boolean);
  const earned = [];
  if (backings.length >= 1) earned.push('first_spark');
  if (backedProfiles.some(p => p.real && cbkTelemetry(p, prevPower(p.id)).level >= 2)) earned.push('trailblazer');
  if (distinct >= 3) earned.push('kindler');
  if (locked >= 10000) earned.push('flamekeeper');
  if (backedProfiles.some(p => p.type === 'Node' && p.tier === 'GOLD')) earned.push('patron');
  if (backedProfiles.some(p => p.type === 'Mentor') && backedProfiles.some(p => p.type === 'Program')) earned.push('scholar');

  const pushPost = (text) => savePrev({ ...prev, posts: [{ text, when: new Date().toISOString() }, ...prevPosts].slice(0, 30) });

  // ── Lock value behind a Builder. Two currencies, two very different paths:
  //  · CINDER comes out of the player's GAME account (user_profiles.gems),
  //    which the client owns under RLS — same mechanic as buying a pack.
  //  · MT (Mythic Token) is the on-chain asset. mythic_balances is read-only
  //    to the client, so the debit runs server-side through cinder_lock_mt,
  //    which verifies the caller, checks funds, moves the balance, writes the
  //    token ledger, and computes the points itself.
  const confirmLock = async () => {
    const m = modal;
    const amt = parseInt((m.amountStr || '').replace(/[^0-9]/g, '') || '0', 10);
    const isMt = m.cur === 'MT';
    const funds = isMt ? mtBal : gems;
    if (!amt || amt > funds || busy) return;
    setBusy(true);
    const p = findProfile(m.profileId);
    const mult = CBK_DUR.find(d => d.days === m.days).mult;
    const pts = Math.round(amt * mult / 10);

    if (isMt) {
      const { data, error } = await client.rpc('cinder_lock_mt', {
        p_profile_id: p.id, p_profile_name: p.name, p_profile_type: p.type,
        p_amount: amt, p_days: m.days,
      });
      setBusy(false);
      const res = data || {};
      if (error || !res.ok) {
        setNotice(res.error === 'insufficient_mt'
          ? `Not enough Mythic Token — your wallet balance is ${cbkFmt(res.balance || 0)} MT.`
          : 'Could not lock your Mythic Token — nothing was moved.');
        return;
      }
      setMtBal(Number(res.balance) || 0);
      pushPost(`You committed ${cbkFmt(amt)} MT behind ${p.name} (${m.days}-day commitment) — +${cbkFmt(res.points)} backing points.`);
      setReloadN(n => n + 1);
      setModal({ ...m, step: 3, confirmedAmount: amt, confirmedPoints: res.points });
      return;
    }

    const unlockAt = new Date(Date.now() + m.days * 864e5);
    const { error: e1 } = await client.from('user_profiles').update({ gems: gems - amt, updated_at: new Date().toISOString() }).eq('user_id', session.user.id);
    if (e1) { setBusy(false); setNotice('Could not reach your game balance — try again.'); return; }
    const { error: e2 } = await client.from('cinder_backings').insert({
      user_id: session.user.id, profile_id: p.id, profile_name: p.name, profile_type: p.type,
      amount: amt, days: m.days, points: pts, unlock_at: unlockAt.toISOString(), currency: 'CINDER',
    });
    if (e2) {
      await client.from('user_profiles').update({ gems, updated_at: new Date().toISOString() }).eq('user_id', session.user.id);
      setBusy(false); setNotice('Backing failed to save — your Cinder was returned.'); return;
    }
    pushPost(`You staked ${cbkFmt(amt)} CINDER behind ${p.name} (${m.days}-day commitment) — +${cbkFmt(pts)} backing points.`);
    refreshProfile(); setReloadN(n => n + 1); setBusy(false);
    setModal({ ...m, step: 3, confirmedAmount: amt, confirmedPoints: pts });
  };

  // ── Release a matured lock back to wherever it came from.
  const releaseLock = async (b) => {
    if (busy) return;
    setBusy(true);
    if (b.currency === 'MT') {
      const { data, error } = await client.rpc('cinder_release_mt', { p_backing_id: b.id });
      const res = data || {};
      if (!error && res.ok) {
        setMtBal(Number(res.balance) || 0);
        pushPost(`Unlocked ${cbkFmt(b.amount)} MT from ${b.profile_name} — returned to your wallet balance.`);
      } else if (res.error === 'not_releasable') {
        setNotice('That commitment has not matured yet.');
      }
      setReloadN(n => n + 1); setBusy(false); return;
    }
    const { data, error } = await client.from('cinder_backings')
      .update({ released: true, released_at: new Date().toISOString() })
      .eq('id', b.id).eq('released', false).select();
    if (!error && data && data.length) {
      await client.from('user_profiles').update({ gems: gems + Number(b.amount), updated_at: new Date().toISOString() }).eq('user_id', session.user.id);
      pushPost(`Unlocked ${cbkFmt(b.amount)} CINDER from ${b.profile_name} — returned to your game account.`);
      refreshProfile();
    }
    setReloadN(n => n + 1); setBusy(false);
  };

  // ── Buy-tokens PREVIEW settlement (local only, clearly labeled).
  const confirmBuy = () => {
    const bm = buyModal;
    const amt = parseInt((bm.amountStr || '').replace(/[^0-9]/g, '') || '0', 10);
    if (!amt) return;
    const p = findProfile(bm.profileId);
    const rate = bm.mode === 'owner' ? 100 : 25;
    const power = amt * rate;
    const before = prevPower(p.id);
    const t = cbkTelemetry(p, before);
    const leveled = !t.atMax && Math.floor((t.totalPower + power) / CBK_XP_PER_LEVEL) > Math.floor(t.totalPower / CBK_XP_PER_LEVEL);
    savePrev({
      ...prev,
      power: { ...(prev.power || {}), [p.id]: before + power },
      sold: { ...(prev.sold || {}), [p.id]: prevSold(p.id) + amt },
      posts: [{ text: `${bm.mode === 'owner' ? 'The Node owner' : 'A token holder'} bought ${cbkFmt(amt)} CINDER through ${p.name} — +${cbkFmt(power)} Node Power credited${leveled ? ', Node leveled up! 🎉' : '.'}`, when: new Date().toISOString() }, ...prevPosts].slice(0, 30),
    });
    setBuyModal({ ...bm, step: 2, confirmedAmount: amt, confirmedPower: power, leveledUp: leveled });
  };

  const openProfile = (id) => { setSelectedId(id); setScreen('profile'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const go = (s) => { setScreen(s); if (s !== 'profile') setSelectedId(null); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  // ── shared bits ──
  const card = { background: '#14161B', border: '1px solid #262A32', borderRadius: '14px' };
  const mono = { fontFamily: "'IBM Plex Mono', monospace" };
  const grotesk = { fontFamily: "'Space Grotesk', sans-serif" };
  // Builder Score / Community Trust: real nodes derive them from live
  // reconstruction health; user-made and showcase profiles carry their own.
  const decorate = (p) => {
    const r = p.recon;
    const civ = r && r.buildings_total ? Math.round((r.buildings_restored / r.buildings_total) * 100) : 0;
    const score = p.score != null ? p.score : (p.real ? Math.min(100, 40 + civ) : 70);
    const trust = p.trust != null ? p.trust : (p.real ? Math.max(0, 100 - (r ? r.corruption : 0)) : 80);
    return {
      ...p, typeLabel: CBK_TYPE_LABELS[p.type], initials: cbkInitials(p.name), avatarBg: cbkAvatarBg(p.hue),
      tierBg: CBK_TIERS[p.tier].bg, tierColor: CBK_TIERS[p.tier].color, pointsShown: p.points + prevPower(p.id),
      score, trust, lvl: p.level != null ? p.level : (p.real ? cbkTelemetry(p, prevPower(p.id)).level : 1),
      capLabel: `${cbkFmt(p.backers)} / ${cbkFmt(p.cap || 500)}`,
    };
  };

  const ProfileCard = ({ p }) => {
    const d = decorate(p);
    return (
      <div onClick={() => openProfile(p.id)} style={{ ...card, padding: '18px', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: '12px' }}
        onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#FF6A2B'; }} onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#262A32'; }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
          <div style={{ width: 46, height: 46, borderRadius: 12, background: d.avatarBg, display: 'flex', alignItems: 'center', justifyContent: 'center', ...grotesk, fontWeight: 700, fontSize: 16 }}>{d.initials}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ fontWeight: 600, fontSize: 15 }}>{d.name}</span>
              <span title={p.real ? 'Live game node' : 'Showcase profile'} style={{ color: p.real ? '#3ECF8E' : '#9BA1AB', fontSize: 13 }}>{p.real ? '✓' : '◌'}</span>
            </div>
            <div style={{ fontSize: 12, color: '#9BA1AB' }}>{p.real ? `${p.nodeDbId} · ${p.ownerName || 'Unclaimed'}` : d.typeLabel + ' · showcase'}</div>
          </div>
          <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.06em', padding: '4px 9px', borderRadius: 99, background: d.tierBg, color: d.tierColor }}>{p.tier}</span>
        </div>
        <div style={{ fontSize: 13, color: '#C6CAD1', lineHeight: 1.5 }}>{p.tagline}</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 11, fontWeight: 600, background: '#1B1E24', border: '1px solid #262A32', borderRadius: 99, padding: '4px 10px', color: '#E8B34B' }}>Score {d.score}</span>
          <span style={{ fontSize: 11, fontWeight: 600, background: '#1B1E24', border: '1px solid #262A32', borderRadius: 99, padding: '4px 10px', color: '#3ECF8E' }}>Trust {d.trust}</span>
          <span style={{ fontSize: 11, fontWeight: 600, background: '#1B1E24', border: '1px solid #262A32', borderRadius: 99, padding: '4px 10px', color: '#9BA1AB' }}>Lv {d.lvl}</span>
          {p.status === 'pending' && <span style={{ fontSize: 11, fontWeight: 600, background: 'rgba(232,179,75,.12)', border: '1px solid #33261A', borderRadius: 99, padding: '4px 10px', color: '#E8B34B' }}>Verification pending</span>}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid #1E222A', paddingTop: 12, gap: 8, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 12, color: '#9BA1AB' }}><span style={{ color: '#F2F3F5', fontWeight: 600 }}>{d.capLabel}</span> backers · <span style={{ color: '#E8B34B', fontWeight: 600 }}>{cbkFmt(d.pointsShown)}</span> pts</div>
          {session && (
            <button onClick={(e) => { e.stopPropagation(); setModal({ profileId: p.id, step: 1, amountStr: '', days: 90 }); }}
              style={{ background: 'rgba(255,106,43,.12)', color: '#FF8A55', border: '1px solid rgba(255,106,43,.3)', borderRadius: 8, padding: '6px 14px', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: "'IBM Plex Sans',sans-serif" }}>Back</button>
          )}
        </div>
      </div>
    );
  };

  // ── The five telemetry pieces for a Node profile (handoff §1–5). ──
  const NodeTelemetry = ({ p }) => {
    const t = cbkTelemetry(p, prevPower(p.id));
    const isOwner = ownsNode(p);
    const soldTotal = prevSold(p.id);
    const syncStyles = t.sync === 'fresh'
      ? { text: 'SYNCED ' + t.syncAgo, color: '#3ECF8E', bg: 'rgba(62,207,142,.12)', border: 'rgba(62,207,142,.3)', anim: 'emberPulse 1.8s infinite' }
      : t.sync === 'stale'
        ? { text: 'STALE ' + t.syncAgo, color: '#E8B34B', bg: 'rgba(232,179,75,.12)', border: 'rgba(232,179,75,.3)', anim: 'none' }
        : { text: 'NOT LINKED', color: '#5C626C', bg: 'rgba(92,98,108,.12)', border: 'rgba(92,98,108,.35)', anim: 'none' };
    const claimable = isOwner && t.payout > 0;
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        {/* 1 · Live sync header */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ ...mono, fontSize: 11, letterSpacing: '.16em', color: '#9BA1AB' }}>LIVE FROM MYTHIC SPELLBOOK</span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 5, ...mono, fontSize: 10, fontWeight: 600, letterSpacing: '.08em', padding: '3px 9px', borderRadius: 99, background: syncStyles.bg, color: syncStyles.color, border: '1px solid ' + syncStyles.border }}>
              <span style={{ width: 6, height: 6, borderRadius: 99, background: syncStyles.color, animation: syncStyles.anim }}></span>{syncStyles.text}
            </span>
          </div>
          <span style={{ ...mono, fontSize: 11, color: '#5C626C' }}>NODE ID {p.nodeDbId}</span>
        </div>

        {/* 2 · Node Power / Cinder Level */}
        <div style={{ background: 'linear-gradient(160deg,#1C1530,#150F22 70%)', border: '1px solid #33265C', borderRadius: 14, padding: 20, ...mono }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 14, flexWrap: 'wrap' }}>
            <div>

    const row = (title, cur, max, unit) => ({ title, desc: `${cbkFmt(cur)} of ${cbkFmt(max)} ${unit}.`, status: max > 0 && cur >= max ? 'done' : cur > 0 ? 'active' : 'locked' });
    return [

      row('Repair the road network', r.roads_repaired, r.roads_total, 'roads repaired'),

  };

  const msMap = {
    done: { icon: '✓', iconBg: 'rgba(62,207,142,.15)', iconColor: '#3ECF8E', badgeBg: 'rgba(62,207,142,.12)', badgeColor: '#3ECF8E', status: 'Verified', titleColor: '#F2F3F5' },

    { key: 'governance', label: 'Governance', icon: '⚖' },
    { key: 'vip', label: 'VIP Room', icon: '🏛' },
    { key: 'rewards', label: 'Rewards', icon: '✦' },
    { key: 'leaderboard', label: 'Rankings', icon: '♛' },

  const activeKey = screen === 'profile' ? 'discover' : (screen === 'player' ? 'people' : screen);

  const filters = ['All', 'City', 'Worker', 'Coach', 'Operations', 'Creator', 'Program'];
  const chipLabels = { All: 'All', Node: 'Nodes', Vendor: 'Vendors', Worker: 'Builders', Mentor: 'Mentors', Guild: 'Guilds', Creator: 'Creators', Program: 'Programs' };
  const q = search.toLowerCase();
  const filtered = allProfiles.filter(p => (filter === 'All' || p.type === filter) && (!q || (p.name + p.tagline + (p.ownerName || '') + CBK_TYPE_LABELS[p.type]).toLowerCase().includes(q)));

  const leaderMetric = { points: p => p.pointsShown, score: p => p.score, trust: p => p.trust, backers: p => p.backers };

  const leaderCaption = {
    points: 'Ranked by backing points + Node Power. Live district nodes carry a ✓.',
    score: 'Ranked by Builder Score — verified delivery, milestones, and reconstruction progress.',
    trust: 'Ranked by Community Trust — reliability as judged by the community and node health.',

  }[leaderTab];

  const screenTitles = { dashboard: 'Backer dashboard', discover: 'Discover Builders', stake: 'Stake Mythic Token', profile: 'Builder profile', create: 'Become a Builder', campaigns: 'Campaigns & events', governance: 'Community governance', rewards: 'Rewards & reputation', vip: 'VIP Room', leaderboard: 'Builder rankings' };

  // ── Market-cap airdrop milestones (dashboard + VIP room) ──
  // mcap = the token's REAL market cap (see the fetch effect above). null
  // means no data source answered yet → display N/A like thirdweb does, and
  // treat milestones as not reached.
  const mcap = mcapLive ? mcapLive.v : null;
  // ⚠ Milestones may ONLY be driven by a real traded market cap. The
  // on-chain fallback is supply × the in-game $0.10 sale price — a notional
  // figure, not a market cap. Counting it would mark the $1M reward tier
  // "reached" before a single token has ever traded, promising airdrops the
  // market has not earned. Until a DEX pool exists, progress is 0.
  const mcapIsMarket = !!(mcapLive && mcapLive.src === 'dex');
  const mcapN = mcapIsMarket ? (mcap || 0) : 0;
  const mcNext = CBK_MCAPS.find(d => d.cap > mcapN);
  const mcMaxCap = CBK_MCAPS[CBK_MCAPS.length - 1].cap;
  const mcPct = Math.min(100, Math.round((mcapN / mcMaxCap) * 100)) + '%';
  const mcFmtCap = (v) => (v == null ? 'N/A'
    : v >= 1000000 ? '$' + (Math.round(v / 10000) / 100) + 'M'
    : v >= 1000 ? '$' + (Math.round(v / 100) / 10) + 'K'
    : '$' + cbkFmt(v));
  const mcapPill = mcapLive

                const mult = CBK_TIER_MULT[tier] || 1;
                const rows = CBK_MCAPS.map(d => {
                  const amount = (CBK_DROP_BASE[d.label] || 0) * mult;
                  const hit = mcapN >= d.cap;
                  const isNext = mcNext && d.cap === mcNext.cap;
                  return { label: d.label, amount, status: hit ? 'Airdropped' : isNext ? 'Scheduled' : 'Pending', hit, isNext };

// ═══ REFERRAL SYSTEM (profile panel) ═══
// Share your code; every player who redeems it earns YOU 5,000 Cinder,
// 1 Birth Of Universe One pack, and 5 Aza Coin — granted server-side by
// referral_redeem() and delivered in-game (pack via the webPurchases rail).
// Referral milestones earn Mythic Token airdrops, delivered via thirdweb
// to the linked wallet.
const REF_MILESTONES = [
  { refs: 3, mt: 50 },
  { refs: 10, mt: 200 },
  { refs: 25, mt: 600 },
  { refs: 50, mt: 1500 },
  { refs: 100, mt: 4000 },
];
const HubReferralPanel = ({ client, session, refreshProfile }) => {
  const [me, setMe] = useState(null); // {code, referrals, redeemed}
  const [redeemCode, setRedeemCode] = useState(() => { try { return localStorage.getItem('ms_ref_code') || ''; } catch (e) { return ''; } });
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [copied, setCopied] = useState('');
  useEffect(() => {
    if (!client || !session) return;
    let dead = false;
    client.rpc('referral_me').then(({ data }) => { if (!dead && data && data.ok) setMe(data); });
    return () => { dead = true; };
  }, [client, session]);
  const refs = me ? (me.referrals || 0) : 0;
  const next = REF_MILESTONES.find(m => refs < m.refs);
  const segPct = next ? Math.min(100, Math.round((refs / next.refs) * 100)) : 100;
  const shareLink = me ? 'https://mythicspellbook.xyz/?ref=' + me.code : '';
  const copy = (label, text) => {
    try { navigator.clipboard.writeText(text); setCopied(label); setTimeout(() => setCopied(''), 1800); } catch (e) {}
  };
  const doRedeem = async () => {
    const c = redeemCode.trim();
    if (!c || busy) return;
    setBusy(true); setMsg(null);
    const { data, error } = await client.rpc('referral_redeem', { p_code: c });
    setBusy(false);
    const res = data || {};
    if (error || !res.ok) {
      setMsg({ err: true, text: res.error === 'self_referral' ? "That's your own code — share it, don't redeem it!"
        : res.error === 'already_redeemed' ? 'This account has already redeemed a referral code.'
        : res.error === 'same_ip' ? 'A referral was already redeemed from this network — referrals must come from new players on their own connection.'
        : res.error === 'ip_limit' ? 'This network has hit its referral limit for today — try again later.'
        : res.error === 'bad_code' ? "That code doesn't exist — check the spelling." : 'Could not redeem — try again.' });
      return;
    }
    setMsg({ err: false, text: '✓ Code accepted — you and ' + res.referrer_name + ' BOTH earned 5,000 🔥 Cinder, a Birth of the Universe I Booster Pack, and 5 👑 Aza Coins. Claim yours under Rewards & Gifts on your in-game Profile!' });
    setMe(me ? { ...me, redeemed: c.toUpperCase() } : me);
    try { localStorage.removeItem('ms_ref_code'); } catch (e) {}
    if (refreshProfile) refreshProfile();
  };
  return (
    <div className="bg-gradient-to-br from-stone-900/85 to-black/80 border border-emerald-500/35 rounded-lg overflow-hidden mb-8" style={{ boxShadow: '0 8px 24px rgba(0,0,0,0.5)' }}>
      <div className="flex items-center justify-between gap-2 px-5 py-3 border-b border-stone-700/50 bg-black/30 flex-wrap">
        <div className="flex items-center gap-2">
          <span className="text-emerald-300 text-base">🤝</span>
          <span className="text-emerald-300 text-xs tracking-[0.3em] uppercase font-bold">Referrals</span>
        </div>
        <span className="text-stone-400 text-xs">{refs.toLocaleString()} friend{refs === 1 ? '' : 's'} recruited</span>
      </div>
      <div className="p-5">
        {/* Your code + share */}
        <div className="flex items-center gap-3 flex-wrap mb-3">
          <div className="font-mono text-xl font-bold text-emerald-200 tracking-widest bg-black/50 border border-emerald-500/35 rounded px-4 py-2">{me ? me.code : '·······'}</div>
          <button onClick={() => me && copy('code', me.code)} className="text-[11px] tracking-widest uppercase font-bold text-emerald-200 border border-emerald-400/50 rounded px-3 py-2 hover:bg-emerald-500/15 transition">{copied === 'code' ? '✓ Copied' : 'Copy code'}</button>
          <button onClick={() => me && copy('link', shareLink)} className="text-[11px] tracking-widest uppercase font-bold text-emerald-200 border border-emerald-400/50 rounded px-3 py-2 hover:bg-emerald-500/15 transition">{copied === 'link' ? '✓ Copied' : 'Copy invite link'}</button>
        </div>
        <div className="text-stone-300 text-sm mb-4 leading-relaxed">
          Invite a friend to Mythic Spellbook and you'll <strong className="text-emerald-300">both</strong> be rewarded! Earn <strong className="text-orange-300">5,000 🔥 Cinder</strong>, <strong className="text-purple-300">1 Birth of the Universe I Booster Pack</strong>, and <strong className="text-sky-300">5 👑 Aza Coins</strong> when your referral qualifies — a 🎁 Claim button appears under Rewards & Gifts on your in-game Profile.
        </div>

        {/* MT airdrop progression */}
        <div className="bg-black/40 border border-stone-700/40 rounded p-4 mb-4">
          <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
            <span className="text-purple-300 text-[11px] tracking-[0.25em] uppercase font-bold">⬢ Mythic Token airdrop progress</span>
            <span className="text-stone-400 text-xs">{next ? `${refs} / ${next.refs} referrals → ${next.mt.toLocaleString()} MT` : 'All milestones reached!'}</span>
          </div>
          <div className="h-3 bg-stone-800 rounded-full overflow-hidden mb-3">
            <div className="h-full rounded-full transition-all" style={{ width: segPct + '%', background: 'linear-gradient(90deg,#7C6BFF,#B9A8E8)' }}></div>
          </div>
          <div className="flex gap-2 flex-wrap">
            {REF_MILESTONES.map(m => (
              <span key={m.refs} className="text-[11px] font-bold rounded-full px-3 py-1 border" style={refs >= m.refs
                ? { color: '#B9A8E8', borderColor: 'rgba(124,107,255,0.6)', background: 'rgba(124,107,255,0.15)' }
                : { color: '#78716c', borderColor: 'rgba(120,113,108,0.4)', background: 'rgba(0,0,0,0.3)' }}>
                {refs >= m.refs ? '✓ ' : ''}{m.refs} refs · {m.mt.toLocaleString()} MT
              </span>
            ))}
          </div>
          <div className="text-stone-500 text-[11px] mt-2">Milestone airdrops are delivered via thirdweb to your linked wallet.</div>
        </div>

        {/* Redeem a friend's code */}
        {me && me.redeemed ? (
          <div className="text-stone-400 text-sm">You redeemed <span className="font-mono text-emerald-300">{me.redeemed}</span> ✓</div>
        ) : (
          <div className="flex items-center gap-2 flex-wrap">
            <input value={redeemCode} onChange={(e) => setRedeemCode(e.target.value.toUpperCase())} onKeyDown={(e) => { if (e.key === 'Enter') doRedeem(); }} placeholder="Friend's code (MYTH-XXXXXX)"
              className="flex-1 min-w-[200px] px-3 py-2 bg-black/60 border border-stone-700 rounded text-yellow-100 font-mono focus:border-emerald-500 focus:outline-none" />
            <button onClick={doRedeem} disabled={busy} className="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-700 text-emerald-50 font-bold text-[12px] rounded tracking-widest uppercase transition border border-emerald-400/60 disabled:opacity-50">{busy ? '…' : 'Redeem'}</button>
          </div>
        )}
        {msg && <div className={'text-sm mt-3 ' + (msg.err ? 'text-red-300' : 'text-emerald-300')}>{msg.text}</div>}
      </div>
    </div>
  );
};

function App() {
  const [selectedCard, setSelectedCard] = useState(null);
  const [selectedHero, setSelectedHero] = useState(null);
  const [survivors, setSurvivors] = useState(14892);

  // ===== Page router — 'home' shows the marketing landing page; 'hub' shows
  // ===== the Player Hub (stats + Vendor Market). Toggled by the navbar button.
  const [currentPage, setCurrentPage] = useState('home');
  // 📡 Which Broadcast screen a deep link asked for: {screen, key}.
  const [ebEntry, setEbEntry] = useState(null);

  // ===== Supabase session — lifted up so the navbar can show "Player Profile"
  // ===== when the player is signed in. Refresh triggers a re-pull of the row.
  const [client, setClient] = useState(null);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [profileRefresh, setProfileRefresh] = useState(0);

  // Invite links (…/?ref=MYTH-XXXXXX) stash the code so the hub's referral
  // panel prefills it after the visitor signs in.
  useEffect(() => {
    try {
      const q = new URLSearchParams(window.location.search);
      const ref = q.get('ref');
      if (ref && /^[A-Za-z0-9-]{4,20}$/.test(ref)) localStorage.setItem('ms_ref_code', ref.toUpperCase());
      // Returning from Stripe checkout → land on the Shop so the paid/cancelled
      // banner (inside PledgePage) is actually visible.
      if (q.get('pledge_paid') || q.get('pledge_cancel')) setCurrentPage('pledge');
      // 📡 Shareable profile links: mythicspellbook.xyz/?u=handle
      // ?u=<handle|id> and ?feed=1 open Emergency Broadcast itself, focused on
      // the requested screen. Previously these rendered standalone pages that
      // duplicated the platform and had no nav to get back into it.
      const u = q.get('u');
      if (u && /^[@A-Za-z0-9_-]{2,40}$/.test(u)) { setEbEntry({ screen: 'player', key: u }); setCurrentPage('backing'); }
      else if (q.get('feed')) { setEbEntry({ screen: 'feed' }); setCurrentPage('backing'); }
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (typeof window === 'undefined') return;
    const c = window.msSupabase ? window.msSupabase() : null;
    setClient(c);
    if (c) {
      c.auth.getSession().then(({ data }) => setSession(data.session || null));
      const { data: sub } = c.auth.onAuthStateChange((_evt, s) => setSession(s || null));
      return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
    }
  }, []);

  useEffect(() => {
    if (!client || !session) { setProfile(null); return; }
    let cancel = false;
    client.from('user_profiles').select('*').eq('user_id', session.user.id).maybeSingle()
      .then(({ data, error }) => {
        if (cancel) return;
        if (error) { console.warn('profile fetch failed', error); setProfile(null); }
        else setProfile(data || null);
      });
    return () => { cancel = true; };
  }, [client, session, profileRefresh]);

  const refreshProfile = () => setProfileRefresh((n) => n + 1);

  // ===== Site-wide card overrides — admin edits in game_cards apply to the
  // ===== hero, spotlights, gallery, and modals (via CardOverridesContext).
  const [cardOverrides, setCardOverrides] = useState({});
  const fetchCardOverrides = React.useCallback(() => {
    if (!client) return;
    client.from('game_cards').select('*').then(({ data, error }) => {
      if (error) return; // table may not exist yet — cards fall back to built-ins
      const map = {};
      (data || []).forEach((r) => { if (r && r.name) map[r.name.toLowerCase()] = r; });
      setCardOverrides(map);
    });
  }, [client]);
  useEffect(() => { fetchCardOverrides(); }, [fetchCardOverrides]);

  // Auto-refresh the player profile when the user switches back to the website
  // tab (e.g. after playing a battle in the game in another tab). Keeps the
  // "Favorite Hero · 16 wins" / "Strongest Unit · 7 kills" panels in sync
  // with the latest in-game stats without manual reloads.
  useEffect(() => {
    if (!session) return;
    const onFocus = () => refreshProfile();
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshProfile();
    });
    return () => { window.removeEventListener('focus', onFocus); };
  }, [session]);

  useEffect(() => {
    const interval = setInterval(() => setSurvivors((s) => s + Math.floor(Math.random() * 5) - 2), 3000);
    return () => clearInterval(interval);
  }, []);

  // Card-modal handlers — the marketing site doesn't have its own deck builder
  // (that lives in the game). The "+ Play to Earn This Card" button just links
  // the user to the game.
  const handleAddToDeck = () => { /* no-op — sends to game via the modal's PLAY NOW link */ };
  // Nav button click — scroll on the home page, switch back to home then scroll
  // if we're currently on the hub page.
  const handleNavigate = (section) => {
    if (currentPage !== 'home') {
      setCurrentPage('home');
      // Wait one render for the home page to mount before scrolling.
      requestAnimationFrame(() => {
        const el = document.getElementById(section); if (el) el.scrollIntoView({ behavior: 'smooth' });
      });
    } else {
      const el = document.getElementById(section); if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  };
  const showHub  = () => { setCurrentPage('hub'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const showHome = () => { setCurrentPage('home'); fetchCardOverrides(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // 🪙 RMT page — switches to the RMT manifesto + Build a Career economy page.
  const showRMT  = () => { setCurrentPage('rmt'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // Community is now its own page (Survivor Creator Program + Community + Gym Defenders).
  const showCommunity = () => { setCurrentPage('community'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // Survivor page — consolidates Champions / Subclasses / HeldItems moved off the home page.
  const showSurvivor = () => { setCurrentPage('survivor'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // Deck Builder page — Garden of Eden spotlight + Survive for Free + Survival Caches + Card Database.
  const showDeckBuilder = () => { setCurrentPage('deckbuilder'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // News page — patch notes / devlogs / announcements. Add new posts to NEWS_POSTS at top of file.
  const showNews = () => { setCurrentPage('news'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // Shop page (ex-Pledge) — Founder & Node packages with Stripe checkout.
  const showPledge = () => { setCurrentPage('pledge'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // 📡 Open Emergency Broadcast focused on a screen. Everything social lives
  // inside the platform now, so these all route to the same page.
  const showEb = (screen, key) => {
    setEbEntry({ screen: screen, key: key || null });
    setCurrentPage('backing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const showProfile = (key) => showEb('player', key || (session && session.user ? session.user.id : null));
  // Card List page — Palworld-inspired browsable catalog + Coming Drops.
  const showCardList = () => { setCurrentPage('cardlist'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  // Emergency Broadcast — account-connected social platform page.
  const showBacking = () => { setCurrentPage('backing'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const isSignedIn = !!session;
  const displayName = profile && profile.display_name
    ? profile.display_name
    : (session && session.user && session.user.email ? session.user.email.split('@')[0] : null);

  return (
    <CardOverridesContext.Provider value={cardOverrides}>
    <div className="relative min-h-screen text-white overflow-x-hidden" style={{ fontFamily: "'Merriweather Sans', system-ui, sans-serif" }}>
      <Wasteland />
      <Navbar
        onNavigate={handleNavigate}
        deckCount={0}
        survivors={survivors}
        loyalFaction={null}
        isSignedIn={isSignedIn}
        displayName={displayName}
        currentPage={currentPage}
        onShowHub={showHub}
        onShowHome={showHome}
        onShowCommunity={showCommunity}
        onShowRMT={showRMT}
        onShowSurvivor={showSurvivor}
        onShowDeckBuilder={showDeckBuilder}
        onShowNews={showNews}
        onShowPledge={showPledge}
        onShowCardList={showCardList}
        onShowBacking={showBacking}
        onSignIn={showHub}  // Login button routes to the hub page where the sign-in form lives
      />

      {currentPage === 'hub' ? (
        /* ===== PLAYER HUB PAGE ===== */
        <div className="pt-32">
          <PlayerHub
            client={client}
            session={session}
            profile={profile}
            refreshProfile={refreshProfile}
            onSignedOut={() => { /* stay on hub; the page rerenders to the sign-in form */ }}
            onShowBacking={showBacking}
            onShowShop={showPledge}
            onShowProfile={showProfile}
            onShowDirectory={() => showEb('people')}
            onShowFeed={() => showEb('feed')}
          />
          <Footer />
        </div>
      ) : currentPage === 'community' ? (
        /* ===== COMMUNITY PAGE ===== */
        <div className="pt-20">
          <SurvivorCreatorProgram client={client} session={session} />
          <div id="players-first"><PlayersFirst /></div>
          <div id="community"><CommunityFuture cardA={COMMUNITY_CARDS[0]} cardB={COMMUNITY_CARDS[1]} onCardClick={setSelectedCard} /></div>
          <GymDefenders />
          <div id="coliseum"><Coliseum /></div>
          <Footer />
        </div>
      ) : currentPage === 'rmt' ? (
        /* ===== RMT PAGE — Real Money Trading manifesto + Build a Career economy ===== */
        <RMTPage />
      ) : currentPage === 'survivor' ? (
        /* ===== SURVIVOR PAGE — Champions + Subclasses + Held Items moved off home ===== */
        <SurvivorPage onPickHero={setSelectedHero} />
      ) : currentPage === 'deckbuilder' ? (
        /* ===== DECK BUILDER PAGE — Garden of Eden + Survive for Free + Survival Caches + Card Database ===== */
        <DeckBuilderPage cards={cards} onCardClick={setSelectedCard} onAddToDeck={handleAddToDeck} />
      ) : currentPage === 'news' ? (
        /* ===== NEWS PAGE — patch notes / devlogs / announcements (edit NEWS_POSTS at top of file) ===== */
        <NewsPage />
      ) : currentPage === 'pledge' ? (
        /* ===== SHOP PAGE (ex-Pledge) — Founder & Node packages, Stripe checkout (edit PLEDGE_TIERS at top of file) ===== */
        <PledgePage client={client} session={session} onSignIn={showHub} />
      ) : currentPage === 'backing' ? (
        /* ===== EMERGENCY BROADCAST — the game's social platform ===== */
        <div className="pt-14">
          <CinderBackingPage
            entry={ebEntry}
            client={client}
            session={session}
            profile={profile}
            refreshProfile={refreshProfile}
            onBack={showHome}
            onSignIn={showHub}
          />
        </div>
      ) : currentPage === 'cardlist' ? (
        /* ===== CARD LIST PAGE — Palworld-inspired catalog + Coming Drops (admin adds cards via Admin → Card Manager) ===== */
        <CardListPage client={client} />
      ) : (
        /* ===== HOME / MARKETING PAGE — GATCG-style composition =====
           hero video → moves pitch + cards → gameplay steps → story banner
           → ownership economy → recent articles → CTA + newsletter → footer.
           The old sections (Story/GameHook/About/HowToPlay/WhyDifferent/
           Spotlight/WhyEconomy/JoinResistance) still exist above if needed. */
        <>
          <div id="home"><Hero featuredCard={cards[0]} onCardClick={setSelectedCard} onScrollTo={handleNavigate} /></div>
          <div id="about"><GaMoves onCardClick={setSelectedCard} onShowCardList={showCardList} /></div>
          <div id="play"><GaSteps /></div>
          <div id="story"><GaStory /></div>
          <GaEconomy card={COMMUNITY_CARDS[1]} onCardClick={setSelectedCard} onShowRMT={showRMT} />
          <GaArticles onShowNews={showNews} />
          <GaSignup />
          <Footer />
        </>
      )}

      <CardModal card={selectedCard} onClose={() => setSelectedCard(null)} onAddToDeck={handleAddToDeck} />
      <HeroModal hero={selectedHero} onClose={() => setSelectedHero(null)} />
    </div>
    </CardOverridesContext.Provider>
  );
}


// Mount + tear down the boot splash once React has rendered.
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
setTimeout(() => {
  const splash = document.getElementById('boot-splash');
  if (splash) { splash.style.transition = 'opacity 0.4s'; splash.style.opacity = '0'; setTimeout(() => splash.remove(), 500); }
}, 600);
</script>

</body>
</html>
