// ===== CARD COMPONENT =====
const Card = ({ card: _cardIn, onClick, size = 'md', floating = true, intensity = 1 }) => {
  // Apply admin overrides (art / stats / text) so a card edited in the admin
  // panel updates here without any code change.
  const _ovMap = React.useContext(CardOverridesContext);
  const card = applyCardOverride(_cardIn, _ovMap);
  const cardRef = useRef(null);
  const [rotation, setRotation] = useState({ x: 0, y: 0 });
  const [glare, setGlare] = useState({ x: 50, y: 50 });
  const [isHovered, setIsHovered] = useState(false);

  const handleMouseMove = (e) => {
    if (!cardRef.current) return;
    const rect = cardRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    setRotation({ x: -((y - cy) / cy) * 22 * intensity, y: ((x - cx) / cx) * 22 * intensity });
    setGlare({ x: (x / rect.width) * 100, y: (y / rect.height) * 100 });
  };

  const handleLeave = () => {
    setRotation({ x: 0, y: 0 });
    setGlare({ x: 50, y: 50 });
    setIsHovered(false);
  };

  const sizes = { xs: 'w-32 h-48', sm: 'w-44 h-64', md: 'w-64 h-96', lg: 'w-80 h-[28rem]', xl: 'w-96 h-[36rem]' };

  const frameStyles = {
    blue: { outer: 'bg-gradient-to-br from-blue-700 via-blue-900 to-blue-950', inner: 'bg-gradient-to-br from-yellow-600 via-amber-500 to-yellow-700', gem: 'bg-blue-500', textBg: 'bg-gradient-to-r from-blue-900 via-blue-800 to-blue-900', effectBg: 'bg-gradient-to-br from-blue-100 via-white to-blue-50' },
    gold: { outer: 'bg-gradient-to-br from-yellow-700 via-amber-600 to-yellow-800', inner: 'bg-gradient-to-br from-yellow-500 via-yellow-400 to-amber-500', gem: 'bg-black', textBg: 'bg-gradient-to-r from-stone-900 via-stone-800 to-stone-900', effectBg: 'bg-gradient-to-br from-stone-200 via-stone-100 to-stone-200' },
    purple: { outer: 'bg-gradient-to-br from-purple-700 via-purple-900 to-purple-950', inner: 'bg-gradient-to-br from-yellow-600 via-amber-500 to-yellow-700', gem: 'bg-purple-500', textBg: 'bg-gradient-to-r from-purple-900 via-purple-800 to-purple-900', effectBg: 'bg-gradient-to-br from-purple-200 via-purple-100 to-purple-200' },
    silver: { outer: 'bg-gradient-to-br from-zinc-400 via-zinc-600 to-zinc-700', inner: 'bg-gradient-to-br from-zinc-300 via-zinc-400 to-zinc-500', gem: 'bg-black', textBg: 'bg-gradient-to-r from-zinc-900 via-zinc-800 to-zinc-900', effectBg: 'bg-gradient-to-br from-zinc-200 via-zinc-100 to-zinc-200' },
    green: { outer: 'bg-gradient-to-br from-green-700 via-green-900 to-green-950', inner: 'bg-gradient-to-br from-yellow-600 via-amber-500 to-yellow-700', gem: 'bg-green-500', textBg: 'bg-gradient-to-r from-green-900 via-green-800 to-green-900', effectBg: 'bg-gradient-to-br from-green-100 via-white to-green-50' },
  };
  const fs = frameStyles[card.frame];

  // ===== Full-card mode =====
  // When the image is already a COMPLETE card (its own frame + name bar), show
  // it as-is — no site frame wrapped around it. Toggle per card in the admin
  // Card Manager ("Image is a complete card"). Keeps the tilt / glow / float.
  const isFullCard = !!(card.fullCard || card.full_card);
  if (isFullCard) {
    return (
      <div className={`relative ${sizes[size]} cursor-pointer flex-shrink-0`} style={{ perspective: '1500px', animation: floating && !isHovered ? 'float-card 6s ease-in-out infinite' : 'none' }}>
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={handleLeave}
          onClick={() => onClick && onClick(card)}
          className="relative w-full h-full"
          style={{
            transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg) scale(${isHovered ? 1.06 : 1})`,
            transition: isHovered ? 'transform 0.08s ease-out' : 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)',
            transformStyle: 'preserve-3d',
          }}
        >
          {card.image ? (
            <img
              src={card.image}
              alt={card.name}
              className="w-full h-full object-contain"
              style={{ filter: isHovered
                ? `drop-shadow(0 24px 48px ${card.glowColor || 'rgba(0,0,0,0.7)'}) drop-shadow(0 0 34px ${card.glowColor || 'rgba(249,115,22,0.4)'})`
                : `drop-shadow(0 16px 34px rgba(0,0,0,0.75))` }}
              onError={(e) => { e.currentTarget.style.opacity = '0.15'; }}
            />
          ) : (
            <div className="w-full h-full bg-black rounded-xl flex items-center justify-center text-stone-600 font-serif px-4 text-center">{card.name}</div>
          )}
        </div>
      </div>
    );
  }

  // ===== Clean card-list frame (site standard) =====
  // Thin rarity border, full-bleed art, rarity chip + name bar — matches the
  // Card List and hero. Replaces the old ornamental frame everywhere Card is
  // used (spotlights, gallery, community, card modal). Effect text lives in the
  // surrounding panel (e.g. the card modal), not baked into the frame.
  const _rm = (typeof CARD_RARITY_META !== 'undefined' && CARD_RARITY_META[card.rarity]) || { color: '#9aa3b2', label: card.rarity || 'Card' };
  const _nameSize = (size === 'xl' || size === 'lg') ? 'text-lg' : (size === 'md') ? 'text-sm' : 'text-[11px]';
  const _chip = (size === 'xs' || size === 'sm') ? 'text-[8px] px-1 py-0.5' : 'text-[10px] px-1.5 py-0.5';
  return (
    <div className={`relative ${sizes[size]} cursor-pointer flex-shrink-0`} style={{ perspective: '1500px', animation: floating && !isHovered ? 'float-card 6s ease-in-out infinite' : 'none' }}>
      <div
        ref={cardRef}
        onMouseMove={handleMouseMove}
        onMouseEnter={() => setIsHovered(true)}
        onMouseLeave={handleLeave}
        onClick={() => onClick && onClick(card)}
        className="relative w-full h-full rounded-xl overflow-hidden border-2 flex flex-col"
        style={{
          borderColor: _rm.color,
          background: '#0a0a0a',
          transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg) scale(${isHovered ? 1.04 : 1})`,
          transition: isHovered ? 'transform 0.08s ease-out' : 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)',
          transformStyle: 'preserve-3d',
          boxShadow: isHovered ? `0 40px 80px -15px ${card.glowColor || _rm.color}, 0 0 60px ${_rm.color}66` : '0 15px 40px rgba(0,0,0,0.8)',
        }}
      >
        <div className="relative flex-1 overflow-hidden" style={{ background: `radial-gradient(ellipse at 50% 30%, ${_rm.color}22, #0a0a0a 70%)` }}>
          {card.image ? (
            <img
              src={card.image}
              alt={card.name}
              className={`w-full h-full ${card.fullCard ? 'object-contain' : 'object-cover object-top'}`}
              onError={(e) => { e.currentTarget.style.display = 'none'; const s = e.currentTarget.nextElementSibling; if (s) s.style.display = 'block'; }}
            />
          ) : null}
          <div style={{ display: card.image ? 'none' : 'block', width: '100%', height: '100%' }}><CardArt type={card.art} /></div>
          <div className={`absolute top-1.5 left-1.5 rounded uppercase tracking-widest font-bold ${_chip}`} style={{ background: 'rgba(0,0,0,0.8)', color: _rm.color, border: `1px solid ${_rm.color}88` }}>{_rm.label}</div>
          {card.cardNumber && <div className={`absolute top-1.5 right-1.5 rounded font-mono text-stone-300 ${_chip}`} style={{ background: 'rgba(0,0,0,0.72)' }}>{card.cardNumber}</div>}
          {card.kalon && <div className="absolute bottom-1.5 left-1.5 px-1.5 py-0.5 rounded text-[9px] uppercase tracking-widest font-bold text-yellow-200" style={{ background: 'rgba(0,0,0,0.8)', border: '1px solid rgba(250,204,21,0.5)' }}>Kalon</div>}
        </div>
        <div className="px-2.5 py-1.5 bg-black/85 shrink-0">

          <div className="text-stone-400 text-[10px] truncate">{card.type || '—'}</div>
        </div>
      </div>
    </div>
  );

  // eslint-disable-next-line no-unreachable — legacy ornamental frame kept as fallback
  return (
    <div className={`relative ${sizes[size]} cursor-pointer flex-shrink-0`} style={{ perspective: '1500px', animation: floating && !isHovered ? 'float-card 6s ease-in-out infinite' : 'none' }}>
      {isHovered && [...Array(6)].map((_, i) => (
        <div key={i} className="absolute w-1 h-1 rounded-full pointer-events-none" style={{ background: '#f97316', boxShadow: `0 0 8px #f97316`, left: `${20 + i * 12}%`, top: `${10 + (i % 3) * 30}%`, animation: `spark ${1 + i * 0.2}s ease-in-out infinite`, animationDelay: `${i * 0.1}s` }} />
      ))}

      <div
        ref={cardRef}
        onMouseMove={handleMouseMove}
        onMouseEnter={() => setIsHovered(true)}
        onMouseLeave={handleLeave}
        onClick={() => onClick && onClick(card)}
        className="relative w-full h-full rounded-xl overflow-hidden"
        style={{
          transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg) scale(${isHovered ? 1.08 : 1})`,
          transition: isHovered ? 'transform 0.08s ease-out' : 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)',
          transformStyle: 'preserve-3d',
          boxShadow: isHovered ? `0 40px 80px -15px ${card.glowColor}, 0 0 60px ${card.glowColor}, 0 0 100px rgba(249, 115, 22, 0.4)` : '0 15px 40px rgba(0,0,0,0.8)',
        }}

              <div className="relative w-full" style={{ height: '60%' }}>
                {card.image ? (
                  // Live game art — img with onError fallback to the SVG placeholder
                  // so the page still renders if the file is missing from disk.
                  // `object-top` anchors the crop to the TOP of the source image so
                  // character portraits keep their faces visible (the default
                  // `object-cover` centers the crop, which decapitates everyone).
                  <img
                    src={card.image}
                    alt={card.name}
                    className="w-full h-full object-cover object-top"
                    onError={(e) => {
                      // Failed to load — hide the broken-image icon. The SVG below
                      // is still rendered as a sibling so the slot stays filled.
                      e.currentTarget.style.display = 'none';
                      const sib = e.currentTarget.nextElementSibling;
                      if (sib) sib.style.display = 'block';
                    }}
                  />
                ) : null}
                <div style={{ display: card.image ? 'none' : 'block', width: '100%', height: '100%' }}>
                  <CardArt type={card.art} />

              <div className={`${fs.textBg} border-y-2 border-yellow-600/60 px-3 py-1.5 flex items-center justify-between`}>

                <span className="text-orange-300/80 text-[10px] italic uppercase tracking-wider">{card.faction}</span>
              </div>

              <div className={`flex-1 ${fs.effectBg} p-2 relative`}>
                <div className="text-stone-800 text-[10px] leading-tight font-medium">
                  <p className="font-semibold text-[9px] text-stone-600 mb-1 uppercase tracking-wide">{card.type}</p>
                  <p className="leading-snug">{card.effect}</p>
                  {card.flavor && <p className="italic text-stone-600 text-[9px] mt-1 border-t border-stone-300 pt-1">{card.flavor}</p>}
                </div>
                {card.atk != null && (
                  <div className="absolute bottom-1 right-1 flex gap-1">
                    <div className="bg-red-900 border border-yellow-500 rounded px-1.5 py-0.5 text-yellow-100 text-xs font-bold" title="Attack"> {card.atk}</div>
                    <div className="bg-blue-900 border border-yellow-500 rounded px-1.5 py-0.5 text-yellow-100 text-xs font-bold" title="Defense"> {card.def}</div>
                  </div>
                )}
                <div className="absolute bottom-1 left-1/2 -translate-x-1/2">
                  <div className={`w-3 h-3 rounded-full ${fs.gem} border border-yellow-500 shadow-inner`} />
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* Grunge overlay on card */}
        <div className="absolute inset-0 rounded-xl pointer-events-none opacity-40 mix-blend-multiply" style={{
          backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'n\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'3\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\' opacity=\'0.4\'/%3E%3C/svg%3E")',
        }} />

// ===== GAME CARD LIST (Palworld-inspired) =====
// Normalized card shape used by the public Card List page. Cards come from two
// places, merged: (1) the built-in `cards` + COMMUNITY_CARDS seed, and (2) rows
// from the Supabase `game_cards` table (admin-managed) so the catalog grows
// without a redeploy. The page never breaks if the table is missing — it just
// shows the seed.
const CARD_RARITY_META = {
  Common:    { color: '#9aa3b2', label: 'Common' },
  Uncommon:  { color: '#5aa855', label: 'Uncommon' },
  Rare:      { color: '#4a90d9', label: 'Rare' },
  Epic:      { color: '#a855f7', label: 'Epic' },
  Legendary: { color: '#f0a030', label: 'Legendary' },
  Mythic:    { color: '#e0457b', label: 'Mythic' },
  Starter:   { color: '#78716c', label: 'Starter' },
};
const CARD_TYPE_FILTERS = ['Unit', 'Hero', 'Spell', 'Trap', 'Location', 'Weather', 'Wall', 'Item'];

// Map a free-text `type` string ("Bug Unit", "Mythic Hero · Cosmic", "Spell · Slow")
// to one of the coarse type filters above.
const coarseCardType = (typeStr) => {
  const t = (typeStr || '').toLowerCase();
  for (const f of CARD_TYPE_FILTERS) { if (t.includes(f.toLowerCase())) return f; }
  return 'Other';
};

// Normalize any card-ish object (seed or DB row) into the card-list shape.
const normalizeGameCard = (c, i) => ({
  id: c.id != null ? String(c.id) : ('seed-' + i),
  name: c.name || 'Unnamed Card',
  type: c.type || '',
  faction: c.faction || '',
  element: c.element || '',
  rarity: c.rarity || 'Common',
  cost: (c.cost === 0 || c.cost) ? c.cost : null,
  hp: c.hp ?? null, atk: c.atk ?? null, def: c.def ?? null,
  mag: c.mag ?? null, res: c.res ?? null, spd: c.spd ?? null,
  effect: c.effect || '',
  flavor: c.flavor || '',
  image: c.image || c.art_url || null,
  frame: c.frame || 'silver', frameColor: c.frameColor || c.frame_color, glowColor: c.glowColor || c.glow_color,
  kalon: !!c.kalon,
  power: c.power ?? null,
  // Palworld-style catalog metadata
  cardNumber: c.cardNumber || c.card_number || '',
  set: c.set || c.set_name || '',
  illustrator: c.illustrator || c.artist || '',
  releaseDate: c.releaseDate || c.release_date || null, // 'YYYY-MM-DD'
  status: c.status || 'released', // 'released' | 'coming'
  fullCard: !!(c.fullCard || c.full_card), // image is a complete card (no site frame)
});

// A card is an upcoming "drop" if flagged coming OR its release date is future.
const isComingCard = (c) => {
  if (c.status === 'coming') return true;
  if (c.releaseDate) { try { return new Date(c.releaseDate) > new Date(); } catch (e) { return false; } }
  return false;
};
const fmtDropDate = (d) => {
  if (!d) return 'Date TBA';
  try { return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
  catch (e) { return d; }
};

// Hero featured card — the SAME clean card-list frame as CardThumb, but large,
// with a float + glow. Used on the home hero so it matches the Card List look
// (thin rarity border, full-bleed art, name bar) instead of the heavy site frame.
const HeroFeaturedCard = ({ card: _cardIn, onClick }) => {
  const _ov = React.useContext(CardOverridesContext);
  const card = applyCardOverride(_cardIn, _ov);
  const [hovered, setHovered] = useState(false);
  if (!card) return null;
  const rarity = CARD_RARITY_META[card.rarity] || CARD_RARITY_META.Common;

  // Full-card mode: the image is already a complete card (its own frame + name).
  // Show it RAW — no rarity chip, no name bar, no extra border. Just float,
  // glow, and click-through to the detail (which shows the effect).
  if (card.fullCard) {
    return (
      <div className="relative w-72 md:w-80" style={{ animation: hovered ? 'none' : 'float-card 6s ease-in-out infinite' }}>
        <img
          src={card.image}
          alt={card.name}
          onClick={() => onClick && onClick(card)}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          className="w-full h-auto cursor-pointer"
          style={{
            transform: hovered ? 'translateY(-6px) scale(1.02)' : 'none',
            transition: 'transform 0.3s, filter 0.3s',
            filter: hovered
              ? `drop-shadow(0 26px 54px ${card.glowColor || 'rgba(168,85,247,0.55)'}) drop-shadow(0 0 36px ${card.glowColor || 'rgba(168,85,247,0.5)'})`
              : `drop-shadow(0 16px 36px rgba(0,0,0,0.78))`,
          }}
          onError={(e) => { e.currentTarget.style.opacity = '0.2'; }}
        />
      </div>
    );
  }

  return (

// ===== CARD LIST PAGE =====
const CardListPage = ({ client }) => {
  const [dbCards, setDbCards] = useState(null); // null = not loaded / no table
  const [selected, setSelected] = useState(null);
  const [q, setQ] = useState('');
  const [fType, setFType] = useState('all');
  const [fRarity, setFRarity] = useState('all');

  // Pull admin-managed cards from Supabase. Falls back silently to the seed.
  useEffect(() => {
    if (!client) return;
    let cancel = false;
    client.from('game_cards').select('*').then(({ data, error }) => {
      if (cancel) return;
      if (error) { console.warn('game_cards fetch failed', error.message); setDbCards(null); }
      else setDbCards(Array.isArray(data) ? data : []);
    });
    return () => { cancel = true; };
  }, [client]);

  // Merge seed + DB by name (DB wins). Seed gives the page content even before
  // the admin adds anything.
  const all = useMemo(() => {
    const seed = [...cards, ...COMMUNITY_CARDS].map(normalizeGameCard);
    const db = (dbCards || []).map(normalizeGameCard);
    const byName = {};
    seed.forEach(c => { byName[c.name.toLowerCase()] = c; });
    db.forEach(c => { byName[c.name.toLowerCase()] = c; }); // DB overrides seed
    return Object.values(byName);
  }, [dbCards]);

  const coming = all.filter(isComingCard);
  const released = all.filter(c => !isComingCard(c));

  const matches = (c) => {
    if (q && !(`${c.name} ${c.type} ${c.faction} ${c.element}`.toLowerCase().includes(q.toLowerCase()))) return false;
    if (fType !== 'all' && coarseCardType(c.type) !== fType) return false;
    if (fRarity !== 'all' && c.rarity !== fRarity) return false;
    return true;
  };
  const shown = released.filter(matches);

  return (
    <div className="pt-20">
      <section className="relative py-16 px-6 overflow-hidden">
        <HazardStripe className="absolute top-0 left-0 right-0" />
        <div className="absolute inset-0 pointer-events-none" style={{
          background: 'radial-gradient(ellipse at 20% 10%, rgba(255,140,60,0.08) 0%, transparent 55%),radial-gradient(ellipse at 80% 90%, rgba(120,90,220,0.08) 0%, transparent 55%)',
        }} />
        <div className="max-w-7xl mx-auto relative">
          {/* Header */}
          <div className="text-center mb-10">
            <div className="text-orange-400/80 text-xs tracking-[0.4em] uppercase mb-3">— The Card List —</div>
            <DistressedHeading className="text-5xl md:text-7xl font-serif font-bold text-yellow-100 mb-4">Card List</DistressedHeading>
            <p className="text-stone-300 max-w-2xl mx-auto text-base md:text-lg leading-relaxed">
              Every card in Mythic Spellbook. Filter, search, and click any card for its full details.
            </p>
          </div>

          {/* ===== Coming Drops ===== */}
          {coming.length > 0 && (
            <div className="mb-14">
              <div className="flex items-center gap-3 mb-5">
                <span className="w-2 h-2 rounded-full bg-amber-400" style={{ animation: 'pulse-red 1.5s infinite' }} />
                <h2 className="text-amber-300 font-serif font-bold text-2xl md:text-3xl tracking-wide">Coming Drops</h2>
                <span className="text-stone-500 text-xs uppercase tracking-widest">{coming.length} upcoming</span>
                <div className="flex-1 h-px bg-gradient-to-r from-amber-600/40 to-transparent" />
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                {coming
                  .slice()
                  .sort((a, b) => (a.releaseDate || '9999') < (b.releaseDate || '9999') ? -1 : 1)
                  .map(c => (
                  <div key={c.id} className="relative">
                    <CardThumb card={c} onClick={setSelected} coming />
                    <div className="mt-1 text-center">
                      <span className="text-amber-300 text-[10px] font-mono uppercase tracking-widest">{fmtDropDate(c.releaseDate)}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ===== Filters ===== */}
          <div className="mb-8 space-y-3">
            <input
              type="text"
              value={q}
              onChange={(e) => setQ(e.target.value)}
              placeholder="Search cards by name, type, faction, element…"
              className="w-full bg-black/60 border border-stone-600/60 focus:border-orange-500/70 rounded px-4 py-3 text-stone-100 placeholder-stone-600 outline-none transition"
            />
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setFType('all')} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border transition ${fType === 'all' ? 'bg-orange-600 text-yellow-50 border-orange-400' : 'border-stone-700 text-stone-400 hover:border-orange-500/50'}`}>All Types</button>
              {CARD_TYPE_FILTERS.map(t => (
                <button key={t} onClick={() => setFType(fType === t ? 'all' : t)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border transition ${fType === t ? 'bg-orange-600 text-yellow-50 border-orange-400' : 'border-stone-700 text-stone-400 hover:border-orange-500/50'}`}>{t}</button>
              ))}
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setFRarity('all')} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border transition ${fRarity === 'all' ? 'bg-stone-700 text-yellow-50 border-stone-400' : 'border-stone-700 text-stone-400 hover:border-stone-500'}`}>All Rarities</button>
              {Object.keys(CARD_RARITY_META).map(r => (
                <button key={r} onClick={() => setFRarity(fRarity === r ? 'all' : r)} className="px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border transition" style={fRarity === r ? { background: CARD_RARITY_META[r].color, color: '#0a0a0a', borderColor: CARD_RARITY_META[r].color } : { borderColor: CARD_RARITY_META[r].color + '55', color: CARD_RARITY_META[r].color }}>{r}</button>
              ))}
            </div>
          </div>

          {/* ===== Grid ===== */}
          <div className="flex items-center justify-between mb-4">
            <div className="text-stone-400 text-sm">{shown.length} card{shown.length !== 1 ? 's' : ''}</div>
          </div>
          {shown.length === 0 ? (
            <div className="text-center py-16 text-stone-500">No cards match your filters.</div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
              {shown.map(c => <CardThumb key={c.id} card={c} onClick={setSelected} />)}
            </div>
          )}
        </div>
      </section>
      <Footer />
      <CardListDetailModal card={selected} onClose={() => setSelected(null)} />
    </div>
  );
};

// ===== DECK BUILDER =====
const DeckBuilder = ({ deck, onRemove, onClear }) => {
  const totalCost = deck.reduce((sum, c) => sum + c.cost, 0);
  const avgCost = deck.length ? (totalCost / deck.length).toFixed(1) : 0;
  const avgPower = deck.length ? Math.round(deck.reduce((s, c) => s + c.power, 0) / deck.length) : 0;
  const avgThreat = deck.length ? (deck.reduce((s, c) => s + c.threatLevel, 0) / deck.length).toFixed(1) : 0;
  const factionCounts = deck.reduce((acc, c) => { acc[c.faction] = (acc[c.faction] || 0) + 1; return acc; }, {});
  const manaCurve = Array.from({ length: 9 }, (_, i) => deck.filter((c) => c.cost === i + 1).length);
  const maxCurve = Math.max(...manaCurve, 1);

  return (
    <section className="relative py-24 px-6">
      <HazardStripe className="absolute top-0 left-0 right-0" />
      <div className="max-w-7xl mx-auto pt-8">
        <div className="text-center mb-12">
          <div className="text-orange-400/80 text-xs tracking-[0.4em] uppercase mb-3">— Field Kit Assembly —</div>
          <DistressedHeading className="text-5xl font-serif font-bold text-yellow-100 mb-4">Survival Loadout</DistressedHeading>
          <p className="text-stone-400 max-w-2xl mx-auto">Build a 40-card spellbook. Monitor your threat profile. Don't get yourself killed.</p>
        </div>

        <div className="grid lg:grid-cols-3 gap-8">
          <div className="lg:col-span-1 space-y-6">
            <div className="bg-black/60 border border-orange-600/30 rounded p-6 relative overflow-hidden">
              <BulletHole className="top-12 right-4" size={14} />
              <div className="absolute top-0 right-0 px-2 py-0.5 bg-orange-600/30 border-l border-b border-orange-500/50 text-orange-300 text-[10px] tracking-widest font-mono">FIELD-OPS</div>
              <h3 className="text-orange-300 font-serif font-bold text-xl mb-4 flex items-center justify-between">
                <span className="tracking-wider">LOADOUT STATS</span>
                {deck.length > 0 && <button onClick={onClear} className="text-xs text-red-400 hover:text-red-300 normal-case font-normal uppercase tracking-wider">Dump All</button>}
              </h3>

              <div className="space-y-3 mb-6">
                <div className="flex justify-between items-baseline border-b border-orange-500/10 pb-2"><span className="text-stone-400 text-xs uppercase tracking-widest">Total Cards</span><span className="text-orange-300 text-2xl font-bold">{deck.length}<span className="text-stone-500 text-sm">/40</span></span></div>
                <div className="flex justify-between items-baseline border-b border-orange-500/10 pb-2"><span className="text-stone-400 text-xs uppercase tracking-widest">Avg Cost</span><span className="text-orange-300 text-2xl font-bold">{avgCost}</span></div>
                <div className="flex justify-between items-baseline border-b border-orange-500/10 pb-2"><span className="text-stone-400 text-xs uppercase tracking-widest">Avg Power</span><span className="text-orange-300 text-2xl font-bold">{avgPower}</span></div>
                <div className="flex justify-between items-baseline border-b border-orange-500/10 pb-2"><span className="text-stone-400 text-xs uppercase tracking-widest">Threat Profile</span><span className="text-red-400 text-2xl font-bold flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-red-500" style={{ animation: 'pulse-red 1.5s infinite' }} />{avgThreat}</span></div>
              </div>

              <div className="mb-6">
                <div className="text-stone-400 text-xs uppercase tracking-widest mb-3">Mana Curve</div>
                <div className="flex items-end gap-1 h-24">
                  {manaCurve.map((count, i) => (
                    <div key={i} className="flex-1 flex flex-col items-center">
                      <div className="w-full bg-gradient-to-t from-red-700 via-orange-500 to-yellow-400 rounded-t transition-all" style={{ height: `${(count / maxCurve) * 100}%`, minHeight: count > 0 ? '4px' : '0' }} />
                      <div className="text-stone-500 text-[10px] mt-1 font-mono">{i + 1}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="text-stone-400 text-xs uppercase tracking-widest mb-3">Faction Mix</div>
                {Object.keys(factionCounts).length === 0 ? <div className="text-stone-600 text-sm italic">No allegiance declared</div> : (
                  <div className="space-y-2">
                    {Object.entries(factionCounts).map(([faction, count]) => (
                      <div key={faction} className="flex items-center gap-2">
                        <span className="text-stone-300 text-xs w-20 uppercase tracking-wider">{faction}</span>
                        <div className="flex-1 h-2 bg-stone-800 rounded-full overflow-hidden border border-stone-700"><div className="h-full bg-gradient-to-r from-orange-600 to-red-600 rounded-full transition-all" style={{ width: `${(count / deck.length) * 100}%` }} /></div>
                        <span className="text-orange-300 text-sm font-bold w-6 text-right">{count}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <button disabled={deck.length === 0} className="w-full mt-6 py-3 bg-gradient-to-r from-orange-600 to-red-700 text-yellow-100 font-bold rounded tracking-wider hover:shadow-lg hover:shadow-orange-500/40 transition disabled:opacity-30 disabled:cursor-not-allowed uppercase border border-orange-400/50">Lock In Loadout</button>
            </div>
          </div>

          <div className="lg:col-span-2">
            <div className="bg-black/40 border border-orange-600/20 rounded p-6 min-h-[400px] relative">
              <div className="absolute top-2 right-2 text-stone-600 text-[10px] font-mono tracking-widest">DECK-VIEW.SCRN</div>
              {deck.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center py-16">
                  <div className="text-6xl mb-4 opacity-20"></div>
                  <h4 className="text-orange-300 font-serif text-2xl mb-2 tracking-wider">NO LOADOUT REGISTERED</h4>
                  <p className="text-stone-500 max-w-md uppercase text-xs tracking-widest">Return to the Card Database. Load cards into your kit.</p>
                </div>
              ) : (
                <div className="flex flex-wrap gap-4 justify-center">
                  {deck.map((c, i) => (
                    <div key={`${c.id}-${i}`} className="relative group">
                      <Card card={c} size="sm" floating={false} intensity={0.5} />
                      <button onClick={() => onRemove(i)} className="absolute -top-2 -right-2 w-7 h-7 rounded bg-red-700 hover:bg-red-600 text-yellow-100 text-sm font-bold opacity-0 group-hover:opacity-100 transition shadow-lg flex items-center justify-center z-20 border border-red-400"></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

// ===== WAR MAP PREVIEW =====
// Reads the admin-published territory-wars node graph from the shared
// card_catalog (anon-readable) and renders a live war-map section below
// the sign-up CTA. Clicking any node or the bottom CTA sends the visitor
// straight to the game. Falls back to a built-in demo map while loading
// or when no catalog has been published yet.
const WarMapPreview = ({ hubMode = false }) => {
  const [twData,      setTwData]      = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [hovered,     setHovered]     = useState(null);
  const [activeNode,  setActiveNode]  = useState(null); // clicked-node modal

  useEffect(() => {
    const fetchTW = async () => {
      try {
        const client = window.msSupabase?.();
        if (!client) { setLoading(false); return; }
        const { data, error } = await client
          .from('card_catalog')
          .select('moves')
          .eq('id', 'singleton')
          .maybeSingle();
        if (!error && data?.moves?.__territory_wars__) {
          const tw = data.moves.__territory_wars__;
          // Accept ANY node with a valid id and position (even 0,0 — admin placed it there).
          // No minimum count: show the real map as long as at least 1 node exists.
          const validNodes = Array.isArray(tw.nodes)
            ? tw.nodes.filter(n => n && n.id != null && n.position &&
                typeof n.position.x === 'number' && typeof n.position.y === 'number')
            : [];
          if (validNodes.length >= 1) {
            setTwData({
              nodes:     validNodes,
              regions:   tw.regions   || [],
              // Admin-lit routes published from the game — match the game's gold glow.
              litRoutes: Array.isArray(tw.litRoutes) ? tw.litRoutes : [],
            });
          }
        }
      } catch (e) {
        console.warn('[WarMapPreview] catalog fetch failed', e);
      }
      setLoading(false);
    };
    fetchTW();
  }, []);

  // Use real catalog nodes only — no demo fallback.
  // While loading or if the catalog has no nodes, render an empty canvas.
  const nodes = twData?.nodes || [];

  // Admin-lit routes from the catalog — same set the game uses for gold glow.
  const litRouteSet = new Set(Array.isArray(twData?.litRoutes) ? twData.litRoutes : []);

  // Build deduplicated route list
  const nodeById = {};
  for (const n of nodes) nodeById[n.id] = n;
  const routes = [];
  const seenRoutes = new Set();
  for (const n of nodes) {
    for (const cid of (n.connections || [])) {
      const key = [String(n.id), String(cid)].sort().join('|');
      if (seenRoutes.has(key) || !nodeById[cid]) continue;
      seenRoutes.add(key);
      routes.push({ a: n, b: nodeById[cid], key });
    }
  }

  // Simple node glow — teal for all nodes (matches game aesthetic).
  const nodeGlow = () => '#6cd4ff';

  // Static field-report log — gives the "live world" feel
  const FEED = [
    { icon:'⚔', text:'Assault on Kiln-7 repelled',        time:'2m ago',  col:'#ff6b6b' },
    { icon:'🏗', text:'PRN Emberfall stabilized',           time:'8m ago',  col:'#6cd4ff' },
    { icon:'📦', text:'Convoy reached Vault Prime',         time:'15m ago', col:'#ffcf5a' },
    { icon:'🔥', text:'Cinder Cross falls to Neutral',      time:'31m ago', col:'#ff8c42' },
    { icon:'🛡', text:'Iron Hollow guard hired',            time:'44m ago', col:'#6cd4ff' },
    { icon:'⚔', text:'North Gate under siege',             time:'1h ago',  col:'#ff6b6b' },
    { icon:'📦', text:'Last Wick resources collected',      time:'1h ago',  col:'#ffcf5a' },
    { icon:'🏗', text:'NEXUS-ZERO fortified +12% stability','time':'2h ago',  col:'#a8eeff' },
  ];

  return (
    <section id={hubMode ? undefined : 'warmap'} style={{
      position: 'relative', overflow: 'hidden',
      /* Warmap city background — same as the in-game war map */
      backgroundImage: "url('./assets/background/Backgrounds/warmap2.png')",
      backgroundSize: 'cover',
      backgroundPosition: 'center center',
      backgroundRepeat: 'no-repeat',
    }}>
      {/* Light colour-grade — warmap2 is brighter so we use a lighter veil */}
      <div style={{ position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
        background:'linear-gradient(180deg,rgba(2,6,18,0.35) 0%,rgba(2,6,18,0.20) 50%,rgba(2,6,18,0.45) 100%)' }} />
      {/* Slight teal tint to keep the sci-fi palette */}
      <div style={{ position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
        background:'radial-gradient(ellipse at 50% 40%, rgba(10,30,60,0.20) 0%, transparent 70%)' }} />
      {/* Scanline texture */}
      <div style={{ position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
        backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)' }} />
      {/* Top / bottom edge fades */}
      <div style={{ position:'absolute', top:0, left:0, right:0, height:80, zIndex:1, pointerEvents:'none',

      <div style={{ position:'absolute', bottom:0, left:0, right:0, height:60, zIndex:1, pointerEvents:'none',

      {/* ── Node-click modal (fixed overlay) ── */}

            {/* Divider */}

                  marginBottom:'0.5rem' }}>— CONNECTED NODES</div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:'0.4rem' }}>
                  {(activeNode.connections||[]).map(cid => {
                    const nb = nodeById[cid];
                    return (
                      <span key={cid} style={{
                        padding:'0.2rem 0.6rem',
                        background:'rgba(108,212,255,0.06)',
                        border:'1px solid rgba(108,212,255,0.2)',
                        borderRadius:3, color:'#6cd4ff',

                      }}>
                        {nb ? nb.name : cid}

              </div>

            {/* Status blurb */}
            <div style={{
              background:'rgba(108,212,255,0.04)',
              border:'1px solid rgba(108,212,255,0.12)',
              borderRadius:4, padding:'0.7rem 0.85rem',
              color:'#4a7a9a', fontSize:'0.7rem', lineHeight:1.6,
              fontFamily:'JetBrains Mono,monospace',
              marginBottom:'1.35rem',
            }}>
              This node is <strong style={{color:'#ffcf5a'}}>uncontrolled</strong>.

            {/* CTA */}
            <a

                border:'1px solid rgba(108,212,255,0.5)',
                borderRadius:4, color:'#6cd4ff',
                fontFamily:'Cinzel,serif', fontWeight:700,
                fontSize:'0.82rem', letterSpacing:'0.2em',
                textTransform:'uppercase', textDecoration:'none',
                boxShadow:'0 0 20px rgba(108,212,255,0.2)',
                transition:'all 0.2s',
              }}
              onMouseEnter={e => {

                e.currentTarget.style.color='#a8eeff';
              }}
              onMouseLeave={e => {
                e.currentTarget.style.background='linear-gradient(135deg,rgba(108,212,255,0.18) 0%,rgba(20,60,100,0.25) 100%)';
                e.currentTarget.style.color='#6cd4ff';
              }}
            >
              ⚔ ENTER THE WAR MAP
            </a>
            <p style={{ textAlign:'center', color:'#1e3040', fontSize:'0.56rem',
              letterSpacing:'0.2em', textTransform:'uppercase',
              fontFamily:'JetBrains Mono,monospace', marginTop:'0.65rem' }}>
              Free · No download · Sign up takes 30 seconds
            </p>
          </div>
        </div>
      )}

      {/* ── Header — hidden in hub mode (hub card provides its own header bar) ── */}
      {!hubMode && (
        <div style={{ position:'relative', zIndex:3, textAlign:'center', padding:'3rem 1.5rem 1.75rem' }}>
          <div style={{ display:'inline-flex', alignItems:'center', gap:'0.5rem', marginBottom:'0.8rem' }}>
            <span style={{
              display:'inline-block', width:8, height:8, borderRadius:'50%',
              background: loading ? '#666' : '#22d46a',
              boxShadow: loading ? 'none' : '0 0 8px #22d46a',
              animation: loading ? 'none' : 'tw-mkt-dot 2s ease-in-out infinite',
            }} />
            <span style={{ color: loading ? '#555' : '#22d46a', fontSize:'0.62rem',
              letterSpacing:'0.45em', fontFamily:'JetBrains Mono,monospace,sans-serif',
              textTransform:'uppercase' }}>
              {loading ? 'LOADING MAP DATA…' : `LIVE · ${nodes.length} PRNs ACTIVE`}

          </div>
          <h2 style={{

            fontSize:'clamp(1.6rem,3.5vw,2.75rem)', letterSpacing:'0.14em',
            color:'#b8deff', textShadow:'0 0 40px rgba(108,212,255,0.35)',
          }}>
            PLANETARY RECONSTRUCTION NETWORK
          </h2>
          <p style={{ color:'#3a5a70', fontSize:'0.78rem', letterSpacing:'0.22em',
            textTransform:'uppercase', margin:0, fontFamily:'JetBrains Mono,monospace,sans-serif' }}>
            War Map · Claim Nodes · Control Supply Lines · Dominate Regions
          </p>
        </div>

      {/* ── Map workspace ── */}
      <div style={{ display:'flex', position:'relative', zIndex:2,

          <div style={{ color:'#2a4050', fontSize:'0.56rem', letterSpacing:'0.38em',
            textTransform:'uppercase', fontFamily:'JetBrains Mono,monospace',
            borderBottom:'1px solid rgba(30,60,80,0.35)', paddingBottom:'0.4rem',
            marginBottom:'0.65rem' }}>
            — FIELD REPORTS
          </div>
          {FEED.map((item, i) => (
            <div key={i} style={{ padding:'0.38rem 0', borderBottom:'1px solid rgba(25,50,70,0.22)',
              display:'flex', gap:'0.4rem', alignItems:'flex-start' }}>
              <span style={{ fontSize:'0.72rem', lineHeight:1.4, flexShrink:0 }}>{item.icon}</span>

          </div>
        </div>

        {/* Canvas — taller map so nodes spread out, labels stay readable, and
            every PRN + its info is easy to see / tap. Height scales with the
            viewport (clamp) so it's big on desktop but still fits phones. */}
        <div style={{ flex:1, position:'relative',
          minHeight: hubMode ? 'clamp(520px, 82vh, 1000px)' : 'clamp(560px, 88vh, 1100px)',
          aspectRatio: 'auto',
          overflow:'visible' }}>
          {/* SVG supply-line routes */}
          <svg
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            style={{ position:'absolute', inset:0, width:'100%', height:'100%',
              overflow:'visible', zIndex:1, pointerEvents:'none' }}
          >
            {routes.map((r) => {
              const { a, b } = r;
              const ax = a.position.x, ay = a.position.y;
              const bx = b.position.x, by = b.position.y;
              const mx = ((ax + bx) / 2 + 1.5).toFixed(2);
              const my = ((ay + by) / 2 - 1.5).toFixed(2);
              const d  = `M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`;

                // Gold glowing route — mirrors the game's admin-lit supply line
                <g key={r.key}>
                  <path d={d} fill="none" stroke="rgba(255,207,90,0.12)" strokeWidth="4" />

                    strokeDasharray="7 3" strokeLinecap="round"
                    style={{ animation:'tw-mkt-flow 1.4s linear infinite,tw-mkt-gold 2s ease-in-out infinite' }} />

              );

                <path key={r.key} d={d} fill="none"

const PlayerHub = ({ client, session, profile, refreshProfile, onSignedOut, onShowBacking, onShowShop, onShowProfile, onShowDirectory, onShowFeed }) => {
  const [buyingId, setBuyingId] = useState(null);
  const [buyMsg, setBuyMsg] = useState('');
  const [storeTab, setStoreTab] = useState('packs'); // 'packs' | 'aza'
  // ===== Node registration + admin modals =====
  const [nodeRegOpen, setNodeRegOpen] = useState(false);
  const [adminOpen, setAdminOpen] = useState(false);
  const [myRegistration, setMyRegistration] = useState(null);
  const myEmail = session && session.user ? session.user.email : null;
  const isAdmin = isAdminEmail(myEmail);
  // Pull the signed-in user's existing registration so we can show
  // "View My Registration" instead of "Register Node" once submitted.
  useEffect(() => {
    if (!client || !session) { setMyRegistration(null); return; }
    let cancelled = false;
    client.from('node_registrations').select('*').eq('user_id', session.user.id).maybeSingle()
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error) {
          // Table might not exist yet — surface only on console so the page
          // keeps working until the SQL migration is applied.
          console.warn('node_registrations fetch failed', error.message);
          setMyRegistration(null);
        } else {
          setMyRegistration(data || null);
        }
      });
    return () => { cancelled = true; };
  }, [client, session]);
  // Local form state — only used when this page is reached signed-out.
  const [authMode, setAuthMode] = useState('signin');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [authError, setAuthError] = useState('');
  const [loading, setLoading] = useState(false);
  // ===== Live catalog + card-art lookups, pulled from the same Supabase row /
  // ===== Storage bucket the game reads. Lets us show the REAL card name +
  // ===== portrait art for the player's favorite hero + strongest unit instead
  // ===== of just the raw id ("cc_1778461339611") + a generic helmet icon.
  const [catalogById, setCatalogById] = useState(null);
  const [cardArtMap, setCardArtMap] = useState(null);
  const [spriteMap, setSpriteMap]   = useState(null);
  useEffect(() => {
    if (!client) return;
    // Card catalog row (admin publishes here; all signed-in players can read).
    client.from('card_catalog').select('cards').eq('id', 'singleton').maybeSingle()
      .then(({ data }) => {
        if (!data || !Array.isArray(data.cards)) return;
        const byId = {};
        for (const c of data.cards) { if (c && c.id) byId[c.id] = c; }
        setCatalogById(byId);
      })
      .catch(() => {});
    // Public catalog art bucket. The single-file path works for small assets;
    // big assets (sprites can be 100MB+) get sharded into `<base>-N.json` with
    // an index file at `<base>.index.json` listing them. We try the index
    // first and fall back to the single-file path so both layouts are supported.
    const pullStorage = async (filename, setter) => {
      try {
        const base = filename.replace(/\.json$/, '');
        const idx = await client.storage.from('public-catalog').download(base + '.index.json');
        if (!idx.error && idx.data) {
          const idxObj = JSON.parse(await idx.data.text());
          const shardNames = Array.isArray(idxObj.shards) ? idxObj.shards : [];
          const merged = {};
          for (const sname of shardNames) {
            try {
              const { data, error } = await client.storage.from('public-catalog').download(sname);
              if (error || !data) continue;
              Object.assign(merged, JSON.parse(await data.text()) || {});
            } catch (e) { /* skip bad shard */ }
          }
          if (Object.keys(merged).length > 0) { setter(merged); return; }
        }
        // No index — fall back to the single-file layout.
        const { data, error } = await client.storage.from('public-catalog').download(filename);
        if (error || !data) return;
        const txt = await data.text();
        if (txt) setter(JSON.parse(txt));
      } catch (e) { /* silent — bucket may not be published yet */ }
    };
    pullStorage('cardArt.json', setCardArtMap);
    pullStorage('sprites.json', setSpriteMap);
  }, [client]);

  // Resolve an in-game card's display image. Order: cardArt portrait (the nice
  // illustration shown on the hand-card frame) → first sprite frame (battlefield
  // pixel art) → null (caller renders the emoji fallback). Hero sprites live
  // under either `h_<id>` or `u_<id>`, so we check both.
  const resolveCardImage = (id, isHero) => {
    if (!id) return null;
    // Helper: extract the first available frame from a sprite record. Sprite
    // records can be { idle: [dataURL] } OR { idle: [dataURL], walk: [...] }
    // OR even just an array — accept all shapes.
    const firstFrame = (s) => {
      if (!s) return null;
      if (typeof s === 'string') return s;
      if (Array.isArray(s)) return s[0] || null;
      if (Array.isArray(s.idle) && s.idle.length > 0) return s.idle[0];
      // Last-resort: look for any animation key with frames
      for (const k of Object.keys(s)) {
        if (Array.isArray(s[k]) && s[k].length > 0 && typeof s[k][0] === 'string') return s[k][0];
      }
      return null;
    };
    // Try every plausible cardArt / sprite key in both the public catalog and
    // the player's own forge data. Heroes can be saved under h_<id> OR u_<id>
    // (the game mirrors them), so we check every variant.
    const sources = [];
    const forge = (profile && profile.forge) || {};
    // cardArt portraits (preferred — they're the hand-card illustrations)
    if (forge.cardArt) sources.push(forge.cardArt);
    if (cardArtMap)    sources.push(cardArtMap);
    for (const map of sources) {
      if (map[id]) return map[id];
    }
    // Sprites — try every spritesheet under h_<id> and u_<id> in both data sources
    const spriteSources = [];
    if (forge.sprites) spriteSources.push(forge.sprites);
    if (spriteMap)     spriteSources.push(spriteMap);
    const keys = ['h_' + id, 'u_' + id, id];
    for (const map of spriteSources) {
      for (const k of keys) {
        const frame = firstFrame(map[k]);
        if (frame) return frame;
      }
    }
    return null;
  };

  const handleSignIn = async (e) => {
    e.preventDefault(); setAuthError('');
    if (!client) { setAuthError('Network not ready. Refresh and try again.'); return; }
    setLoading(true);
    try {
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) setAuthError(error.message);
    } catch (err) { setAuthError((err && err.message) || 'Auth failed.'); }
    setLoading(false);
  };
  const handleSignOut = async () => {
    if (!client) return;
    await client.auth.signOut();
    setEmail(''); setPassword('');
    if (onSignedOut) onSignedOut();
  };

  // ----- Pack purchase (Cinders / Aza coin) -----
  const handleBuy = async (pack, currency) => {
    if (!client || !session || !profile) return;
    setBuyMsg(''); setBuyingId(pack.id);
    const cost  = currency === 'sov' ? (pack.sovCost || 0) : (pack.cost || 0);
    const field = currency === 'sov' ? 'sovereigns' : 'gems';
    const have  = (profile[field] || 0);
    if (have < cost) {
      setBuyMsg(`Need ${cost - have} more ${currency === 'sov' ? 'Aza Coin' : 'Cinders'} — earn or top up first.`);
      setBuyingId(null); return;
    }
    const newBalance = have - cost;
    const receipt = {
      id: 'webp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      packId: pack.id, packName: pack.name, currency, cost,
      at: new Date().toISOString(), applied: false,
    };
    const forge = profile.forge && typeof profile.forge === 'object' ? profile.forge : {};
    const pending = Array.isArray(forge.webPurchases) ? forge.webPurchases.slice() : [];
    pending.push(receipt);

    const curWins  = (p && p.wins)  || 0;

    if (curWins > bestWins || (curWins === bestWins && curLvl > bestLvl)) return { id, p };

  //   1. profile.forge.customCards         (the user's own Forge customs —
  //                                         always fresh, contains custom
  //                                         heroes AND custom units)

  //   3. published card_catalog row        (cross-player shared, admin-managed)
  //   4. marketing HEROES array            (built-in survivors)
  //   5. null → caller falls back to humanizeCardId() for a readable name
  const _profileCardLookup = (id) => {
    if (!id) return null;
    const forge = (profile && profile.forge) || {};
    if (Array.isArray(forge.customCards)) {
      const hit = forge.customCards.find(c => c && c.id === id);
      if (hit) return hit;
    }
    if (Array.isArray(forge.customHeroes)) {
      const hit = forge.customHeroes.find(c => c && c.id === id);
      if (hit) return hit;
    }
    if (catalogById && catalogById[id]) return catalogById[id];
    if (typeof HEROES !== 'undefined' && HEROES.find) {

    if (/^h_/.test(id))     return 'Hero';
    if (/^u_/.test(id))     return 'Unit';
    if (/^k_/.test(id))     return 'Kalon';
    return id.replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

                <div className="absolute top-3 right-3 z-10 px-2 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase border bg-black/70"
                     style={{ color: it.accent, borderColor: it.accent }}>
                  {it.rarity}
                </div>
                {/* Type tag */}
                <div className="absolute top-3 left-3 z-10 px-2 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase border border-stone-600/60 bg-black/70 text-stone-300">
                  {it.type}
                </div>

                {/* Item image */}
                <div className="relative aspect-square overflow-hidden flex items-center justify-center" style={{
                  background: `radial-gradient(circle at 50% 50%, ${it.accent}22 0%, transparent 60%), linear-gradient(180deg, #1a1428 0%, #0d0a1c 100%)`,
                }}>
                  {/* Placeholder behind image so a failed load doesn't leave a black void */}
                  <div className="absolute inset-0 flex items-center justify-center" style={{ color: it.accent, opacity: 0.18 }}>
                    <div className="text-9xl font-serif font-bold" style={{ textShadow: `0 0 30px ${it.glow}` }}>{it.name.charAt(0)}</div>
                  </div>
                  <img
                    src={it.image}
                    alt={it.name}
                    className="relative w-full h-full object-contain p-6 transition-transform duration-500"
                    style={{
                      transform: isHovered ? 'scale(1.08) rotate(-1.5deg)' : 'scale(1) rotate(0deg)',
                      filter: `drop-shadow(0 6px 22px ${it.glow})`,
                    }}
                    onError={(e) => { e.currentTarget.style.display = 'none'; }}
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none" />
                </div>

                {/* Info block */}
                <div className="p-5">
                  <DistressedHeading className="text-2xl font-serif font-bold mb-1" style={{ color: it.accent }}>
                    {it.name}
                  </DistressedHeading>
                  <div className="text-stone-400 text-sm italic mb-4">{it.title}</div>

                  {/* Stat chips */}
                  <div className="flex flex-wrap gap-2 mb-4">
                    {Object.entries(it.stats).map(([k, v]) => (
                      <div key={k} className="px-2.5 py-1 bg-black/50 border rounded text-xs font-mono"
                           style={{ borderColor: `${it.accent}66`, color: '#efe4c4' }}>
                        <span className="text-stone-500 mr-1">{k}</span>
                        <span className="font-bold" style={{ color: it.accent }}>{v}</span>
                      </div>
                    ))}
                  </div>

                  {/* Effect */}
                  <div className="bg-black/50 border-l-2 rounded p-3 mb-3" style={{ borderColor: it.accent }}>
                    <div className="text-[10px] tracking-widest uppercase mb-1" style={{ color: it.accent }}>Effect</div>
                    <div className="text-stone-200 text-sm leading-relaxed">{it.effect}</div>
                  </div>

                  <p className="text-stone-500 text-xs italic leading-relaxed">"{it.flavor}"</p>
                </div>
              </div>
            );
          })}
        </div>

        {/* Footer note */}
        <div className="text-center mt-10 text-stone-500 text-xs tracking-widest uppercase">
          <span className="text-orange-400/80">◆</span> Items drop from packs, events, and the Black Market <span className="text-orange-400/80">◆</span>
        </div>
      </div>
    </section>
  );
};

const Champions = ({ onPickHero }) => {

    <section className="relative py-24 px-6">

// Modal that surfaces the full PSN lore. Esc / backdrop click closes.
const PsnLoreModal = ({ open, onClose }) => {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);
  if (!open) return null;

  // Inline body renderer — same shape as renderNewsBody but with PSN-tuned
  // colors so the modal feels like its own document.
  const out = [];
  let bulletBuf = [];
  const flushBullets = (k) => {
    if (!bulletBuf.length) return;
    out.push(
      <ul key={`b-${k}`} className="text-stone-300 leading-relaxed space-y-1.5 my-3 pl-1">
        {bulletBuf.map((b, j) => (
          <li key={j} className="flex items-start gap-2"><span className="text-amber-400/80 mt-0.5 shrink-0">▸</span><span>{b}</span></li>
        ))}
      </ul>
    );
    bulletBuf = [];
  };
  PSN_LORE.body.forEach((line, i) => {
    if (line.startsWith('• ')) {
      bulletBuf.push(line.slice(2));
    } else if (line.startsWith('### ')) {
      flushBullets(i);
      out.push(<h4 key={i} className="text-amber-200 font-serif font-bold text-lg mt-5 mb-2 tracking-wide">{line.slice(4)}</h4>);
    } else if (line.startsWith('## ')) {
      flushBullets(i);
      out.push(<h3 key={i} className="text-yellow-100 font-serif font-bold text-2xl md:text-3xl mt-8 mb-3 tracking-wide border-b border-amber-600/40 pb-2">{line.slice(3)}</h3>);
    } else {
      flushBullets(i);
      out.push(<p key={i} className="text-stone-300 leading-relaxed my-3">{line}</p>);
    }
  });
  flushBullets('end');

  return (
    <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-start justify-center p-4 md:p-8 overflow-y-auto" onClick={onClose} style={{ animation: 'rise 0.3s' }}>
      <button onClick={onClose} aria-label="Close" className="fixed top-6 right-6 w-12 h-12 rounded bg-red-900/40 hover:bg-red-700/50 border border-red-500/40 text-white text-2xl font-bold leading-none flex items-center justify-center transition z-[110]">×</button>
      <article
        onClick={(e) => e.stopPropagation()}
        className="relative bg-gradient-to-br from-stone-950/95 to-black/95 border border-amber-600/40 rounded-lg p-7 md:p-12 my-8 max-w-3xl w-full"
        style={{ boxShadow: '0 24px 80px rgba(0,0,0,0.7), 0 0 60px rgba(255,180,40,0.18)' }}
      >
        <HazardStripe className="absolute top-0 left-0 right-0" />
        <div className="pt-4">
          <div className="text-amber-300/80 text-[10px] tracking-[0.45em] uppercase mb-3 font-bold">— Planetary Survival Network —</div>
          <DistressedHeading level="h2" className="text-4xl md:text-6xl font-serif font-bold text-yellow-100 mb-4">{PSN_LORE.title}</DistressedHeading>
          <p className="text-amber-200/90 italic text-lg md:text-xl leading-snug mb-6 border-l-4 border-amber-500/60 pl-5">
            {PSN_LORE.subtitle}
          </p>
          <div>{out}</div>
          <div className="mt-10 pt-6 border-t border-amber-600/30 flex justify-end">
            <button
              onClick={onClose}
              className="px-5 py-2.5 bg-black/60 border border-amber-500/50 text-amber-200 font-bold text-xs rounded tracking-widest uppercase hover:bg-amber-500/10 transition"
            >
              Close
            </button>
          </div>
        </div>
      </article>
    </div>
  );
};

// ===== NODE REGISTRATION — form primitives =====
// These live at module scope (NOT inside the modal component) so React sees a
// stable component identity across renders. If they were declared inside
// NodeRegistrationModal, every keystroke would call setForm → re-run the
// parent → re-define these functions → new identity → React unmounts and
// remounts the underlying <input>, which kills focus after one character.
const RegSection = ({ title, eyebrow, children }) => (
  <div className="mb-7 pb-7 border-b border-stone-700/40 last:border-b-0 last:pb-0 last:mb-0">
    {eyebrow && <div className="text-amber-400/80 text-[10px] tracking-[0.35em] uppercase font-bold mb-2">{eyebrow}</div>}
    <h3 className="text-yellow-100 font-serif font-bold text-2xl mb-4">{title}</h3>
    <div className="space-y-4">{children}</div>
  </div>
);
const RegLabel = ({ children, required }) => (
  <label className="block text-stone-300 text-sm font-bold mb-1.5">{children}{required && <span className="text-red-400 ml-1">*</span>}</label>
);
const RegTextField = ({ value, onChange, readOnly, placeholder, type = 'text', required }) => (
  <input
    type={type}
    value={value}
    onChange={onChange}
    readOnly={readOnly}
    required={required}
    placeholder={placeholder}
    className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2.5 text-stone-100 text-sm placeholder-stone-600 outline-none transition"
  />
);
// Single checkbox/radio chip. Caller controls checked + onChange so this
// component never closes over form state and stays identity-stable.
const RegCheckbox = ({ checked, onChange, label, disabled }) => (
  <label className={`flex items-start gap-2.5 px-3 py-2 rounded border cursor-pointer transition ${checked ? 'bg-amber-900/30 border-amber-500/60 text-yellow-100' : 'bg-black/40 border-stone-700/60 hover:border-stone-500/80 text-stone-300'} ${disabled ? 'pointer-events-none opacity-80' : ''}`}>
    <span className={`mt-0.5 w-4 h-4 rounded-sm border-2 flex-shrink-0 flex items-center justify-center ${checked ? 'bg-amber-500 border-amber-400' : 'border-stone-500'}`}>
      {checked && <span className="text-stone-900 text-[10px] font-black leading-none">✓</span>}
    </span>
    <input type="checkbox" checked={checked} onChange={onChange} className="sr-only" />
    <span className="text-sm">{label}</span>
  </label>
);
// Multi-line text field — same module-scope rule as the others so focus
// survives keystroke-triggered re-renders.
const RegTextArea = ({ value, onChange, readOnly, placeholder, required, rows = 3 }) => (
  <textarea
    value={value}
    onChange={onChange}
    readOnly={readOnly}
    required={required}
    placeholder={placeholder}
    rows={rows}
    className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2.5 text-stone-100 text-sm placeholder-stone-600 outline-none transition resize-y"
  />
);

// ===== NODE REGISTRATION MODAL =====
// Foundation Reserve Node Registration form. Saves into the Supabase
// `node_registrations` table — see the SQL migration delivered with this
// feature for the schema and RLS policies.
const NodeRegistrationModal = ({ open, onClose, client, session, onSubmitted, existing }) => {
  // Lock body scroll + Esc-to-close while open.
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);

  // Form state — pre-seed with the user's email so they don't have to retype.
  const blank = {
    full_name: '',
    email: (session && session.user && session.user.email) || '',
    discord: '',
    country: '',
    node_display_name: '',
    node_licenses: [],
    management_pref: '',
    hire_gamers: '',
    willing_to_promote: '',
    participate_initiatives: '',
    interests: [],
    interests_other: '',
    emergency_support: '',
    check_frequency: '',
    primary_reason: '',
    primary_reason_other: '',
    appear_on_registry: false,
    receive_opportunities: false,
    agreed: false,
    signature: '',
  };
  const [form, setForm] = useState(blank);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');
  const [done, setDone] = useState(false);

  // Reset form whenever the modal is reopened. If `existing` is passed in,
  // pre-fill it so the user sees what they already submitted (read-only).
  useEffect(() => {
    if (!open) return;
    setError(''); setDone(false); setSubmitting(false);
    if (existing) {
      setForm({
        full_name: existing.full_name || '',
        email: existing.email || blank.email,
        discord: existing.discord || '',
        country: existing.country || '',
        node_display_name: existing.node_display_name || '',
        node_licenses: existing.node_licenses || [],
        management_pref: existing.management_pref || '',
        hire_gamers: existing.hire_gamers || '',
        willing_to_promote: existing.willing_to_promote || '',
        participate_initiatives: existing.participate_initiatives || '',
        interests: existing.interests || [],
        interests_other: existing.interests_other || '',
        emergency_support: existing.emergency_support || '',
        check_frequency: existing.check_frequency || '',
        primary_reason: existing.primary_reason || '',
        primary_reason_other: existing.primary_reason_other || '',
        appear_on_registry: !!existing.appear_on_registry,
        receive_opportunities: !!existing.receive_opportunities,
        agreed: !!existing.agreed,
        signature: existing.signature || '',
      });
    } else {
      setForm(blank);
    }
  }, [open, existing]);

  if (!open) return null;

  const readOnly = !!existing; // Already submitted? Display in read-only mode.

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const toggle = (k, value) => setForm((f) => {
    const cur = f[k] || [];
    return { ...f, [k]: cur.includes(value) ? cur.filter((x) => x !== value) : [...cur, value] };
  });

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (readOnly) { onClose(); return; }
    setError('');
    // Minimal validation — server-side RLS catches the rest.
    if (!form.full_name.trim()) { setError('Full Legal Name is required.'); return; }
    if (!form.email.trim())     { setError('Email is required.'); return; }
    if (!form.country.trim())   { setError('Country is required.'); return; }
    if (!form.node_display_name.trim()) { setError('Node Display Name is required.'); return; }
    if (form.node_licenses.length === 0) { setError('Please select at least one Node License you own.'); return; }
    if (!form.agreed) { setError('Please check "I Agree" to continue.'); return; }
    if (!form.signature.trim()) { setError('Please type your full name as your e-signature.'); return; }
    if (form.signature.trim().toLowerCase() !== form.full_name.trim().toLowerCase()) {
      setError('E-signature must match your Full Legal Name exactly.');
      return;
    }
    if (!client || !session) { setError('You must be signed in to submit.'); return; }

    setSubmitting(true);
    const row = {
      user_id: session.user.id,
      email: form.email.trim(),
      full_name: form.full_name.trim(),
      discord: form.discord.trim() || null,
      country: form.country.trim(),
      node_display_name: form.node_display_name.trim(),
      node_licenses: form.node_licenses,
      management_pref: form.management_pref || null,
      hire_gamers: form.hire_gamers || null,
      willing_to_promote: form.willing_to_promote || null,
      participate_initiatives: form.participate_initiatives || null,
      interests: form.interests,
      interests_other: form.interests_other.trim() || null,
      emergency_support: form.emergency_support || null,
      check_frequency: form.check_frequency || null,
      primary_reason: form.primary_reason || null,
      primary_reason_other: form.primary_reason_other.trim() || null,
      appear_on_registry: !!form.appear_on_registry,
      receive_opportunities: !!form.receive_opportunities,
      agreed: !!form.agreed,
      signature: form.signature.trim(),
      signed_at: new Date().toISOString(),
    };
    const { error: insertError, data } = await client.from('node_registrations').insert(row).select().maybeSingle();
    setSubmitting(false);
    if (insertError) {
      let msg = insertError.message || 'Unknown error.';
      // The most common cause: the SQL migration hasn't been run yet, so the
      // node_registrations table simply isn't in Supabase. Surface a clearer
      // hint instead of leaving the user to decode the raw Postgres error.
      if (/relation .* does not exist|could not find the table/i.test(msg)) {
        msg = 'The node_registrations table does not exist yet in Supabase. The site admin needs to run the database migration. (' + msg + ')';
      }
      setError('Submission failed — ' + msg);
      return;
    }
    setDone(true);
    if (onSubmitted) onSubmitted(data || row);
  };

  // ----- Per-field bind helpers — these are CLOSURES, called inline below;
  //       they don't introduce new component identities, so editing them on
  //       every render is fine. The actual <input>/<label> components live at
  //       module scope (see RegSection, RegLabel, RegTextField, RegCheckbox).
  // ----- multi: toggle this value in form[field] (array of strings)
  const multiCheckbox = (field, value) => ({
    checked: (form[field] || []).includes(value),
    onChange: readOnly ? () => {} : () => toggle(field, value),
    label: value,
    disabled: readOnly,
  });
  // ----- single: form[group] = value (radio-style, but rendered as a chip)
  const singleCheckbox = (group, value) => {
    const checked = form[group] === value;
    return {
      checked,
      onChange: readOnly ? () => {} : () => set(group, checked ? '' : value),
      label: value,
      disabled: readOnly,
    };
  };
  // ----- yes/no boolean radio chip
  const boolCheckbox = (field, value, label) => {
    const checked = form[field] === value;
    return {
      checked,
      onChange: readOnly ? () => {} : () => set(field, value),
      label,
      disabled: readOnly,
    };
  };

  return (
    <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-start justify-center p-4 md:p-8 overflow-y-auto" onClick={onClose} style={{ animation: 'rise 0.3s' }}>
      <button onClick={onClose} aria-label="Close" className="fixed top-6 right-6 w-12 h-12 rounded bg-red-900/40 hover:bg-red-700/50 border border-red-500/40 text-white text-2xl font-bold leading-none flex items-center justify-center transition z-[110]">×</button>
      <form
        onSubmit={handleSubmit}
        onClick={(e) => e.stopPropagation()}
        className="relative bg-gradient-to-br from-stone-950/96 to-black/96 border border-amber-600/40 rounded-lg p-7 md:p-12 my-8 max-w-3xl w-full"
        style={{ boxShadow: '0 24px 80px rgba(0,0,0,0.7), 0 0 60px rgba(255,180,40,0.18)' }}
      >
        <HazardStripe className="absolute top-0 left-0 right-0" />

        {done ? (
          <div className="text-center py-8">
            <div className="text-amber-300/80 text-xs tracking-[0.4em] uppercase mb-3">— Registration Received —</div>
            <DistressedHeading level="h2" className="text-4xl md:text-5xl font-serif font-bold text-yellow-100 mb-4">Welcome, Future Node Owner.</DistressedHeading>
            <p className="text-stone-300 leading-relaxed mb-8 max-w-xl mx-auto">
              Your submission has been recorded. The Foundation Reserve team will be in touch as licenses become available.
            </p>
            <button type="button" onClick={onClose} className="px-6 py-3 bg-gradient-to-r from-orange-600 to-red-700 text-yellow-100 font-bold rounded tracking-widest uppercase text-xs hover:shadow-lg hover:shadow-orange-500/40 transition border border-orange-400/50">
              Close
            </button>
          </div>
        ) : (
        <div className="pt-4">
          <div className="text-amber-300/80 text-[10px] tracking-[0.45em] uppercase mb-3 font-bold">— Foundation Reserve —</div>
          <DistressedHeading level="h2" className="text-3xl md:text-5xl font-serif font-bold text-yellow-100 mb-3">
            {readOnly ? 'Your Node Registration' : 'Node Registration'}
          </DistressedHeading>
          <p className="text-stone-300 leading-relaxed mb-2">
            Thank you for your interest in becoming part of the Foundation Reserve Network.
          </p>
          <p className="text-stone-400 text-sm leading-relaxed mb-8 italic">
            Nodes are the backbone of the world economy. They help keep civilization running, power player activity, support trade, maintain infrastructure, and create opportunities for both gamers and supporters alike.
          </p>

          {/* ===== Applicant Information ===== */}
          <RegSection eyebrow="01 — Applicant" title="Applicant Information">
            <div><RegLabel required>Full Legal Name</RegLabel><RegTextField value={form.full_name} onChange={(e) => set('full_name', e.target.value)} readOnly={readOnly} required /></div>
            <div><RegLabel required>Email Address</RegLabel><RegTextField value={form.email} onChange={(e) => set('email', e.target.value)} readOnly={readOnly} type="email" required /></div>
            <div><RegLabel>Discord Username (Optional)</RegLabel><RegTextField value={form.discord} onChange={(e) => set('discord', e.target.value)} readOnly={readOnly} placeholder="username#0000" /></div>
            <div><RegLabel required>Country</RegLabel><RegTextField value={form.country} onChange={(e) => set('country', e.target.value)} readOnly={readOnly} required /></div>

          <RegSection eyebrow="02 — Node" title="Node Information">
            <div><RegLabel required>What name would you like displayed on your Node?</RegLabel><RegTextField value={form.node_display_name} onChange={(e) => set('node_display_name', e.target.value)} readOnly={readOnly} required /></div>

              <RegLabel required>Which Node License(s) Do You Own?</RegLabel>

          <RegSection eyebrow="03 — Management" title="Node Management Preferences">
            <div>
              <RegLabel>How would you like your Node to operate?</RegLabel>
              <div className="grid gap-2">
                {['I plan to actively manage my Node myself.',
                  'I want to hire players to help operate my Node.',
                  'I want the system to automatically assign workers when available.',
                  'Undecided.'].map((v) => <RegCheckbox key={v} {...singleCheckbox('management_pref', v)} />)}
              </div>
            </div>
            <div>
              <RegLabel>Are you interested in allowing gamers to work your Node and potentially increase its rewards and efficiency?</RegLabel>
              <div className="grid grid-cols-3 gap-2">
                {['Yes', 'No', 'Maybe'].map((v) => <RegCheckbox key={v} {...singleCheckbox('hire_gamers', v)} />)}
