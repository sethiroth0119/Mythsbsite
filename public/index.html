            </div>
            <div>
              <RegLabel>Would you be willing to tell others about Mythic Spellbook and help grow the community?</RegLabel>
              <div className="grid sm:grid-cols-3 gap-2">
                {['Absolutely', 'Occasionally', 'Not at this time'].map((v) => <RegCheckbox key={v} {...singleCheckbox('willing_to_promote', v)} />)}
              </div>
            </div>
            <div>
              <RegLabel>If needed, would you be willing to participate in community initiatives that help keep players engaged and the world thriving?</RegLabel>
              <div className="grid sm:grid-cols-3 gap-2">
                {['Yes', 'No', 'Depends on the initiative'].map((v) => <RegCheckbox key={v} {...singleCheckbox('participate_initiatives', v)} />)}
              </div>
            </div>
          </RegSection>

          {/* ===== Governance & World Participation ===== */}
          <RegSection eyebrow="04 — Governance" title="Governance & World Participation">
            <div>
              <RegLabel>Which activities interest you most?</RegLabel>
              <div className="grid sm:grid-cols-2 gap-2 mb-2">
                {NODE_INTERESTS.map((v) => <RegCheckbox key={v} {...multiCheckbox('interests', v)} />)}
              </div>
              <input
                type="text"
                value={form.interests_other}
                onChange={(e) => set('interests_other', e.target.value)}
                readOnly={readOnly}
                placeholder="Other (please specify)"
                className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2 text-stone-100 text-sm placeholder-stone-600 outline-none transition mt-1"
              />
            </div>
            <div>
              <RegLabel>If your Node required emergency assistance due to corruption, disasters, monster outbreaks, or economic collapse, would you support recovery efforts?</RegLabel>
              <div className="grid sm:grid-cols-3 gap-2">
                {['Yes', 'No', 'Depends on the situation'].map((v) => <RegCheckbox key={v} {...singleCheckbox('emergency_support', v)} />)}
              </div>
            </div>
            <div>
              <RegLabel>How often do you expect to check on your Node?</RegLabel>
              <div className="grid grid-cols-4 gap-2">
                {['Daily', 'Weekly', 'Monthly', 'Rarely'].map((v) => <RegCheckbox key={v} {...singleCheckbox('check_frequency', v)} />)}
              </div>
            </div>
            <div>
              <RegLabel>What is your primary reason for becoming a Node Owner?</RegLabel>
              <div className="grid sm:grid-cols-2 gap-2 mb-2">
                {NODE_PRIMARY_REASONS.map((v) => <RegCheckbox key={v} {...singleCheckbox('primary_reason', v)} />)}
              </div>
              <input
                type="text"
                value={form.primary_reason_other}
                onChange={(e) => set('primary_reason_other', e.target.value)}
                readOnly={readOnly}
                placeholder="Other (please specify)"
                className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2 text-stone-100 text-sm placeholder-stone-600 outline-none transition mt-1"
              />
            </div>
          </RegSection>

          {/* ===== Community Recognition ===== */}
          <RegSection eyebrow="05 — Recognition" title="Community Recognition">
            <div>
              <RegLabel>Would you like your Node to appear on the public Foundation Reserve Registry?</RegLabel>
              <div className="grid grid-cols-2 gap-2">
                <RegCheckbox {...boolCheckbox('appear_on_registry', true,  'Yes')} />
                <RegCheckbox {...boolCheckbox('appear_on_registry', false, 'No')} />
              </div>
            </div>
            <div>
              <RegLabel>Would you like to receive future opportunities involving governance votes, special events, and Foundation Reserve programs?</RegLabel>
              <div className="grid grid-cols-2 gap-2">
                <RegCheckbox {...boolCheckbox('receive_opportunities', true,  'Yes')} />
                <RegCheckbox {...boolCheckbox('receive_opportunities', false, 'No')} />
              </div>
            </div>
          </RegSection>

          {/* ===== Final Declaration ===== */}
          <RegSection eyebrow="06 — Declaration" title="Final Declaration">
            <p className="text-stone-300 text-sm leading-relaxed">
              I understand that Foundation Reserve Nodes are designed to support the world economy, player activity, and long-term growth of Mythic Spellbook.
            </p>
            <p className="text-stone-300 text-sm leading-relaxed">
              I understand that rewards are based on Node activity, participation, world conditions, and overall ecosystem performance.
            </p>
            <p className="text-stone-300 text-sm leading-relaxed">
              I agree to uphold fair play and support the long-term health of the community.
            </p>

            <label className={`flex items-start gap-3 p-4 rounded border cursor-pointer transition ${form.agreed ? 'bg-amber-900/30 border-amber-500/60' : 'bg-black/40 border-stone-700/60'}`}>
              <span className={`mt-0.5 w-5 h-5 rounded-sm border-2 flex-shrink-0 flex items-center justify-center ${form.agreed ? 'bg-amber-500 border-amber-400' : 'border-stone-500'}`}>
                {form.agreed && <span className="text-stone-900 text-xs font-black leading-none">✓</span>}
              </span>
              <input type="checkbox" checked={form.agreed} onChange={() => !readOnly && set('agreed', !form.agreed)} className="sr-only" />
              <span className="text-yellow-100 font-bold text-sm">I Agree</span>
            </label>

            <div className="mt-2 p-5 rounded border-2 border-dashed border-amber-500/40 bg-black/40">
              <div className="text-amber-300/80 text-[10px] uppercase tracking-[0.35em] font-bold mb-2">E-Signature</div>
              <p className="text-stone-400 text-xs leading-relaxed mb-3">
                By typing your full legal name below, you are providing an electronic signature with the same legal effect as a written signature. Your name must match the Full Legal Name entered above.
              </p>
              <input
                type="text"
                value={form.signature}
                onChange={(e) => set('signature', e.target.value)}
                readOnly={readOnly}
                placeholder="Type your full legal name here"
                className="w-full bg-black/70 border-b-2 border-amber-500/60 focus:border-amber-300/80 px-3 py-3 text-yellow-100 text-2xl font-serif italic outline-none transition"
                style={{ fontFamily: 'cursive, "Cinzel", serif' }}
              />
              <div className="text-stone-500 text-xs mt-2 font-mono">
                Signed on: {new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}
              </div>
            </div>
          </RegSection>

          {error && (
            <div className="mb-4 p-3 bg-red-900/40 border border-red-500/50 rounded text-red-200 text-sm">
              {error}
            </div>
          )}

          <div className="flex justify-end gap-3 pt-4 border-t border-amber-600/30">
            <button type="button" onClick={onClose} className="px-5 py-2.5 bg-black/60 border border-stone-600/50 text-stone-300 font-bold text-xs rounded tracking-widest uppercase hover:bg-stone-800/50 transition">
              {readOnly ? 'Close' : 'Cancel'}
            </button>
            {!readOnly && (
              <button type="submit" disabled={submitting} className="px-6 py-2.5 bg-gradient-to-r from-orange-600 to-red-700 disabled:opacity-60 text-yellow-100 font-bold text-xs rounded tracking-widest uppercase hover:shadow-lg hover:shadow-orange-500/40 transition border border-orange-400/50">
                {submitting ? 'Submitting…' : 'Submit Registration'}
              </button>
            )}
          </div>
        </div>
        )}
      </form>
    </div>
  );
};

// ===== CREATOR PROGRAM MODAL =====
// Application form for the Survivor Creator Program. Submits into the
// Supabase `creator_applications` table (see the SQL migration). Admin
// reviews submissions in the same Admin Console as Node Registrations.
const CreatorProgramModal = ({ open, onClose, client, session, onSubmitted, existing }) => {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);

  const blank = {
    full_name: '',
    creator_alias: '',
    email: (session && session.user && session.user.email) || '',
    discord: '',
    country: '',
    age: '',
    primary_platform: '',
    main_channel_url: '',
    social_links: '',
    total_followers: '',
    monthly_views: '',
    monthly_streams: '',
    content_types: [],
    creator_duration: '',
    prior_gaming_content: '',
    prior_games: '',
    heard_about: '',
    ms_interest: '',
    why_creator: '',
    ms_content_types: [],
    content_frequency: '',
    portfolio_1: '',
    portfolio_2: '',
    portfolio_3: '',
    represent_professionally: '',
    treat_respectfully: '',
    no_abuse: '',
    why_choose: '',
    agreed: false,
    signature: '',
  };
  const [form, setForm] = useState(blank);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (!open) return;
    setError(''); setDone(false); setSubmitting(false);
    if (existing) {
      // Show what they already submitted in read-only mode.
      const e = existing;
      setForm({
        full_name: e.full_name || '', creator_alias: e.creator_alias || '',
        email: e.email || blank.email, discord: e.discord || '',
        country: e.country || '', age: e.age || '',
        primary_platform: e.primary_platform || '',
        main_channel_url: e.main_channel_url || '',
        social_links: e.social_links || '',
        total_followers: e.total_followers || '',
        monthly_views: e.monthly_views || '',
        monthly_streams: e.monthly_streams || '',
        content_types: e.content_types || [],
        creator_duration: e.creator_duration || '',
        prior_gaming_content: e.prior_gaming_content || '',
        prior_games: e.prior_games || '',
        heard_about: e.heard_about || '',
        ms_interest: e.ms_interest || '',
        why_creator: e.why_creator || '',
        ms_content_types: e.ms_content_types || [],
        content_frequency: e.content_frequency || '',
        portfolio_1: e.portfolio_1 || '',
        portfolio_2: e.portfolio_2 || '',
        portfolio_3: e.portfolio_3 || '',
        represent_professionally: e.represent_professionally || '',
        treat_respectfully: e.treat_respectfully || '',
        no_abuse: e.no_abuse || '',
        why_choose: e.why_choose || '',
        agreed: !!e.agreed,
        signature: e.signature || '',
      });
    } else {
      setForm(blank);
    }
  }, [open, existing]);

  if (!open) return null;

  const readOnly = !!existing;
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const toggle = (k, v) => setForm((f) => {
    const cur = f[k] || [];
    return { ...f, [k]: cur.includes(v) ? cur.filter((x) => x !== v) : [...cur, v] };
  });
  const multi  = (field, value) => ({ checked: (form[field] || []).includes(value), onChange: readOnly ? () => {} : () => toggle(field, value), label: value, disabled: readOnly });
  const single = (group, value) => { const checked = form[group] === value; return { checked, onChange: readOnly ? () => {} : () => set(group, checked ? '' : value), label: value, disabled: readOnly }; };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (readOnly) { onClose(); return; }
    setError('');
    if (!form.full_name.trim())     { setError('Full Name is required.'); return; }
    if (!form.email.trim())         { setError('Email Address is required.'); return; }
    if (!form.country.trim())       { setError('Country is required.'); return; }
    if (!form.primary_platform)     { setError('Please choose a Primary Platform.'); return; }
    if (!form.represent_professionally || !form.treat_respectfully || !form.no_abuse) {
      setError('Please answer all three Community Standards questions.'); return;
    }
    if (!form.agreed)               { setError('Please check "I Agree" to continue.'); return; }
    if (!form.signature.trim())     { setError('Please type your full name (or creator name) as your signature.'); return; }
    if (!client || !session)        { setError('You must be signed in to submit.'); return; }

    setSubmitting(true);
    const row = {
      user_id: session.user.id,
      full_name: form.full_name.trim(),
      creator_alias: form.creator_alias.trim() || null,
      email: form.email.trim(),
      discord: form.discord.trim() || null,
      country: form.country.trim(),
      age: form.age.trim() || null,
      primary_platform: form.primary_platform || null,
      main_channel_url: form.main_channel_url.trim() || null,
      social_links: form.social_links.trim() || null,
      total_followers: form.total_followers.trim() || null,
      monthly_views: form.monthly_views.trim() || null,
      monthly_streams: form.monthly_streams.trim() || null,
      content_types: form.content_types,
      creator_duration: form.creator_duration || null,
      prior_gaming_content: form.prior_gaming_content || null,
      prior_games: form.prior_games.trim() || null,
      heard_about: form.heard_about.trim() || null,
      ms_interest: form.ms_interest.trim() || null,
      why_creator: form.why_creator.trim() || null,
      ms_content_types: form.ms_content_types,
      content_frequency: form.content_frequency || null,
      portfolio_1: form.portfolio_1.trim() || null,
      portfolio_2: form.portfolio_2.trim() || null,
      portfolio_3: form.portfolio_3.trim() || null,
      represent_professionally: form.represent_professionally || null,
      treat_respectfully: form.treat_respectfully || null,
      no_abuse: form.no_abuse || null,
      why_choose: form.why_choose.trim() || null,
      agreed: !!form.agreed,
      signature: form.signature.trim(),
      signed_at: new Date().toISOString(),
    };
    const { error: insertError, data } = await client.from('creator_applications').insert(row).select().maybeSingle();
    setSubmitting(false);
    if (insertError) {
      let msg = insertError.message || 'Unknown error.';
      if (/relation .* does not exist|could not find the table/i.test(msg)) {
        msg = 'The creator_applications table does not exist yet in Supabase. The site admin needs to run the database migration. (' + msg + ')';
      }
      setError('Submission failed — ' + msg);
      return;
    }
    setDone(true);
    if (onSubmitted) onSubmitted(data || row);
  };

  // Not signed in? Show a sign-in nudge instead of the form.
  if (!session) {
    return (
      <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-center justify-center p-4 md:p-8 overflow-y-auto" onClick={onClose} style={{ animation: 'rise 0.3s' }}>
        <button onClick={onClose} aria-label="Close" className="fixed top-6 right-6 w-12 h-12 rounded bg-red-900/40 hover:bg-red-700/50 border border-red-500/40 text-white text-2xl font-bold leading-none flex items-center justify-center transition z-[110]">×</button>
        <div onClick={(e) => e.stopPropagation()} className="bg-gradient-to-br from-stone-950/95 to-black/95 border border-amber-600/40 rounded-lg p-8 md:p-12 max-w-lg w-full text-center" style={{ boxShadow: '0 24px 80px rgba(0,0,0,0.7)' }}>
          <div className="text-amber-300/80 text-[10px] tracking-[0.45em] uppercase mb-3 font-bold">— Sign In Required —</div>
          <DistressedHeading level="h2" className="text-3xl md:text-4xl font-serif font-bold text-yellow-100 mb-4">Sign In To Apply</DistressedHeading>
          <p className="text-stone-300 leading-relaxed mb-6">
            The Creator Program application is tied to your player account so you can update your submission and track its status.
          </p>
          <a href={LOGIN_URL} className="inline-block px-6 py-3 bg-gradient-to-r from-orange-600 to-red-700 text-yellow-100 font-bold rounded tracking-widest uppercase text-xs hover:shadow-lg hover:shadow-orange-500/40 transition border border-orange-400/50">
            Sign In / Sign Up
          </a>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-start justify-center p-4 md:p-8 overflow-y-auto" onClick={onClose} style={{ animation: 'rise 0.3s' }}>
      <button onClick={onClose} aria-label="Close" className="fixed top-6 right-6 w-12 h-12 rounded bg-red-900/40 hover:bg-red-700/50 border border-red-500/40 text-white text-2xl font-bold leading-none flex items-center justify-center transition z-[110]">×</button>
      <form
        onSubmit={handleSubmit}
        onClick={(e) => e.stopPropagation()}
        className="relative bg-gradient-to-br from-stone-950/96 to-black/96 border border-amber-600/40 rounded-lg p-7 md:p-12 my-8 max-w-3xl w-full"
        style={{ boxShadow: '0 24px 80px rgba(0,0,0,0.7), 0 0 60px rgba(255,180,40,0.18)' }}
      >
        <HazardStripe className="absolute top-0 left-0 right-0" />

        {done ? (
          <div className="text-center py-8">
            <div className="text-amber-300/80 text-xs tracking-[0.4em] uppercase mb-3">— Application Received —</div>
            <DistressedHeading level="h2" className="text-4xl md:text-5xl font-serif font-bold text-yellow-100 mb-4">Welcome To The Program.</DistressedHeading>
            <p className="text-stone-300 leading-relaxed mb-8 max-w-xl mx-auto">
              Your application has been recorded. The team will review and reach out via your Discord or email if you're a fit.
            </p>
            <button type="button" onClick={onClose} className="px-6 py-3 bg-gradient-to-r from-orange-600 to-red-700 text-yellow-100 font-bold rounded tracking-widest uppercase text-xs hover:shadow-lg hover:shadow-orange-500/40 transition border border-orange-400/50">
              Close
            </button>
          </div>
        ) : (
        <div className="pt-4">
          <div className="text-amber-300/80 text-[10px] tracking-[0.45em] uppercase mb-3 font-bold">— Survivor Creator Program —</div>
          <DistressedHeading level="h2" className="text-3xl md:text-5xl font-serif font-bold text-yellow-100 mb-3">
            {readOnly ? 'Your Creator Application' : 'Creator Program Application'}
          </DistressedHeading>
          <p className="text-stone-300 leading-relaxed mb-2">
            We're looking for creators, streamers, community leaders, deck builders, lore creators, video makers, educators, and gamers who want to help grow the world of Mythic Spellbook.
          </p>
          <p className="text-stone-400 text-sm leading-relaxed mb-6 italic">
            Approved creators may receive: a <strong className="text-amber-200 not-italic">Titan Node</strong>, Creator Campaigns, monthly Cinder + AZA rewards, plus direct support (resources, promotion, visibility, events, creator-only comms). Rewards may evolve as the program grows.
          </p>

          {/* ===== Creator Information ===== */}
          <RegSection eyebrow="01 — Creator" title="Creator Information">
            <div><RegLabel required>Full Name</RegLabel><RegTextField value={form.full_name} onChange={(e) => set('full_name', e.target.value)} readOnly={readOnly} required /></div>
            <div><RegLabel>Creator Name / Alias</RegLabel><RegTextField value={form.creator_alias} onChange={(e) => set('creator_alias', e.target.value)} readOnly={readOnly} placeholder="Your screen name" /></div>
            <div><RegLabel required>Email Address</RegLabel><RegTextField value={form.email} onChange={(e) => set('email', e.target.value)} readOnly={readOnly} type="email" required /></div>
            <div><RegLabel>Discord Username</RegLabel><RegTextField value={form.discord} onChange={(e) => set('discord', e.target.value)} readOnly={readOnly} placeholder="username#0000" /></div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div><RegLabel required>Country</RegLabel><RegTextField value={form.country} onChange={(e) => set('country', e.target.value)} readOnly={readOnly} required /></div>
              <div><RegLabel>Age</RegLabel><RegTextField value={form.age} onChange={(e) => set('age', e.target.value)} readOnly={readOnly} placeholder="e.g. 24" /></div>
            </div>
          </RegSection>

          {/* ===== Content Information ===== */}
          <RegSection eyebrow="02 — Content" title="Content Information">
            <div>
              <RegLabel required>Primary Platform</RegLabel>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                {CREATOR_PLATFORMS.map((p) => <RegCheckbox key={p} {...single('primary_platform', p)} />)}
              </div>
            </div>
            <div><RegLabel>Link to Main Channel</RegLabel><RegTextField value={form.main_channel_url} onChange={(e) => set('main_channel_url', e.target.value)} readOnly={readOnly} placeholder="https://" /></div>
            <div><RegLabel>Additional Social Media Links</RegLabel><RegTextArea value={form.social_links} onChange={(e) => set('social_links', e.target.value)} readOnly={readOnly} rows={2} placeholder="One per line" /></div>
            <div className="grid sm:grid-cols-3 gap-3">
              <div><RegLabel>Total Followers/Subs</RegLabel><RegTextField value={form.total_followers} onChange={(e) => set('total_followers', e.target.value)} readOnly={readOnly} placeholder="Across all platforms" /></div>
              <div><RegLabel>Avg Monthly Views</RegLabel><RegTextField value={form.monthly_views} onChange={(e) => set('monthly_views', e.target.value)} readOnly={readOnly} /></div>
              <div><RegLabel>Avg Monthly Streams</RegLabel><RegTextField value={form.monthly_streams} onChange={(e) => set('monthly_streams', e.target.value)} readOnly={readOnly} placeholder="If applicable" /></div>
            </div>
          </RegSection>

          {/* ===== Creator Background ===== */}
          <RegSection eyebrow="03 — Background" title="Creator Background">
            <div>
              <RegLabel>What type of content do you create?</RegLabel>
              <div className="grid sm:grid-cols-2 gap-2">
                {CREATOR_CONTENT_TYPES.map((v) => <RegCheckbox key={v} {...multi('content_types', v)} />)}
              </div>
            </div>
            <div>
              <RegLabel>How long have you been creating content?</RegLabel>
              <div className="grid sm:grid-cols-2 gap-2">
                {CREATOR_DURATIONS.map((v) => <RegCheckbox key={v} {...single('creator_duration', v)} />)}
              </div>
            </div>
            <div>
              <RegLabel>Have you created content for gaming communities before?</RegLabel>
              <div className="grid grid-cols-2 gap-2">
                <RegCheckbox {...single('prior_gaming_content', 'Yes')} />
                <RegCheckbox {...single('prior_gaming_content', 'No')} />
              </div>
            </div>
            {form.prior_gaming_content === 'Yes' && (
              <div><RegLabel>If yes, which games?</RegLabel><RegTextField value={form.prior_games} onChange={(e) => set('prior_games', e.target.value)} readOnly={readOnly} /></div>
            )}
          </RegSection>

          {/* ===== Mythic Spellbook Questions ===== */}
          <RegSection eyebrow="04 — About Mythic Spellbook" title="Mythic Spellbook Questions">

            <div><RegLabel>What interests you most about Mythic Spellbook?</RegLabel><RegTextArea value={form.ms_interest} onChange={(e) => set('ms_interest', e.target.value)} readOnly={readOnly} /></div>

            <div>

            <div><RegLabel>Content Example #2</RegLabel><RegTextField value={form.portfolio_2} onChange={(e) => set('portfolio_2', e.target.value)} readOnly={readOnly} placeholder="https://" /></div>
            <div><RegLabel>Content Example #3</RegLabel><RegTextField value={form.portfolio_3} onChange={(e) => set('portfolio_3', e.target.value)} readOnly={readOnly} placeholder="https://" /></div>

          {/* ===== Community Standards ===== */}
          <RegSection eyebrow="06 — Community Standards" title="Community Standards">
            <div>
              <RegLabel required>Do you agree to represent Mythic Spellbook professionally?</RegLabel>
              <div className="grid grid-cols-2 gap-2">
                <RegCheckbox {...single('represent_professionally', 'Yes')} />
                <RegCheckbox {...single('represent_professionally', 'No')} />
              </div>
            </div>
            <div>
              <RegLabel required>Do you agree to treat players, creators, moderators, and staff respectfully?</RegLabel>
              <div className="grid grid-cols-2 gap-2">
                <RegCheckbox {...single('treat_respectfully', 'Yes')} />
                <RegCheckbox {...single('treat_respectfully', 'No')} />
              </div>
            </div>
            <div>
              <RegLabel required>Do you agree not to engage in cheating, scams, harassment, hate speech, or community abuse?</RegLabel>
              <div className="grid grid-cols-2 gap-2">
                <RegCheckbox {...single('no_abuse', 'Yes')} />
                <RegCheckbox {...single('no_abuse', 'No')} />
              </div>
            </div>
          </RegSection>

          {/* ===== Final Question ===== */}
          <RegSection eyebrow="07 — Final" title="Final Question">
            <div><RegLabel>Why should we choose you as a Mythic Spellbook Creator?</RegLabel><RegTextArea value={form.why_choose} onChange={(e) => set('why_choose', e.target.value)} readOnly={readOnly} rows={5} /></div>
          </RegSection>

          {/* ===== Agreement + Signature ===== */}
          <RegSection eyebrow="08 — Agreement" title="Agreement">
            <p className="text-stone-300 text-sm leading-relaxed">
              I understand that acceptance into the Creator Program is not guaranteed.
            </p>
            <p className="text-stone-300 text-sm leading-relaxed">
              I understand that creator rewards, Titan Nodes, campaigns, Cinder, AZA, and support are subject to program requirements and continued participation.
            </p>

            <label className={`flex items-start gap-3 p-4 rounded border cursor-pointer transition ${form.agreed ? 'bg-amber-900/30 border-amber-500/60' : 'bg-black/40 border-stone-700/60'}`}>
              <span className={`mt-0.5 w-5 h-5 rounded-sm border-2 flex-shrink-0 flex items-center justify-center ${form.agreed ? 'bg-amber-500 border-amber-400' : 'border-stone-500'}`}>
                {form.agreed && <span className="text-stone-900 text-xs font-black leading-none">✓</span>}
              </span>
              <input type="checkbox" checked={form.agreed} onChange={() => !readOnly && set('agreed', !form.agreed)} className="sr-only" />
              <span className="text-yellow-100 font-bold text-sm">I Agree</span>
            </label>

            <div className="mt-2 p-5 rounded border-2 border-dashed border-amber-500/40 bg-black/40">
              <div className="text-amber-300/80 text-[10px] uppercase tracking-[0.35em] font-bold mb-2">Signature / Creator Name</div>
              <p className="text-stone-400 text-xs leading-relaxed mb-3">
                Type your full name (or your creator name) below. This is your electronic signature.
              </p>
              <input
                type="text"
                value={form.signature}
                onChange={(e) => set('signature', e.target.value)}
                readOnly={readOnly}
                placeholder="Type your name here"
                className="w-full bg-black/70 border-b-2 border-amber-500/60 focus:border-amber-300/80 px-3 py-3 text-yellow-100 text-2xl font-serif italic outline-none transition"
                style={{ fontFamily: 'cursive, "Cinzel", serif' }}
              />
              <div className="text-stone-500 text-xs mt-2 font-mono">
                Signed on: {new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}
              </div>
            </div>
          </RegSection>

          {error && (
            <div className="mb-4 p-3 bg-red-900/40 border border-red-500/50 rounded text-red-200 text-sm">
              {error}
            </div>
          )}

          <div className="flex flex-col sm:flex-row sm:justify-end gap-3 pt-4 border-t border-amber-600/30">
            <button type="button" onClick={onClose} className="px-5 py-2.5 bg-black/60 border border-stone-600/50 text-stone-300 font-bold text-xs rounded tracking-widest uppercase hover:bg-stone-800/50 transition">
              {readOnly ? 'Close' : 'Cancel'}
            </button>
            {!readOnly && (
              <button type="submit" disabled={submitting} className="px-6 py-2.5 bg-gradient-to-r from-orange-600 to-red-700 disabled:opacity-60 text-yellow-100 font-bold text-xs rounded tracking-widest uppercase hover:shadow-lg hover:shadow-orange-500/40 transition border border-orange-400/50">
                {submitting ? 'Submitting…' : 'Submit Application'}
              </button>
            )}
          </div>
          <p className="text-stone-500 text-[10px] uppercase tracking-widest text-center mt-6">Built By Gamers. Built For Survivors. · MythicSpellbook.xyz</p>
        </div>
        )}
      </form>
    </div>
  );
};

// ===== ADMIN CARD MANAGER =====
// Admin CRUD for the public Card List. Writes to the Supabase `game_cards`
// table (public read, admin write via RLS). Art is added as a URL/path — save
// the image into public/assets/cards/ and reference "./assets/cards/Name.png",
// or paste an external image URL.
const CARD_MANAGER_RARITIES = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary', 'Mythic', 'Starter'];
// Module-scope field so focus survives keystroke re-renders (an inner component
// would get a new identity each render and remount the input).
const ACField = ({ label, value, onChange, type = 'text', ph, half }) => (
  <div className={half ? '' : 'sm:col-span-2'}>
    <label className="block text-stone-400 text-[11px] uppercase tracking-wider mb-1">{label}</label>
    <input type={type} value={value} onChange={onChange} placeholder={ph}
      className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2 text-stone-100 text-sm placeholder-stone-600 outline-none transition" />
  </div>
);
const AdminCardManager = ({ client }) => {
  const blank = {
    name: '', card_number: '', type: '', faction: '', element: '',
    rarity: 'Common', cost: '', hp: '', atk: '', def: '', mag: '', res: '', spd: '',
    effect: '', flavor: '', art_url: '', set: '', illustrator: '',
    release_date: '', status: 'released', full_card: false,
  };
  const [rows, setRows] = useState([]);
  const [form, setForm] = useState(blank);
  const [editId, setEditId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [loading, setLoading] = useState(false);

  // Combined list = every card the public Card List can show. DB rows override
  // built-in "seed" cards by name, so the admin can Edit a seed card (e.g. to
  // swap its art) and Save creates a DB override. Seed cards with no override
  // still appear so their art is editable.
  const combined = useMemo(() => {
    const seed = [...cards, ...COMMUNITY_CARDS].map(normalizeGameCard);
    const dbByName = {};
    rows.forEach(r => { dbByName[(r.name || '').toLowerCase()] = true; });
    const seedOnly = seed
      .filter(s => !dbByName[s.name.toLowerCase()])
      .map(s => ({ ...s, __seed: true }));
    const dbList = rows.map(r => ({ ...r, __seed: false }));
    return [...dbList, ...seedOnly];
  }, [rows]);

  // Where each card appears on the site (so the admin knows what an edit affects).
  const locationOf = (name) => {
    const n = (name || '').toLowerCase();
    const locs = [];
    if (cards[0] && (cards[0].name || '').toLowerCase() === n) locs.push('Hero (home)');
    if (cards[1] && (cards[1].name || '').toLowerCase() === n) locs.push('Spotlight');
    if (cards[2] && (cards[2].name || '').toLowerCase() === n) locs.push('Spotlight');
    if (typeof COMMUNITY_CARDS !== 'undefined' && COMMUNITY_CARDS.some(c => (c.name || '').toLowerCase() === n)) locs.push('Community');
    locs.push('Card List');
    return locs.join(' · ');
  };

  const load = () => {
    if (!client) return;
    setLoading(true);
    client.from('game_cards').select('*').order('created_at', { ascending: false }).then(({ data, error }) => {
      setLoading(false);
      if (error) { setMsg('Load failed: ' + error.message); setRows([]); }
      else { setRows(data || []); }
    });
  };
  useEffect(() => { load(); }, [client]);

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const numOrNull = (v) => (v === '' || v === null || v === undefined) ? null : Number(v);

  const startEdit = (r) => {
    const seed = !!r.__seed;
    // Seed cards have no DB id → editId stays null so Save INSERTS an override.
    setEditId(seed ? null : r.id);
    setForm({
      name: r.name || '',
      card_number: r.card_number || r.cardNumber || '',
      type: r.type || '', faction: r.faction || '', element: r.element || '',
      rarity: r.rarity || 'Common',
      cost: r.cost ?? '', hp: r.hp ?? '', atk: r.atk ?? '', def: r.def ?? '',
      mag: r.mag ?? '', res: r.res ?? '', spd: r.spd ?? '',
      effect: r.effect || '', flavor: r.flavor || '',
      art_url: r.art_url || r.image || '',
      set: r.set_name || r.set || '', illustrator: r.illustrator || r.artist || '',
      release_date: r.release_date || r.releaseDate || '', status: r.status || 'released',
      full_card: !!(r.full_card || r.fullCard),
    });
    setMsg(seed ? 'Editing a built-in card — Save creates an override with your changes (e.g. new art).' : '');
    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const resetForm = () => { setForm(blank); setEditId(null); setMsg(''); };

  const save = async () => {
    if (!form.name.trim()) { setMsg('Name is required.'); return; }
    if (!client) { setMsg('No database connection.'); return; }
    setBusy(true); setMsg('');
    const row = {
      name: form.name.trim(), card_number: form.card_number.trim() || null,
      type: form.type.trim() || null, faction: form.faction.trim() || null,
      element: form.element.trim() || null, rarity: form.rarity || 'Common',
      cost: numOrNull(form.cost), hp: numOrNull(form.hp), atk: numOrNull(form.atk),
      def: numOrNull(form.def), mag: numOrNull(form.mag), res: numOrNull(form.res), spd: numOrNull(form.spd),
      effect: form.effect.trim() || null, flavor: form.flavor.trim() || null,
      art_url: form.art_url.trim() || null, set_name: form.set.trim() || null,
      illustrator: form.illustrator.trim() || null,
      release_date: form.release_date || null, status: form.status || 'released',
      full_card: !!form.full_card,
    };
    // Resilient save: if the table is missing an optional column (e.g. the
    // `full_card` column hasn't been added yet), Supabase errors with
    // "Could not find the 'X' column". We strip that column and retry, so
    // saving still works before every migration is applied. Loops in case
    // more than one column is missing.
    const doSave = async (payload) => {
      if (editId) return await client.from('game_cards').update(payload).eq('id', editId);
      return await client.from('game_cards').insert(payload);
    };
    let payload = { ...row };
    let dropped = [];
    let error = null;
    for (let attempt = 0; attempt < 8; attempt++) {
      const res = await doSave(payload);
      error = res.error;
      if (!error) break;
      const m = error.message || '';
      const col = (m.match(/Could not find the '([^']+)' column/i) || [])[1];
      if (col && (col in payload)) { delete payload[col]; dropped.push(col); continue; }
      break; // not a missing-column error — stop retrying
    }
    setBusy(false);
    if (error) {
      let m = error.message || 'Unknown error.';
      if (/relation .* does not exist|could not find the table/i.test(m)) m = 'The game_cards table does not exist yet — run the SQL migration in Supabase. (' + m + ')';
      setMsg('Save failed: ' + m); return;
    }
    // Saved — note if we had to skip a column so the admin knows to add it.
    if (dropped.length) {
      setMsg(`${editId ? 'Card updated' : 'Card added'} — but "${dropped.join('", "')}" ${dropped.length > 1 ? 'columns were' : 'column was'} skipped (not in the database yet). Run the ALTER TABLE below in Supabase to enable ${dropped.includes('full_card') ? 'the "complete card" toggle' : 'it'}.`);
    } else {
      setMsg(editId ? 'Card updated.' : 'Card added.');
    }
    resetForm(); load();
  };

  const del = async (r) => {
    if (!client) return;
    if (!window.confirm(`Delete "${r.name}"? This cannot be undone.`)) return;
    const { error } = await client.from('game_cards').delete().eq('id', r.id);
    if (error) { setMsg('Delete failed: ' + error.message); return; }
    if (editId === r.id) resetForm();
    load();
  };

  return (
    <div>
      {/* ===== Add / edit form ===== */}
      <div className="bg-black/40 border border-amber-600/30 rounded-lg p-5 mb-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-yellow-100 font-serif font-bold text-lg">{editId ? 'Edit Card' : 'Add New Card'}</h3>
          {editId && <button onClick={resetForm} className="text-stone-400 hover:text-stone-200 text-xs uppercase tracking-widest">+ New instead</button>}
        </div>

        <div className="grid sm:grid-cols-2 gap-3">
          <ACField label="Name *" value={form.name} onChange={(e) => set('name', e.target.value)} ph="Card name" />
          <div className="grid grid-cols-2 gap-3 sm:col-span-2">
            <ACField label="Card Number" value={form.card_number} onChange={(e) => set('card_number', e.target.value)} ph="MS-042" half />
            <div>
              <label className="block text-stone-400 text-[11px] uppercase tracking-wider mb-1">Status</label>
              <select value={form.status} onChange={(e) => set('status', e.target.value)} className="w-full bg-black/60 border border-stone-600/60 rounded px-3 py-2 text-stone-100 text-sm outline-none">
                <option value="released">Released (in Card List)</option>
                <option value="coming">Coming Drop (upcoming)</option>
              </select>
            </div>
          </div>
          <ACField label="Type" value={form.type} onChange={(e) => set('type', e.target.value)} ph="Bug Unit, Mythic Hero · Cosmic…" />
          <div className="grid grid-cols-2 gap-3 sm:col-span-2">
            <ACField label="Faction" value={form.faction} onChange={(e) => set('faction', e.target.value)} ph="Mage" half />
            <ACField label="Element" value={form.element} onChange={(e) => set('element', e.target.value)} ph="Shadow + Nature" half />
          </div>
          <div className="grid grid-cols-2 gap-3 sm:col-span-2">
            <div>
              <label className="block text-stone-400 text-[11px] uppercase tracking-wider mb-1">Rarity</label>
              <select value={form.rarity} onChange={(e) => set('rarity', e.target.value)} className="w-full bg-black/60 border border-stone-600/60 rounded px-3 py-2 text-stone-100 text-sm outline-none">
                {CARD_MANAGER_RARITIES.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <ACField label="Release Date" value={form.release_date} onChange={(e) => set('release_date', e.target.value)} type="date" half />
          </div>

          {/* Stats */}
          <div className="sm:col-span-2">
            <label className="block text-stone-400 text-[11px] uppercase tracking-wider mb-1">Stats (blank = hide)</label>
            <div className="grid grid-cols-7 gap-1.5">
              {['cost', 'hp', 'atk', 'def', 'mag', 'res', 'spd'].map(s => (
                <div key={s}>
                  <input type="number" value={form[s]} onChange={(e) => set(s, e.target.value)} placeholder={s.toUpperCase()}
                    className="w-full bg-black/60 border border-stone-600/60 rounded px-1.5 py-2 text-stone-100 text-xs text-center outline-none" />
                  <div className="text-stone-600 text-[8px] text-center uppercase mt-0.5">{s}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="sm:col-span-2">
            <label className="block text-stone-400 text-[11px] uppercase tracking-wider mb-1">Effect / Ability</label>
            <textarea rows="2" value={form.effect} onChange={(e) => set('effect', e.target.value)} placeholder="Card ability text"
              className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2 text-stone-100 text-sm outline-none resize-y" />
          </div>
          <ACField label="Flavor Text" value={form.flavor} onChange={(e) => set('flavor', e.target.value)} ph="One-line flavor quote" />
          <div className="sm:col-span-2">
            <label className="block text-stone-400 text-[11px] uppercase tracking-wider mb-1">Art URL / Path</label>
            <input type="text" value={form.art_url} onChange={(e) => set('art_url', e.target.value)} placeholder="./assets/cards/Name.png  or  https://…"
              className="w-full bg-black/60 border border-stone-600/60 focus:border-amber-500/70 rounded px-3 py-2 text-stone-100 text-sm placeholder-stone-600 outline-none transition" />
            {form.art_url && (
              <div className="mt-2 flex items-center gap-3">
                <img src={form.art_url} alt="preview" className={`${form.full_card ? 'w-16 h-24 object-contain' : 'w-16 h-20 object-cover'} rounded border border-stone-700`} onError={(e) => { e.currentTarget.style.opacity = '0.2'; }} />
                <span className="text-stone-500 text-xs">Live preview · paste any image URL, or save into <span className="font-mono">public/assets/cards/</span> + deploy for a local path.</span>
              </div>
            )}
            {/* Complete-card toggle — show the image as-is (no site frame). */}
            <label className={`mt-3 flex items-start gap-2.5 p-3 rounded border cursor-pointer transition ${form.full_card ? 'bg-amber-900/25 border-amber-500/60' : 'bg-black/40 border-stone-700/60'}`}>
              <span className={`mt-0.5 w-4 h-4 rounded-sm border-2 flex-shrink-0 flex items-center justify-center ${form.full_card ? 'bg-amber-500 border-amber-400' : 'border-stone-500'}`}>
                {form.full_card && <span className="text-stone-900 text-[10px] font-black leading-none">✓</span>}
              </span>
              <input type="checkbox" checked={form.full_card} onChange={() => set('full_card', !form.full_card)} className="sr-only" />
              <span className="text-sm">
                <span className="text-yellow-100 font-bold">Image is a complete card</span>
                <span className="text-stone-400 block text-xs mt-0.5">Turn ON when your image already has its own card frame + name (like your finished cards). The site shows it as-is instead of drawing another frame around it. Leave OFF for plain artwork.</span>
              </span>
            </label>
          </div>
          <div className="grid grid-cols-2 gap-3 sm:col-span-2">
            <ACField label="Set" value={form.set} onChange={(e) => set('set', e.target.value)} ph="Ashen Season" half />
            <ACField label="Illustrator" value={form.illustrator} onChange={(e) => set('illustrator', e.target.value)} ph="Artist name" half />
          </div>
        </div>

        {msg && (
          <div className={`mt-3 p-2.5 rounded text-sm border ${/failed|does not exist|required/i.test(msg) ? 'bg-red-900/30 border-red-500/40 text-red-300' : 'bg-emerald-900/30 border-emerald-500/40 text-emerald-300'}`}>
            {msg}
          </div>
        )}

        <div className="flex justify-end gap-2 mt-4">
          {editId && <button onClick={() => del({ id: editId, name: form.name })} className="px-4 py-2 bg-red-900/40 border border-red-500/40 text-red-200 text-xs font-bold uppercase tracking-widest rounded hover:bg-red-800/50 transition">Delete</button>}
          <button onClick={save} disabled={busy} className="px-6 py-2 bg-gradient-to-r from-orange-600 to-red-700 disabled:opacity-60 text-yellow-100 text-xs font-bold uppercase tracking-widest rounded border border-orange-400/50 hover:shadow-lg hover:shadow-orange-500/40 transition">
            {busy ? 'Saving…' : (editId ? 'Update Card' : 'Add Card')}
          </button>
        </div>
      </div>

      {/* ===== All cards (seed + database) ===== */}
      <div className="flex items-center justify-between mb-2">
        <div className="text-stone-400 text-xs uppercase tracking-widest">All Cards ({combined.length}) · {rows.length} in database</div>
        <button onClick={load} className="text-stone-500 hover:text-stone-300 text-xs uppercase tracking-widest">↻ Refresh</button>
      </div>
      <div className="mb-3 p-3 rounded border border-sky-500/30 bg-sky-900/15 text-xs text-stone-300 leading-relaxed">
        <span className="text-sky-300 font-bold uppercase tracking-widest text-[10px]">How this works</span><br/>
        Click <span className="text-amber-300 font-bold">Edit</span> on ANY card — including a <span className="text-sky-300">Built-in</span> one — paste an image URL in <span className="text-amber-200">Art URL / Path</span>, and Save. Your change applies <span className="text-yellow-100 font-bold">everywhere that card shows on the site</span> (see the <span className="text-stone-200">Shows On</span> column). The <span className="text-stone-200">Card List</span> updates instantly; the home page (hero / spotlights) updates on next page load.
      </div>
      {loading ? <div className="text-stone-500 text-sm py-6 text-center">Loading…</div> : (
        <div className="overflow-x-auto">
          <table className="min-w-full text-sm">
            <thead>
              <tr className="text-left text-stone-500 text-[10px] uppercase tracking-widest border-b border-stone-700/50">
                <th className="py-2 pr-3">Art</th><th className="py-2 pr-3">Name</th><th className="py-2 pr-3">Source</th><th className="py-2 pr-3">Shows On</th><th className="py-2 pr-3">Type</th>
                <th className="py-2 pr-3">Rarity</th><th className="py-2 pr-3">Status</th><th className="py-2 pr-3">Release</th><th className="py-2"></th>
              </tr>
            </thead>
            <tbody>
              {combined.map(r => {
                const art = r.art_url || r.image;
                const rel = r.release_date || r.releaseDate;
                return (
                <tr key={r.id} className="border-b border-stone-800/50 hover:bg-stone-900/40">

                  </td>
                </tr>
              );})}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
};

// 📡 PLAYER PROFILE — the social hub half of Emergency Broadcast.
// Steam + YouTube + Discord for Mythic Spellbook: everything on the left is
// pulled LIVE from the game (decks, heroes, records, nodes, businesses,
// matches) via the eb_profile RPC; everything social (posts, clips, follows,
// top 8, banner, showcase, placements) lives in the eb_* tables.
// Sections with no data yet render an honest empty state — never filler.
// ═══════════════════════════════════════════════════════════════════════
// A pasted YouTube link has a free thumbnail — use it so shared clips look
// like clips instead of a generic placeholder. Other hosts fall back to the
// stored thumb_url (or the icon) since they have no public thumb endpoint.
const ebClipThumb = (c) => {
  if (c && c.thumb_url) return c.thumb_url;
  const u = String((c && (c.url || c.clip_url)) || '');
  const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/);
  return m ? 'https://img.youtube.com/vi/' + m[1] + '/hqdefault.jpg' : null;
};
const EB_INK = { bg: '#14161B', card: '#191C23', line: '#262B34', dim: '#9BA1AB', ember: '#FF6A2B', gold: '#e8d5a8' };
const ebCard = { background: EB_INK.card, border: '1px solid ' + EB_INK.line, borderRadius: 14 };

// Pulls the published card catalog + art/sprite maps once, and resolves any
// in-game id to an image. Same sources the Player Hub uses.
const useGameArt = (client) => {
  const [artMap, setArtMap] = useState(null);
  const [spriteMap, setSpriteMap] = useState(null);
  // id → {name, icon}. Covers BOTH Forge cards (published `cards`) and the
  // game's built-in cards (published under moves.__builtin_cards__), so a
  // starter deck reads "Goblin Scout 👺" instead of a raw id.
  const [meta, setMeta] = useState(null);
  useEffect(() => {
    if (!client) return;
    let dead = false;
    // eb_card_meta() — a public, display-only id→{name,icon} map. We must NOT
    // read card_catalog directly here: it's RLS-gated to signed-in players, so
    // a logged-out visitor to a public profile got zero rows and every card
    // fell back to its raw id.
    client.rpc('eb_card_meta')
      .then(({ data }) => { if (!dead && data && typeof data === 'object') setMeta(data); })
      .catch(() => {});
    const pull = async (filename, setter) => {
      try {
        const base = filename.replace(/\.json$/, '');
        const idx = await client.storage.from('public-catalog').download(base + '.index.json');
        if (!idx.error && idx.data) {
          const idxObj = JSON.parse(await idx.data.text());
          const shards = Array.isArray(idxObj.shards) ? idxObj.shards : [];
          const merged = {};
          for (const s of shards) {
            try {
              const { data, error } = await client.storage.from('public-catalog').download(s);
              if (error || !data) continue;
              Object.assign(merged, JSON.parse(await data.text()) || {});
            } catch (e) {}
          }
          if (!dead && Object.keys(merged).length) { setter(merged); return; }
        }
        const { data, error } = await client.storage.from('public-catalog').download(filename);
        if (error || !data) return;
        const txt = await data.text();
        if (!dead && txt) setter(JSON.parse(txt));
      } catch (e) {}
    };
    pull('cardArt.json', setArtMap);
    pull('sprites.json', setSpriteMap);
    return () => { dead = true; };
  }, [client]);

  const resolve = (rawId) => {
    if (!rawId) return null;
    // Deck entries look like "unit:goblin" — try the full id and the bare tail.
    const ids = [String(rawId), String(rawId).split(':').pop()];
    const firstFrame = (s) => {
      if (!s) return null;
      if (typeof s === 'string') return s;
      if (Array.isArray(s)) return s[0] || null;
      if (Array.isArray(s.idle) && s.idle.length) return s.idle[0];
      for (const k of Object.keys(s)) if (Array.isArray(s[k]) && typeof s[k][0] === 'string') return s[k][0];
      return null;
    };
    for (const id of ids) { if (artMap && artMap[id]) return artMap[id]; }
    if (spriteMap) {
      for (const id of ids) {
        for (const k of ['h_' + id, 'u_' + id, id]) {
          const f = firstFrame(spriteMap[k]);
          if (f) return f;
        }
      }
    }
    return null;
  };
  resolve.meta = (rawId) => {
    if (!meta || !rawId) return null;
    return meta[String(rawId)] || meta[String(rawId).split(':').pop()] || null;
  };
  return resolve;
};

// Editor for your own profile — banner, handle, showcase, favourite heroes and
// the Top 8. Writes straight to eb_profiles / eb_top_friends (owner-only RLS).
const EbProfileEditor = ({ client, session, p, onClose, onSaved }) => {
  const [f, setF] = useState({
    handle: p.handle || '', tagline: p.tagline || '', bio: p.bio || '',
    banner_url: p.banner_url || '', avatar_url: p.avatar_url || '',
  });
  const [favs, setFavs] = useState(Array.isArray(p.favorite_hero_ids) ? p.favorite_hero_ids : []);
  const [top, setTop] = useState((p.top_friends || []).map(t => t.user_id));
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const heroIds = Object.keys(p.heroes || {});
  const friends = p.friends || [];
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const inp = { width: '100%', background: '#0F1116', border: '1px solid ' + EB_INK.line, borderRadius: 8, color: '#EDEFF3', padding: '9px 11px', fontSize: 13, fontFamily: 'inherit' };
  const lbl = { fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: EB_INK.dim, margin: '12px 0 5px' };

  const save = async () => {
    setBusy(true); setMsg('');
    const handle = f.handle.trim().replace(/^@/, '');
    if (handle && !/^[A-Za-z0-9_-]{3,20}$/.test(handle)) {
      setMsg('Handle must be 3–20 letters, numbers, _ or -.'); setBusy(false); return;
    }
    try {
      const { error } = await client.from('eb_profiles').upsert({
        user_id: session.user.id,
        handle: handle || null,
        tagline: f.tagline.slice(0, 120), bio: f.bio.slice(0, 600),
        banner_url: f.banner_url.trim() || null, avatar_url: f.avatar_url.trim() || null,
        favorite_hero_ids: favs,
        updated_at: new Date().toISOString(),
      }, { onConflict: 'user_id' });
      if (error) { setMsg(/duplicate|unique/i.test(error.message) ? 'That handle is taken.' : 'Could not save — ' + error.message.slice(0, 80)); setBusy(false); return; }
      // Top 8 — rewrite the whole board so slots stay 1..8 in pick order.
      await client.from('eb_top_friends').delete().eq('user_id', session.user.id);
      if (top.length) {
        await client.from('eb_top_friends').insert(top.slice(0, 8).map((fid, i) => ({ user_id: session.user.id, friend_id: fid, slot: i + 1 })));
      }
      onSaved(); onClose();
    } catch (e) { setMsg('Could not save — try again.'); }
    setBusy(false);
  };
  const toggle = (arr, setArr, id, max) => {
    if (arr.includes(id)) setArr(arr.filter(x => x !== id));
    else if (!max || arr.length < max) setArr(arr.concat(id));
  };
  const chip = (on) => ({
    border: '1px solid ' + (on ? EB_INK.ember : EB_INK.line), background: on ? 'rgba(255,106,43,.14)' : 'transparent',
    color: on ? EB_INK.ember : EB_INK.dim, borderRadius: 999, padding: '5px 12px', fontSize: 12, cursor: 'pointer',
  });

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 9999, background: 'rgba(4,6,10,.86)', backdropFilter: 'blur(8px)', overflowY: 'auto', padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ ...ebCard, maxWidth: 620, margin: '40px auto', padding: 24 }}>
        <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 4 }}>Edit your Broadcast profile</div>
        <div style={{ color: EB_INK.dim, fontSize: 12 }}>Your handle becomes your shareable link: mythicspellbook.xyz/?u=yourhandle</div>

        <div style={lbl}>Handle</div>
        <input value={f.handle} onChange={set('handle')} placeholder="sethiroth" style={inp} />
        <div style={lbl}>Tagline</div>
        <input value={f.tagline} onChange={set('tagline')} placeholder="Node operator · Dragonkin main" style={inp} />
        <div style={lbl}>Bio</div>
        <textarea value={f.bio} onChange={set('bio')} rows={3} style={{ ...inp, resize: 'vertical' }} />
        <div style={lbl}>Banner image URL</div>
        <input value={f.banner_url} onChange={set('banner_url')} placeholder="https://…" style={inp} />
        <div style={lbl}>Avatar image URL</div>
        <input value={f.avatar_url} onChange={set('avatar_url')} placeholder="https://…" style={inp} />

        <div style={lbl}>Favourite heroes {favs.length ? '(' + favs.length + ')' : ''}</div>
        {heroIds.length === 0 ? <div style={{ color: EB_INK.dim, fontSize: 12 }}>No heroes recruited yet.</div> : (
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {heroIds.map(h => (
              <button key={h} onClick={() => toggle(favs, setFavs, h, 8)} style={{ ...chip(favs.includes(h)), textTransform: 'capitalize' }}>{h}</button>
            ))}
          </div>
        )}

        <div style={lbl}>Top 8 friends {top.length ? '(' + top.length + '/8)' : ''}</div>
        {friends.length === 0 ? <div style={{ color: EB_INK.dim, fontSize: 12 }}>Add friends in-game and they'll show up here.</div> : (
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {friends.map(fr => (
              <button key={fr.user_id} onClick={() => toggle(top, setTop, fr.user_id, 8)} style={chip(top.includes(fr.user_id))}>{fr.name}</button>
            ))}
          </div>
        )}

        {msg ? <div style={{ color: '#F0655A', fontSize: 12, marginTop: 12 }}>{msg}</div> : null}
        <div style={{ display: 'flex', gap: 10, marginTop: 20 }}>
          <button onClick={save} disabled={busy} style={{ flex: 1, background: EB_INK.ember, color: '#14060A', border: 'none', borderRadius: 9, padding: '11px 0', fontWeight: 700, cursor: 'pointer', opacity: busy ? .6 : 1 }}>{busy ? 'Saving…' : 'Save profile'}</button>
          <button onClick={onClose} style={{ flex: 1, background: 'transparent', color: EB_INK.dim, border: '1px solid ' + EB_INK.line, borderRadius: 9, padding: '11px 0', fontWeight: 700, cursor: 'pointer' }}>Cancel</button>
        </div>
      </div>
    </div>
  );
};

const PlayerProfilePage = ({ client, session, profileKey, onBack, onOpenProfile, embedded }) => {
  const [p, setP] = useState(null);
  const [err, setErr] = useState('');
  const [tab, setTab] = useState('feed');
  const [busy, setBusy] = useState(false);
  const [draft, setDraft] = useState('');
  const [editing, setEditing] = useState(false);
  const resolveArt = useGameArt(client);

  const load = async () => {
    if (!client || !profileKey) return;
    const { data, error } = await client.rpc('eb_profile', { p_key: String(profileKey) });
    if (error || !data || !data.ok) { setErr('Profile not found.'); setP(null); return; }
    setErr(''); setP(data);
  };
  useEffect(() => { load(); }, [client, profileKey]);

  if (err) return (
    <div style={{ minHeight: '70vh', background: EB_INK.bg, padding: '90px 20px', textAlign: 'center', color: EB_INK.dim }}>
      <div style={{ fontSize: 18, marginBottom: 12 }}>{err}</div>
      <button onClick={onBack} style={{ background: 'none', border: '1px solid ' + EB_INK.line, color: EB_INK.gold, borderRadius: 8, padding: '8px 16px', cursor: 'pointer' }}>← Back</button>
    </div>
  );
  if (!p) return <div style={{ minHeight: '70vh', background: EB_INK.bg, padding: 90, textAlign: 'center', color: EB_INK.dim }}>Loading profile…</div>;

  const rec = p.records || {};
  const wins = rec.wins | 0, losses = rec.losses | 0, battles = rec.battles | 0;
  const winRate = battles > 0 ? Math.round((wins / battles) * 100) : 0;
  const comp = p.competitive || {};
  const decks = p.decks && typeof p.decks === 'object' ? p.decks : {};
  // Every hero is auto-given a "<Hero>'s Starter Deck". Those aren't decks the
  // player built, so they don't belong on a public profile - only real,
  // player-made decks are shown (and counted in the Decks stat).
  const deckKeys = Object.keys(decks).filter(k => !/starter\s*deck/i.test(String((decks[k] || {}).name || '')));
  const heroes = p.heroes && typeof p.heroes === 'object' ? p.heroes : {};
  const favIds = Array.isArray(p.favorite_hero_ids) && p.favorite_hero_ids.length
    ? p.favorite_hero_ids : Object.keys(heroes).slice(0, 6);

  const doFollow = async () => {
    if (!session) return;
    setBusy(true);
    try {
      if (p.i_follow) await client.from('eb_follows').delete().eq('follower_id', session.user.id).eq('followee_id', p.user_id);
      else await client.from('eb_follows').insert({ follower_id: session.user.id, followee_id: p.user_id });
      await load();
    } catch (e) {}
    setBusy(false);
  };
  const doPost = async () => {
    const body = draft.trim();
    if (!body || !session) return;
    setBusy(true);
    try {
      await client.from('eb_posts').insert({ user_id: session.user.id, body: body.slice(0, 1000), kind: 'strategy' });
      setDraft(''); await load();

      <div style={{ fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: EB_INK.dim, marginTop: 2 }}>{label}</div>
    </div>
  );
  const TabBtn = ({ id, label }) => (
    <button onClick={() => setTab(id)} style={{
      background: tab === id ? 'rgba(255,106,43,.14)' : 'transparent',
      border: '1px solid ' + (tab === id ? 'rgba(255,106,43,.5)' : EB_INK.line),
      color: tab === id ? EB_INK.ember : EB_INK.dim,
      borderRadius: 999, padding: '7px 15px', fontSize: 12, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap',
    }}>{label}</button>
  );

  return (

        height: embedded ? 168 : 210, position: 'relative', overflow: 'hidden',

          : 'linear-gradient(120deg,#2A1608,#14161B 60%,#1A1030)',
        borderBottom: '1px solid ' + EB_INK.line,
        borderRadius: embedded ? 14 : 0,
      }}>
        {!embedded && <button onClick={onBack} style={{ position: 'absolute', top: 84, left: 20, background: 'rgba(0,0,0,.6)', border: '1px solid ' + EB_INK.line, color: EB_INK.gold, borderRadius: 8, padding: '7px 14px', fontSize: 12, cursor: 'pointer' }}>← Broadcast</button>}
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,transparent 40%,rgba(20,22,27,.95))' }} />
      </div>

      <div style={{ maxWidth: 1120, margin: '0 auto', padding: embedded ? '0 0 20px' : '0 20px 60px' }}>

                            </>

                    {uniq.length > 24 ? <div style={{ alignSelf: 'center', color: EB_INK.dim, fontSize: 12 }}>+{uniq.length - 24} more</div> : null}
                  </div>
                </div>
              );
            })}
          </EbSection>
        )}

        {/* ── HEROES — sprites pulled from the game ── */}
        {tab === 'heroes' && (

                        {img ? <img src={img} alt="" style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', imageRendering: 'pixelated' }} /> : <span style={{ fontSize: 30 }}>🦸</span>}
                      </div>
                      <div style={{ fontWeight: 700, fontSize: 13, textTransform: 'capitalize' }}>{hid}</div>
                      <div style={{ color: EB_INK.dim, fontSize: 11, marginTop: 2 }}>
                        Lv {h.level || 1}{h.wins ? ' · ' + h.wins + 'W' : ''}{h.bond ? ' · ♥' + h.bond : ''}
                      </div>

        {/* ── CLIPS ── */}

// 📚 TRAINING & DOCUMENTATION — admin-curated PDFs, videos and links.
// Public to read (it's onboarding material); writes are admin-only and that
// is enforced by RLS on eb_docs, not by hiding the buttons.
const EbTrainingPage = ({ client, session, isAdmin }) => {
  const [docs, setDocs] = useState(null);
  const [form, setForm] = useState(null);   // null = closed, else the row being edited
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');

  const load = async () => {
    if (!client) return;
    const { data } = await client.from('eb_docs').select('*')
      .order('category').order('sort_order').order('created_at');
    setDocs(Array.isArray(data) ? data : []);
  };
  useEffect(() => { load(); }, [client, session]);

  const blank = { title: '', summary: '', kind: 'pdf', url: '', category: 'General', sort_order: 0, published: true };
  const save = async () => {
    const f = form || {};
    if (!f.title || !f.title.trim()) { setMsg('Give it a title.'); return; }
    if (!f.url || !/^https?:\/\/.+/i.test(f.url.trim())) { setMsg('Needs a full URL starting with http.'); return; }
    setBusy(true); setMsg('');
    const row = {
      title: f.title.trim().slice(0, 140), summary: (f.summary || '').slice(0, 400),
      kind: f.kind || 'pdf', url: f.url.trim(), category: (f.category || 'General').trim().slice(0, 40),
      sort_order: parseInt(f.sort_order, 10) || 0, published: f.published !== false,
      updated_at: new Date().toISOString(),
    };
    try {
      const r = f.id
        ? await client.from('eb_docs').update(row).eq('id', f.id)
        : await client.from('eb_docs').insert({ ...row, created_by: session ? session.user.id : null });
      if (r && r.error) { setMsg('Could not save — ' + r.error.message.slice(0, 90)); setBusy(false); return; }
      setForm(null); await load();
    } catch (e) { setMsg('Could not save — try again.'); }
    setBusy(false);
  };
  const del = async (d) => {
    if (!window.confirm('Delete "' + d.title + '"?')) return;
    try { await client.from('eb_docs').delete().eq('id', d.id); await load(); } catch (e) {}
  };

  // YouTube links get a real thumbnail so the shelf reads like a video library.
  const ytId = (u) => {
    const m = String(u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  };
  const icon = (d) => d.kind === 'video' ? '🎬' : d.kind === 'link' ? '🔗' : '📄';

  const inp = { width: '100%', background: '#0F1116', border: '1px solid ' + EB_INK.line, borderRadius: 8, color: '#EDEFF3', padding: '9px 11px', fontSize: 13, fontFamily: 'inherit' };
  const lbl = { fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: EB_INK.dim, margin: '10px 0 4px' };

  const cats = {};
  (docs || []).forEach(d => { (cats[d.category || 'General'] = cats[d.category || 'General'] || []).push(d); });
  const catNames = Object.keys(cats);

  return (
    <div style={{ color: '#EDEFF3' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 12, flexWrap: 'wrap' }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800 }}>📚 Training &amp; Documentation</div>
          <div style={{ color: EB_INK.dim, fontSize: 13, marginTop: 3 }}>Guides, walkthroughs and reference material for the ecosystem.</div>
        </div>
        {isAdmin && (
          <button onClick={() => { setForm(blank); setMsg(''); }} style={{ background: EB_INK.ember, color: '#14060A', border: 'none', borderRadius: 9, padding: '10px 18px', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>+ Add material</button>
        )}
      </div>

      {isAdmin && form && (
        <div style={{ ...ebCard, padding: 18, marginTop: 16 }}>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>{form.id ? 'Edit material' : 'New material'}</div>
          <div style={lbl}>Title</div>
          <input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} style={inp} />
          <div style={lbl}>Summary</div>
          <textarea rows={2} value={form.summary} onChange={(e) => setForm({ ...form, summary: e.target.value })} style={{ ...inp, resize: 'vertical' }} />
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <div style={{ flex: '1 1 140px' }}>
              <div style={lbl}>Type</div>
              <select value={form.kind} onChange={(e) => setForm({ ...form, kind: e.target.value })} style={inp}>
                <option value="pdf">📄 PDF</option>
                <option value="video">🎬 Video (YouTube)</option>
                <option value="link">🔗 Link</option>
              </select>
            </div>
            <div style={{ flex: '1 1 140px' }}>
              <div style={lbl}>Category</div>
              <input value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} placeholder="Getting Started" style={inp} />
            </div>
            <div style={{ flex: '0 0 110px' }}>
              <div style={lbl}>Order</div>
              <input type="number" value={form.sort_order} onChange={(e) => setForm({ ...form, sort_order: e.target.value })} style={inp} />
            </div>
          </div>
          <div style={lbl}>{form.kind === 'video' ? 'YouTube URL' : form.kind === 'pdf' ? 'PDF URL' : 'URL'}</div>
          <input value={form.url} onChange={(e) => setForm({ ...form, url: e.target.value })} placeholder="https://…" style={inp} />
          <label style={{ display: 'flex', alignItems: 'center', gap: 7, marginTop: 12, fontSize: 13, color: EB_INK.dim }}>
            <input type="checkbox" checked={form.published !== false} onChange={(e) => setForm({ ...form, published: e.target.checked })} />
            Published (visible to players)
          </label>
          {msg ? <div style={{ color: '#F0655A', fontSize: 12, marginTop: 8 }}>{msg}</div> : null}
          <div style={{ display: 'flex', gap: 9, marginTop: 14 }}>
            <button onClick={save} disabled={busy} style={{ flex: 1, background: EB_INK.ember, color: '#14060A', border: 'none', borderRadius: 9, padding: '10px 0', fontWeight: 700, cursor: 'pointer', opacity: busy ? .6 : 1 }}>{busy ? 'Saving…' : 'Save'}</button>
            <button onClick={() => setForm(null)} style={{ flex: 1, background: 'transparent', color: EB_INK.dim, border: '1px solid ' + EB_INK.line, borderRadius: 9, padding: '10px 0', fontWeight: 700, cursor: 'pointer' }}>Cancel</button>
          </div>
        </div>
      )}

      {docs === null ? <div style={{ color: EB_INK.dim, marginTop: 20 }}>Loading…</div>
        : catNames.length === 0 ? <EbEmpty>{isAdmin ? 'Nothing here yet — add your first guide above.' : 'Training material is on the way.'}</EbEmpty>
        : catNames.map(cn => (
          <div key={cn} style={{ marginTop: 22 }}>
            <div style={{ fontSize: 11, letterSpacing: '.22em', textTransform: 'uppercase', color: EB_INK.gold, fontWeight: 800, marginBottom: 10 }}>{cn}</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(250px,1fr))', gap: 12 }}>
              {cats[cn].map(d => {
                const yt = d.kind === 'video' ? ytId(d.url) : null;
                return (
                  <div key={d.id} style={{ ...ebCard, overflow: 'hidden', display: 'flex', flexDirection: 'column',
                    opacity: d.published === false ? .55 : 1 }}>
                    <a href={d.url} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none', color: 'inherit' }}>
                      <div style={{ height: 116, background: yt ? `center/cover no-repeat url("https://img.youtube.com/vi/${yt}/hqdefault.jpg")` : '#0F1116',
                        display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 30 }}>{yt ? '▶' : icon(d)}</div>
                      <div style={{ padding: '12px 14px' }}>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{d.title}</div>
                        {d.summary ? <div style={{ color: EB_INK.dim, fontSize: 12, marginTop: 4, lineHeight: 1.5 }}>{d.summary}</div> : null}
                        {d.published === false ? <div style={{ color: '#F0655A', fontSize: 11, marginTop: 6, fontWeight: 700 }}>DRAFT — hidden from players</div> : null}
                      </div>
                    </a>
                    {isAdmin && (
                      <div style={{ display: 'flex', gap: 8, padding: '0 14px 12px' }}>
                        <button onClick={() => { setForm(d); setMsg(''); }} style={{ background: 'none', border: '1px solid ' + EB_INK.line, color: EB_INK.gold, borderRadius: 7, padding: '5px 11px', fontSize: 11, cursor: 'pointer' }}>Edit</button>
                        <button onClick={() => del(d)} style={{ background: 'none', border: '1px solid ' + EB_INK.line, color: '#F0655A', borderRadius: 7, padding: '5px 11px', fontSize: 11, cursor: 'pointer' }}>Delete</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
    </div>
  );
};

// 🔔 ALERTS — what happened while you were away. Rows are written by DB
// triggers (follow / like / reply / gift), so nothing can be forged or missed.
const EbAlertsPage = ({ client, session, onOpenProfile, onSignIn }) => {
  const [data, setData] = useState(null);
  const load = async () => {
    if (!client || !session) { setData({ unread: 0, items: [] }); return; }
    const { data: d } = await client.rpc('eb_notifications_get', { p_limit: 40 });
    setData(d && typeof d === 'object' ? d : { unread: 0, items: [] });
    // Opening the panel IS reading them.
    try { await client.rpc('eb_notifications_read_all'); } catch (e) {}
  };
  useEffect(() => { load(); }, [client, session]);
  const icon = (k) => k === 'follow' ? '➕' : k === 'like' ? '♥' : k === 'reply' ? '💬' : '🎁';
  const when = (iso) => {
    const s2 = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s2 < 60) return 'just now';
    if (s2 < 3600) return Math.floor(s2 / 60) + 'm ago';
    if (s2 < 86400) return Math.floor(s2 / 3600) + 'h ago';
    return Math.floor(s2 / 86400) + 'd ago';
  };
  if (!session) return (
    <div style={{ ...ebCard, padding: 26, textAlign: 'center', color: EB_INK.dim }}>
      <div style={{ fontSize: 18, fontWeight: 700, color: '#EDEFF3' }}>Alerts</div>
      <div style={{ fontSize: 13, marginTop: 8 }}>Sign in to see who followed you, liked your posts and what rewards arrived.</div>
      <button onClick={onSignIn} style={{ marginTop: 16, background: EB_INK.ember, color: '#14060A', border: 'none', borderRadius: 10, padding: '11px 22px', fontWeight: 700, cursor: 'pointer' }}>Connect account</button>
    </div>
  );
  const items = (data && data.items) || [];
  return (
    <div style={{ color: '#EDEFF3' }}>
      <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 4 }}>🔔 Alerts</div>
      <div style={{ color: EB_INK.dim, fontSize: 13, marginBottom: 16 }}>Follows, likes, replies and rewards.</div>
      {data === null ? <div style={{ color: EB_INK.dim }}>Loading…</div>
        : items.length === 0 ? <EbEmpty>Nothing yet — post something and see who bites.</EbEmpty>
        : items.map(n => (
          <div key={n.id} style={{ ...ebCard, padding: '12px 14px', marginBottom: 8, display: 'flex', gap: 11, alignItems: 'center',
            borderColor: n.read ? EB_INK.line : 'rgba(255,106,43,.45)' }}>
            <span style={{ fontSize: 18 }}>{icon(n.kind)}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, lineHeight: 1.45 }}>{n.body}</div>
              <div style={{ color: EB_INK.dim, fontSize: 11, marginTop: 2 }}>{when(n.at)}</div>
            </div>
            {n.actor_id ? (
              <button onClick={() => onOpenProfile(n.handle || n.actor_id)} style={{ background: 'none', border: '1px solid ' + EB_INK.line, color: EB_INK.gold, borderRadius: 8, padding: '5px 11px', fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap' }}>View</button>
            ) : null}
          </div>
        ))}
    </div>
  );
};

// 📡 THE FEED — Emergency Broadcast's front page. Everyone's strategy posts
// and clips in one stream. Public: signed-out visitors can read it, which is
// the point (it's the shop window for the game).
const EbFeedPage = ({ client, session, onBack, onOpenProfile, onSignIn, embedded }) => {
  const [items, setItems] = useState(null);
  const [draft, setDraft] = useState('');
  const [busy, setBusy] = useState(false);
  const [more, setMore] = useState(true);
  // Threads are lazy: a post's replies are only fetched when it's expanded,
  // so the feed stays one query no matter how deep the conversations get.
  const [open_, setOpen] = useState({});
  const [threads, setThreads] = useState({});
  const [replyDraft, setReplyDraft] = useState({});

  const toggleThread = async (it) => {
    const isOpen = !!open_[it.id];
    setOpen({ ...open_, [it.id]: !isOpen });
    if (isOpen || threads[it.id]) return;
    try {
      const { data } = await client.rpc('eb_replies', { p_post: it.id });
      setThreads(t => ({ ...t, [it.id]: Array.isArray(data) ? data : [] }));
    } catch (e) { setThreads(t => ({ ...t, [it.id]: [] })); }
  };
  const sendReply = async (it) => {
    const body = (replyDraft[it.id] || '').trim();
    if (!body || !session) return;
    setReplyDraft({ ...replyDraft, [it.id]: '' });
    try {
      await client.from('eb_posts').insert({
        user_id: session.user.id, body: body.slice(0, 1000), kind: 'post', reply_to: it.id,
      });
      const { data } = await client.rpc('eb_replies', { p_post: it.id });
      setThreads(t => ({ ...t, [it.id]: Array.isArray(data) ? data : [] }));
      // Bump the visible count without refetching the whole feed.
      setItems(list => (list || []).map(x => x.id === it.id ? { ...x, replies: (x.replies | 0) + 1 } : x));
    } catch (e) {}
  };

  const load = async (before) => {
    if (!client) return;
    const { data } = await client.rpc('eb_feed', { p_limit: 30, p_before: before || null });
    const rows = Array.isArray(data) ? data : [];
    setItems(before ? (prev => prev) && ((items || []).concat(rows)) : rows);
    if (rows.length < 30) setMore(false);
  };
  useEffect(() => { load(null); }, [client, session]);

  const post = async () => {
    const body = draft.trim();
    if (!body || !session) return;
    setBusy(true);
    try {
      await client.from('eb_posts').insert({ user_id: session.user.id, body: body.slice(0, 1000), kind: 'strategy' });
      setDraft(''); await load(null);
    } catch (e) {}
    setBusy(false);
  };
  const like = async (it) => {
    if (!session || it.kind !== 'post') return;
    // Optimistic — the DB trigger is the source of truth on next load.
    setItems((items || []).map(x => x.id === it.id
      ? { ...x, i_liked: !x.i_liked, likes: (x.likes | 0) + (x.i_liked ? -1 : 1) } : x));
    try {
      if (it.i_liked) await client.from('eb_post_likes').delete().eq('post_id', it.id).eq('user_id', session.user.id);
      else await client.from('eb_post_likes').insert({ post_id: it.id, user_id: session.user.id });
    } catch (e) {}
  };
  const when = (iso) => {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString();
  };

  return (
    <div style={embedded ? { color: '#EDEFF3' } : { background: EB_INK.bg, minHeight: '100vh', color: '#EDEFF3', fontFamily: "'IBM Plex Sans',system-ui,sans-serif", paddingTop: 92 }}>
